  "body_html": "<img src=\"assets/blg-score.jpg\" alt=\"BLG 3-1 T1比分卡\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 比赛结果（自制图）</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">三天前，Faker在赛后采访里说：\"BLG有争冠实力，不过很可惜，他们半决赛碰到了我们。\"还留下一句\"如果未来是你的，那么证明给我看\"。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">今天，BLG用一场3-1，把这两句话原样奉还。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">据人民电竞，这是<strong>世界赛历史上，LPL队伍首次在BO5中战胜T1</strong>。\"BLG翻盘T1\"\"Bin太有纪律了\"冲上热搜。两年前的今天，T1正是踩着BLG捧起第五座冠军奖杯；两年后的同一个月，BLG亲手把这段历史改写。</p>\n\n<img src=\"assets/blg-team.jpg\" alt=\"BLG赛后谢场\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ BLG赛后向观众致意（图源：Riot Games）</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">01 两年之仇，一次还清</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这魔咒压了BLG整整两年：世界赛三次交手全负——S13瑞士轮0-2、S14瑞士轮0-1、S14决赛2-3。T1在世界赛BO5里，对LPL队伍更是保持全胜。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">赛前Viper放话：\"一定要打破在世界赛不胜T1的魔咒。\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">现在，宣言兑现，魔咒清零。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">02 四局复盘：逆风翻盘，一鼓作气</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>第一局</strong>，开局就挨闷棍：3分钟T1中野下路包夹，Keria的洛收走一血。但BLG的回应是教科书级的——15分钟Xun的纳亚菲利抢下峡谷先锋，Knight奥莉安娜完美大招双杀；27分钟Bin的奎桑提主宰团战，1换4；29分钟ON的诺提勒斯控到不能自理，30分钟推平。MVP：Xun。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>第二局</strong>，T1拿出了世界赛顶级的韧性：Oner的李青偷下大龙，Doran的奥拉夫两度双杀，31分钟团灭BLG扳回一城。这一局的T1，还是那个\"给点机会就能翻盘\"的T1。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>第三局</strong>是整场的转折点：27分钟Xun的潘森大招完美绕后，32分钟小龙团拿下龙魂、果断追击，Viper的伊泽瑞尔双杀，2换4顺势收掉大龙；35分钟Knight的岩雀关键控制锁死战局，赛点到手。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>第四局</strong>，BLG没有再给卫冕冠军任何机会，一鼓作气终结系列赛。</p>\n\n<img src=\"assets/t1-team.jpg\" alt=\"T1赛前代表队\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ T1赛前亮相（图源：Riot Games）</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">03 每一句狠话，都有人接</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这场半决赛最有味道的地方在于：<strong>赛前的每句狠话，都被接住了</strong>。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">Faker说\"BLG有争冠实力，可惜碰到了我们\"——现在遗憾的是T1。Faker说\"如果未来是你的，那么证明给我看\"——BLG用3-1证明了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">而Bin整轮系列赛的稳定发挥，让\"Bin太有纪律了\"成了新热搜——曾经那个容易上头的世一上，如今是全队最稳的一环。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">04 决赛：对面的墙，叫GEN</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">另一边，GEN昨天3-0横扫iG——iG的奇迹之旅止步四强，而Chovy终于在他职业生涯的第十年，第一次踏进决赛。</p>\n\n<img src=\"assets/final-card.jpg\" alt=\"决赛对阵卡\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 决赛对阵（自制图，据官方赛程整理）</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">11月15日（周日）凌晨3点，BLG对GEN。值得一提的是，BLG本届世界赛的晋级之路就是一部\"LPL杀手\"实录：瑞士轮淘汰MSI冠军HLE，八强3-0横扫EWC冠军DK，半决赛掀翻卫冕冠军T1——三支LCK强队，全栽在这条晋级路上。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">现在，只剩最后一堵墙。LPL赛区能否时隔两年再夺S赛冠军，就看这一场了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">评论区聊聊：<strong>决赛你押谁？</strong>BLG的复仇终章，还是GEN与Chovy的十年圆梦？</p>\n\n<p style=\"text-align:center;font-size:14px;color:#999;margin:36px 0 0;line-height:1.8;\">—— 11月15日凌晨3点，不见不散 ——</p>\n\n<p style=\"background:#f5f5f5;padding:12px 16px;font-size:12px;color:#999;line-height:1.8;margin:30px 0 0;border-radius:6px;\">信息来源：人民电竞、英雄联盟赛事官方战报、BLG电子竞技俱乐部官微、sportsseoul达拉斯现场报道、懂球帝、虎扑等公开报道。比赛照片图源Riot Games/赛事官方，比分卡与对阵卡为自制图。</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
