  "body_html": "<img src=\"assets/cr7-jersey.jpg\" alt=\"7号球衣挂起概念图\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 7号球衣概念图（AI创作，非官方素材）</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">北京时间11月5日，41岁的C罗在社交媒体发布告别信与视频，正式宣布从葡萄牙国家队退役。23年国脚生涯，就此落幕。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这个答案，其实夏天就欠下了。7月6日达拉斯，世界杯1/8决赛，葡萄牙0-1憾负西班牙。赛后有记者追问未来，他的回答是：先陪陪家人，不在情绪激动的时候做决定。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">四个月后，他做完了这个决定。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">01 交还7号的人</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">告别信里最戳人的，是这一句：</p>\n\n<p style=\"background:#f7f3ea;padding:18px 20px;border-radius:6px;font-size:15px;color:#1f3a5f;line-height:2;margin:0 0 16px;font-style:italic;\">\"到了该交还国家队7号球衣的时候了。我从来没觉得这件球衣只属于我一个人。但在这23年里，我有幸穿上它，也肩负着捍卫它的责任。\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">23年，他把\"属于\"两个字让给了后辈，把\"捍卫\"两个字留给了自己。视频里他还说：葡萄牙永远在我心中，是时候将这件球衣传承给未来了。</p>\n\n<img src=\"assets/cr7-letter.jpg\" alt=\"告别信金句卡\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 告别信金句 · 据公开报道整理</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">02 一串后无来者的数字</p>\n\n<img src=\"assets/cr7-stats.jpg\" alt=\"C罗国家队生涯数据卡\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 国家队生涯数据（自制图，据公开报道整理）</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>234场，146球。</strong>男子国家队历史出场纪录、历史进球纪录，两项都在他手里。而且这两串数字短期内看不到挑战者——第二名连他的零头都还差着一大截。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>3座国家队奖杯：</strong>2016年欧洲杯、2019年欧国联、2025年欧国联。从2004年本土欧洲杯决赛后坐在草皮上哭的少年，到2016年决赛伤退却站在场边\"指挥\"的老队长，再到两年一冠的欧国联时代——葡萄牙的黄金二十年，就是他的二十年。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>连续六届世界杯进球</strong>，历史第一人。2006到2026，整整二十年，每一届世界杯都能看到这个7号起跳、甩头、张开双臂滑跪。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">03 纪录终会被超越，他说</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">告别信里还有一句话，很多人第一遍读会略过：</p>\n\n<p style=\"background:#f7f3ea;padding:18px 20px;border-radius:6px;font-size:15px;color:#1f3a5f;line-height:2;margin:0 0 16px;font-style:italic;\">\"奖杯与纪录，终有被超越的一天，但为国出战的记忆永存。\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这大概就是他和纪录的关系：拼命去创造，坦然目送它被拿走。正如他在世界杯出局那天说的——\"Sometimes we win, sometimes we lose, and we need to keep going.\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">至于那件7号会落到谁的肩上：信里没说，视频里没说。下一个穿上它的人，接过的不是号码，是23年攒下的债务——每次触球，都会有人拿来和那个男人比。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这大概就是告别信里那句\"这不是一个容易的决定\"的分量。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">04 你记忆里的第一个画面</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">是2004年欧洲杯那个哭鼻子的17岁小孩？是2016年巴黎之夜场边挥手的\"编外教练\"？还是2026年达拉斯夜里的那个背影？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">评论区聊聊：<strong>你的C罗国家队记忆，从哪个画面开始？</strong>点赞最高的故事，下期放进正文。</p>\n\n<p style=\"text-align:center;font-size:14px;color:#999;margin:36px 0 0;line-height:1.8;\">—— 感谢你读到这里，也谢谢那个7号 ——</p>\n\n<p style=\"background:#f5f5f5;padding:12px 16px;font-size:12px;color:#999;line-height:1.8;margin:30px 0 0;border-radius:6px;\">信息来源：C罗本人社交媒体告别信与视频、FIFA官网、齐鲁晚报/光明网/锦观新闻等公开报道。数据截至2026年11月5日官宣。首图及概念图为AI创作（非官方素材），数据卡为自制图，据公开报道整理。</p>\n"

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
