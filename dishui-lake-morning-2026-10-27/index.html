<script id="post-data" type="application/json">
{
  "title": "头班车赶不上的滴水湖日出，我还是去了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月27日 09:29",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 10px;\"><img src=\"assets/cover.png\" style=\"width:100%;display:block;border-radius:3px;\" alt=\"滴水湖清晨\"></p>\n<p style=\"font-size:11px;color:#9a9388;letter-spacing:1px;text-align:center;margin:8px 0 30px;\">上海 · 临港新片区 · 环湖一圈 8.3 公里</p>\n\n<p style=\"font-size:15px;color:#5f594f;line-height:1.9;letter-spacing:0.5px;margin:0 0 30px;\">5:50 从龙阳路出发，6:50 到湖边，太阳 6:07 就升完了。写给想在一个空湖边上待一上午的人——交通、路线、早饭、九点半之后的去处，一次说清楚。</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">周六，闹钟定在五点二十。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">出门时天还黑着，小区门口只有垃圾车在响。从浦西去滴水湖，等于横穿整个上海。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">16 号线龙阳路站，5:50 的头班车。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">车厢里坐得挺满。一半人闭眼补觉，一半人穿跑鞋、背越野包，脚边立着登山杖。邻座大哥拎个保温杯，问我：去看日出啊？我说是。他笑了一下：<strong>那你起晚了。</strong></p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">我当时没懂。一个小时后，站在滴水湖站的出口，我懂了。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#c05532;letter-spacing:3px;margin:54px 0 0;\">— 01 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#25231f;letter-spacing:0.5px;margin:10px 0 28px;\">头班车，赶不上日出</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">10 月末，上海的日出是 <strong style=\"color:#c05532;\">6:07</strong>。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">16 号线从龙阳路到滴水湖，全程五十多分钟。头班车 5:50 发，出站已经 6:45。太阳早就升完了，天光铺在湖面上，亮得晃眼。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">所以，想靠地铁去滴水湖看日出，这条路本身就不成立。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">真要看，两个办法：前一晚住临港，或者自驾。临港再往东，南汇嘴观海公园是上海最早见到日出的地方，从滴水湖开过去二十来分钟。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">不过，如果你不执着那几分钟，头班车反而是最好的选择。6:50 的滴水湖，几乎没有人。</p>\n\n<p style=\"border-left:3px solid #c05532;padding:4px 0 4px 18px;margin:34px 0;font-size:17px;color:#4a4740;line-height:1.8;letter-spacing:0.5px;\">滴水湖的清晨，不靠一场日出撑场面。</p>\n\n<p style=\"margin:34px 0 8px;\"><img src=\"assets/timeline.png\" style=\"width:100%;display:block;border-radius:3px;\" alt=\"滴水湖清晨时间表\"></p>\n<p style=\"font-size:11px;color:#9a9388;letter-spacing:0.5px;text-align:center;margin:8px 0 34px;\">一个早上，五个小时，从市区到湖边</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#c05532;letter-spacing:3px;margin:54px 0 0;\">— 02 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#25231f;letter-spacing:0.5px;margin:10px 0 28px;\">六点五十的湖，是另一个上海</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">从滴水湖站往湖边走的这十分钟，风先到，水汽后到。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">西岸有个大爷在钓鱼，鱼竿架在栏杆上，人坐在小马扎上刷手机。跑团五六个人，短裤，从身边过去，脚步声在空地上特别清楚。环卫工人扫落叶，扫帚刮过地面的声音，一阵一阵。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">湖是正圆，直径 2.5 公里。对岸的房子看着很近，走起来不是。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">环湖景观带有三条道：最靠水的是滨湖步道，中间是漫步道，外面是跑步道，地面颜色不一样，跟着颜色走就不会串道。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\"><strong>市区六点半的地铁站是打仗，滴水湖六点半的湖边是散场。</strong>同一个人，站在两个地方，呼吸都不一样。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#c05532;letter-spacing:3px;margin:54px 0 0;\">— 03 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#25231f;letter-spacing:0.5px;margin:10px 0 28px;\">8.3 公里，别一上来就想走完</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">滴水湖周长 <span style=\"background:#f6e3d8;color:#a8452a;padding:1px 4px;\">8.3 公里</span>，面积 5.56 平方公里。数字不大，走起来是另一回事。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">因为湖是正圆，没有近路。走到一半想撤，要么原路返回，要么硬着头皮走完。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">第一次来，建议只走西岸到北岸这一段，五公里左右，景最密：西岸看水，北岸看楼，金融湾那片新楼还在往上长。</p>\n\n<p style=\"margin:30px 0 8px;\"><img src=\"assets/route.png\" style=\"width:100%;display:block;border-radius:3px;\" alt=\"滴水湖环湖路线示意图\"></p>\n<p style=\"font-size:11px;color:#9a9388;letter-spacing:0.5px;text-align:center;margin:8px 0 34px;\">西岸出发，顺时针往北，一圈刚好把湖看完</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:28px 0 8px;font-size:13.5px;color:#3b3833;\">\n  <tr>\n    <td style=\"padding:10px 6px;border-bottom:1px solid #e6ddcd;font-size:11.5px;color:#9a8c76;letter-spacing:1px;\">怎么走</td>\n    <td style=\"padding:10px 6px;border-bottom:1px solid #e6ddcd;font-size:11.5px;color:#9a8c76;letter-spacing:1px;\">一圈用时</td>\n    <td style=\"padding:10px 6px;border-bottom:1px solid #e6ddcd;font-size:11.5px;color:#9a8c76;letter-spacing:1px;\">适合谁</td>\n  </tr>\n  <tr>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">跑步</td>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">45–55 分钟</td>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">想出汗、赶时间</td>\n  </tr>\n  <tr>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">步行</td>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">两小时上下</td>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">拍照、带娃、不赶</td>\n  </tr>\n  <tr>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">骑行</td>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">30–40 分钟</td>\n    <td style=\"padding:12px 6px;border-bottom:1px solid #f0e9dc;\">不想走、想看全</td>\n  </tr>\n</table>\n<p style=\"font-size:11px;color:#9a9388;text-align:center;margin:6px 0 22px;\">按匀速估的，停下来拍照另算</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">跑的人注意东岸。那段风最硬，逆风的时候会怀疑人生，帽子记得压紧。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">骑的人去一号码头。休闲自行车按车型 20、40、60 块一辆，以现场为准；共享单车也能骑，环湖路没有坡，很顺。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\"><strong>一个正圆形的湖，最大的好处是没有死角，最大的坏处是你永远知道还剩多少。</strong></p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#c05532;letter-spacing:3px;margin:54px 0 0;\">— 04 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#25231f;letter-spacing:0.5px;margin:10px 0 28px;\">早饭，是这趟唯一的坑</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">湖边那些好看的店，基本都要十点才开。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">朵云书院·滴水湖店，在港城广场五到七楼，10:00–20:00。一尺花园滴水湖西岸店，环湖西一路 858 号，也是 10:00–20:00。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">所以早上七点半，湖边能买到热东西的地方，不多。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">我的办法是出站先在便利店解决：饭团、茶叶蛋、一杯烫手的豆浆。坐在湖边长椅上吃，风把塑料袋吹得哗哗响，得用手压着。</p>\n\n<p style=\"border-left:3px solid #c05532;padding:4px 0 4px 18px;margin:34px 0;font-size:17px;color:#4a4740;line-height:1.8;letter-spacing:0.5px;\">在滴水湖，早上最靠谱的一顿，是便利店那杯热豆浆。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#c05532;letter-spacing:3px;margin:54px 0 0;\">— 05 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#25231f;letter-spacing:0.5px;margin:10px 0 28px;\">九点半，湖醒了</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">九点半，天文馆开门。临港大道 380 号，周一闭馆，实名预约，周末的票要提前抢。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">十点，朵云书院开门。二十米高的书山，五到七楼，靠窗的位置能看见整片湖。手机拍照可以，专业相机要先问一声。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">差不多同一时间，一尺花园也开了。玻璃房、绿植、书，适合坐着发呆。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">北岸金融湾的“荣耀之环”已经建成，直径 153 米。官方说今年开放，但能不能上去、怎么上去，去之前最好查一下最新消息，别白跑。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">我那天没进去。在湖边坐到十点，太阳升高，湖面从灰蓝变成白色，风也起来了。人一多，湖就不是早上那个湖了。</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">回程的 16 号线，车厢里全是刚逛完天文馆的小孩。我靠着车窗睡了一觉，醒来已经到龙阳路。</p>\n\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:36px 0 22px;\">如果你也去过滴水湖的清晨，评论区聊聊：你是绕湖走完 8.3 公里那一派，还是找张长椅坐着不动那一派？</p>\n<p style=\"font-size:15px;color:#3b3833;line-height:1.95;letter-spacing:0.4px;margin:0 0 22px;\">我两种都试过。说实话，坐着那派，比较省腿。</p>\n\n<p style=\"font-size:11.5px;color:#9a8c76;letter-spacing:2px;margin:46px 0 10px;\">实 用 信 息</p>\n<p style=\"font-size:13.5px;color:#4a4740;line-height:2;margin:0 0 6px;\"><strong style=\"color:#25231f;\">交通</strong>　16 号线龙阳路 5:50 首班，滴水湖 6:00 首班返程，末班 22:30。</p>\n<p style=\"font-size:13.5px;color:#4a4740;line-height:2;margin:0 0 6px;\"><strong style=\"color:#25231f;\">日出</strong>　10 月末约 6:07，出发前查当天时间，阴天就别硬等。</p>\n<p style=\"font-size:13.5px;color:#4a4740;line-height:2;margin:0 0 6px;\"><strong style=\"color:#25231f;\">装备</strong>　防风外套、帽子。湖边风大，体感比市区凉不少。</p>\n<p style=\"font-size:13.5px;color:#4a4740;line-height:2;margin:0 0 6px;\"><strong style=\"color:#25231f;\">补给</strong>　地铁站便利店、环湖自动售卖机；湖边餐厅多十点后营业。</p>\n\n<p style=\"font-size:12px;color:#a9a196;letter-spacing:1px;margin:38px 0 0;text-align:center;\">#滴水湖 #临港新片区 #上海周末</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
