{
  "title": "明年7月通新铁路！告别16号线挤不上的日子，滴水湖环湖骑行约起？",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月14日 08:05",
  "location": "北京",
  "is_original": true,
  "body_html": "\n<!-- 开篇首图 -->\n<p style=\"margin:0 0 18px;line-height:0;\"><img src=\"assets/dishui-lake-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#888;text-align:center;margin:-10px 0 40px;letter-spacing:1px;\">图说：临港滴水湖全景航拍 · 来源：临港管委会</p>\n\n<!-- 开头：感官+痛点开场 -->\n<p style=\"font-size:17px;font-weight:bold;color:#1a1a1a;line-height:1.6;margin:0 0 16px;\">上周六坐16号线去滴水湖。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">早高峰挤进去的时候，我数了一下，脚边能放下一个包就不错了。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">旁边一个穿骑行服的小伙子，车筐里塞着头盔，被挤得脸都贴玻璃上了。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\">\"等新铁路通了就好了\"，他跟我说这话的时候，是真心实意的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">巧的是，这条新铁路这两周刚上了新闻头条。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">而且通车时间，比我之前以为的还要近。</p>\n\n<!-- 章节一 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">先来说个正经喜讯</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">今年8月31号，市域铁路南汇支线完成了全线结构贯通。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">市政府新闻发布会上给的时间表是——<strong style=\"color:#0a84ff;\">明年7月建成通车</strong>。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\">没开玩笑，就是2027年7月。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">这条线全长34.86公里，设6个站：</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">浦东T3航站楼站 ← 鹏翔路站 ← 滨海森林公园站 ← 星海湾路站 ← <strong style=\"color:#0a84ff;\">滴水湖北站</strong> ← 上海东站站。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">从滴水湖到浦东机场、上海东站，一条线直通。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\">以后外地朋友来上海，落地就能直接坐地铁去滴水湖露营——想想都爽。</p>\n\n<!-- 地铁图片 -->\n<p style=\"margin:40px 0 14px;line-height:0;\"><img src=\"assets/dishui-lake-metro.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#888;text-align:center;margin:0 0 14px;letter-spacing:1px;\">图说：滴水湖地铁站 · 来源：临港管委会</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">不止南汇支线。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">南枫线也在推进中，滴水湖站是关键节点。S2沪芦高速明年也要拓宽改造。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">滴水湖核心区公交站点500米覆盖率，今年目标是做到100%。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\">说白了就是——临港正在疯狂补课交通。</p>\n\n<p style=\"font-size:13px;background:#f5f5f5;color:#666;padding:14px 16px;border-radius:8px;margin:0 0 40px;\">\n<span style=\"color:#999;\">📌 敲黑板：</span><br>\n市域铁路是上海地铁的\"大哥\"级别，速度比普通地铁快不少，跨区通勤专门造的。南汇支线通车后，临港到市区的通勤时间会明显缩短，临港的房价……懂的都懂。\n</p>\n\n<!-- 章节二 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">现在去临港，怎么去最舒服</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">南汇支线还没通，说说当前的几种打开方式，各有各的爽点：</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\"><strong style=\"color:#1a1a1a;\">16号线地铁直达</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">龙阳路上车，滴水湖站直接下车。缺点就是早高峰挤，单程约1小时。非高峰时段好很多，甚至能找到座位看湖。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\"><strong style=\"color:#1a1a1a;\">开车走S2沪芦高速</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">市区过去大概45分钟，过路费15块。湖边酒店、商场基本都有免费停车场。周末推荐上午9点前到，避开停车场高峰。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\"><strong style=\"color:#1a1a1a;\">骑行或徒步</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">滴水湖有完整的环湖绿道，直径6.66公里（注意是直径不是周长），环湖一圈大概40多公里。共享单车也能骑，1.5小时慢摇一圈。</p>\n\n<!-- 一号码头图片 -->\n<p style=\"margin:40px 0 14px;line-height:0;\"><img src=\"assets/dishui-lake-pier.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#888;text-align:center;margin:0 0 14px;letter-spacing:1px;\">图说：滴水湖一号码头 · 来源：临港管委会</p>\n\n<!-- 章节三 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">到了滴水湖，值得去的几个地方</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">我尽量说点不是网上抄烂的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:30px 0 6px;\"><strong style=\"color:#1a1a1a;\">★ 朵云书院（港城广场店）</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">5-7楼，通天书架是真的震撼。10点前进5楼，满足最低消费就能抢到靠窗位置，湖景直接怼脸上。文创产品挺有意思的，别错过。</p>\n\n<p style=\"font-size:13px;background:#fff8e1;color:#8b6914;padding:12px 14px;border-radius:6px;margin:0 0 24px;\">\n<span style=\"font-weight:bold;\">💡 暗知识：</span>别在周末下午去，人挤到转不开身。工作日的下午3点后基本没什么人，咖啡也续杯。\n</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 6px;\"><strong style=\"color:#1a1a1a;\">★ 一号码头</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">半开的伞状水泥框架，工业风性冷淡，拍照巨出片。晴天湖水蓝得像假的，手机随手一拍都不用滤镜。日落时分过去，金色湖面配灰架子，那反差感。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:30px 0 6px;\"><strong style=\"color:#1a1a1a;\">★ 环湖骑行</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">推荐起点滴水湖洲际酒店，顺时针方向。沿途会经过银杏、水杉林，秋天那个颜色层次绝了。租单车推荐美团，环湖一圈1.5小时足够。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\">&nbsp;</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 6px;\"><strong style=\"color:#1a1a1a;\">★ 耀雪冰雪世界</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">滴水湖畔，室内滑雪场。夏天避暑神器，冬天更有感觉。新手也能玩，有专门的教学区和儿童乐园。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 6px;\"><strong style=\"color:#1a1a1a;\">★ 西岛·中银金融中心</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">今年1月刚竣工，临港目前最高的楼。湖边远观就够了，近看更震撼。晚上楼身有灯光，拍夜景值得来。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\">&nbsp;</p>\n\n<!-- 章节四 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">一丢丢实用小提醒</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\"><strong style=\"color:#1a1a1a;\">吃饭</strong>：临港主城区有港城广场、临港宝龙广场两大商圈，选择不算多但够吃。朵云书院楼下有个日料还不错。想体验湖边情调，可以试试滴水湖洲际或者皇冠假日的自助餐。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\"><strong style=\"color:#1a1a1a;\">住宿</strong>：预算够直接滴水湖洲际酒店，就在湖边，下楼就是环湖步道。性价比选地铁附近的如家、全季，步行10分钟到湖边。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\"><strong style=\"color:#1a1a1a;\">拍照好时段</strong>：日落前1小时（现在差不多下午5-6点），湖面颜色是金红色的。晚上一号码头和中银金融中心的灯光秀值得拍。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\"><strong style=\"color:#1a1a1a;\">避坑</strong>：周末不要开车去湖边的网红餐厅，停车位少到离谱。共享单车环湖注意防晒，湖边没什么遮挡。</p>\n\n<!-- 结尾互动 -->\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:40px 0 14px;\">其实去了好几次滴水湖之后，发现一件事。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">它不像外滩那么热闹，也不像朱家角那么商业化。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">就是一个很圆、很大、很蓝的湖，加上一些还在长身体的写字楼。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 24px;\">但不知道为什么，在湖边站一会儿，人就松弛下来了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 14px;\">可能这就是上海缺的那种\"空\"吧。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:40px 0 14px;text-align:center;\">明年南汇支线通了，我一定会第一时间坐一趟。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:0 0 40px;text-align:center;\"><span style=\"color:#0a84ff;\">&gt;&gt; 你呢？评论区聊聊你印象最深的一次滴水湖之行 &lt;&lt;</span></p>\n\n<p style=\"font-size:12px;color:#aaa;text-align:center;margin:60px 0 0;letter-spacing:1px;\">本文信息参考：临港管委会、上海市交通委员会、澎湃新闻</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
