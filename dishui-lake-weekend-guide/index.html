{
  "title": "滴水湖，不只是打卡｜从「山河月宴」到草坪露营，这座新城正在把周末玩出花",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月27日 18:02",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:13px;color:#9a8c6a;text-align:center;margin:0 0 14px;letter-spacing:2px;\">临港生活志 · 下午篇</p>\n<p style=\"font-size:26px;font-weight:bold;color:#1a1a1a;text-align:center;margin:0 0 8px;line-height:1.3;\">滴水湖，不只是打卡</p>\n<p style=\"font-size:17px;color:#555;text-align:center;margin:0 0 28px;\">从「山河月宴」到草坪露营，这座新城正在把周末玩出花</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/dishui-aerial.jpg\" style=\"max-width:100%;width:100%;border-radius:6px;\"></p>\n<p style=\"font-size:13px;color:#999;text-align:center;margin:6px 0 36px;\">临港滴水湖航拍 · 供图：临港管委会</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">上周六下午两点，我从地铁16号线滴水湖站出来，沿着湖边往广场方向走。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">风里先飘过来的，是烤串的烟味和冰美式的香。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">转过一道弯，40多个摊位沿着湖岸铺开，红的黄的遮阳棚支成一条长龙，\"山河月宴\"四个大字挂在正中间。这就是国庆期间刷屏朋友圈的那个美食生活节——虽然长假结束了，但商家们说，**周末照样开，不打烊**。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">我在一个卖云南小锅米线的摊前排队，旁边两个穿校服的小姑娘蹲在地上啃烤苕皮，酱汁蹭了半张脸也不管。对面帐篷里传出乐队的调音声，bass的低音隔着水面传过来，震得湖面起了一层细碎的波纹。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 28px;\">这不是我第一次来滴水湖。但这一次，我突然发现这座湖的玩法，**早就不是围着湖骑车一圈那么简单了**。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2b2b2b;margin:8px 0 26px;\">湖滨市集：从\"路过\"到\"坐下来\"</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">\"山河月宴\"是今年国庆的重头戏，但它其实只是临港最近一波市集潮里最显眼的一个。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">从9月底到现在，滴水湖广场、莫比乌斯公园、北岛肆号——几乎每个临水的开阔地带，都有帐篷支起来。卖咖啡的、卖手作的、卖二手书的，还有那个永远在排队的\"星球冰淇淋\"摊位。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">我特意跟摊主聊了两句。一个从松江开过来的咖啡摊主说，周末两天能卖四百多杯，比他在市区的店还好。\"主要是这儿地方敞亮，客人愿意坐下来，一坐就是一下午。\"</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 28px;\">他说的\"坐下来\"，大概就是临港这两年变化最大的地方。以前大家来临港，都是\"到了、拍张照、走了\"。现在不一样了——</p>\n\n<p style=\"background:#f7f5f1;padding:18px 22px;border-radius:6px;margin:0 0 28px;font-size:15px;color:#555;line-height:1.9;\">\n<p style=\"margin:0 0 8px;color:#8b4a2b;font-weight:bold;font-size:16px;\">📌 暗知识：市集什么时段去最值？</p>\n<p style=\"margin:0;\">想好好逛吃，下午两点到四点去最合适——人还没挤到爆，烤串刚出炉，咖啡也不会凉。等到晚上六七点，灯光亮起来，乐队开始演出，那是另一种热闹。但如果你想找个安静的位置坐下来吹湖风，<span style=\"color:#8b4a2b;font-weight:bold;\">北岛比主广场人少一半</span>。</p>\n</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2b2b2b;margin:8px 0 26px;\">草坪上的两种周末</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">今年国庆，临港同时开了两个\"局\"：草坪社交节和国风漫游季。风格完全不同，但隔着湖能互相听见对方的音乐。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">草坪社交节在湖畔南岸，天幕一顶挨一顶。有人在掼蛋，有人在狼人杀，有人什么都不做就躺在野餐垫上看云。带着狗来的人不少，金毛和柯基在草地上追着跑，主人在后面喊慢点。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">国风漫游季在莫比乌斯公园，那边是另一个世界。穿汉服的姑娘提着鱼灯在树荫下走，孩子拿着\"银票\"在摊位间买小吃，夜幕降临时一只三层楼高的鳌鱼灯亮起来，缓缓游过湖面——我朋友圈里至少有五个人发了那条小视频。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 28px;\">有意思的是，两边的人也会串门。穿卫衣的小伙子跑去国风区拍合影，穿汉服的姑娘跑过来天幕下蹭咖啡。**一座湖，两种活法，互不打扰，还偶尔客串一下。**</p>\n\n<p style=\"margin:28px 0 0;\"><img src=\"assets/dishui-skyline.jpg\" style=\"max-width:100%;width:100%;border-radius:6px;\"></p>\n<p style=\"font-size:13px;color:#999;text-align:center;margin:6px 0 36px;\">滴水湖天际线 · 供图：临港管委会</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2b2b2b;margin:8px 0 26px;\">实用信息卡 · 周末来临港怎么玩</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">直接上干货。我把这次踩点摸到的信息整理了一下，都是能用得上的。</p>\n\n<p style=\"background:#f0f4f8;padding:20px 24px;border-radius:6px;margin:0 0 18px;\">\n<p style=\"margin:0 0 10px;font-weight:bold;color:#1a1a1a;font-size:16px;\">🚇 怎么去</p>\n<p style=\"margin:0;font-size:15px;color:#444;line-height:1.9;\">地铁16号线「滴水湖」站，2号口出来就是湖边。市区出发龙阳路换乘，全程大概45分钟。开车的话申港大道下来直接上环湖路，周末停车位还算够，但上午十点之后热门区域可能要绕一圈。</p>\n</p>\n\n<p style=\"background:#f0f4f8;padding:20px 24px;border-radius:6px;margin:0 0 18px;\">\n<p style=\"margin:0 0 10px;font-weight:bold;color:#1a1a1a;font-size:16px;\">🍜 吃什么</p>\n<p style=\"margin:0;font-size:15px;color:#444;line-height:1.9;\">湖滨市集是首选——不用挑，哪家排队人多就哪家。想坐下来正经吃，<strong>滴水湖洲际酒店的彩丰楼</strong>（粤菜）和一号码头附近的<strong>皎皎南炉</strong>（融合菜）都不错。朵云书院滴水湖店楼下有家一尺花园，咖啡和环境都在线，就是周末人多。</p>\n</p>\n\n<p style=\"background:#f0f4f8;padding:20px 24px;border-radius:6px;margin:0 0 18px;\">\n<p style=\"margin:0 0 10px;font-weight:bold;color:#1a1a1a;font-size:16px;\">🎯 推荐路线（半天版）</p>\n<p style=\"margin:0;font-size:15px;color:#444;line-height:1.9;\">下午2点地铁站出来 → 先去<b>朵云书院</b>买杯咖啡逛半小时 → 沿湖走到<b>山河月宴市集</b>吃逛到4点半 → 骑车或散步到<b>北岛</b>找块安静的草坪坐一会儿 → 看日落 → 找个湖边餐厅吃晚饭。</p>\n</p>\n\n<p style=\"background:#f0f4f8;padding:20px 24px;border-radius:6px;margin:0 0 28px;\">\n<p style=\"margin:0 0 10px;font-weight:bold;color:#1a1a1a;font-size:16px;\">💡 省钱小技巧</p>\n<p style=\"margin:0;font-size:15px;color:#444;line-height:1.9;\"><strong>环湖消费券</strong>还在发——关注\"临港发布\"公众号，每周五六日可以领「满50减30」券，名额有限先到先得。市集摊位大部分都能用。耀雪冰雪世界现在滑雪学校课程也有折扣，喜欢滑雪的可以顺带安排。</p>\n</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2b2b2b;margin:8px 0 26px;\">一个彩蛋：滴水湖运动中心开工了</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">写稿的时候刷到一个消息——**9月28日，滴水湖运动中心（一期）正式开工**。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">这个项目在滴水湖核心片区，环湖路内侧，一期工程占地不算小。根据规划，以后会有游泳馆、羽毛球馆、篮球场这些常规场馆，还加了一些壁球、攀岩之类的新潮项目。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">临港管委会的公告里没写具体什么时候建成，但周边居民已经在讨论了。有人说终于不用每次都开车去张江打球，有人说等游泳馆起来冬天就能带娃游泳。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 28px;\">这件事让我有点感慨。几年前滴水湖周边还在填路、种树、等地铁。现在地铁通了、天文馆开了、冰雪世界起来了，连运动中心都开工了。**这座新城的骨架，正在一点一点长出血肉。**</p>\n\n<p style=\"margin:28px 0 0;\"><img src=\"assets/dishui-sunset.jpg\" style=\"max-width:100%;width:100%;border-radius:6px;\"></p>\n<p style=\"font-size:13px;color:#999;text-align:center;margin:6px 0 36px;\">滴水湖火烧云 · 供图：临港管委会</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">回程的地铁上，我翻了翻手机里的照片。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">有烤串冒着的热气，有湖面上的金色波纹，有天幕下一群人笑着围坐的侧影。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">临港以前给人的印象是\"远\"——地铁终点站、房价洼地、人烟稀少。但这几次去，我越来越觉得，<strong>\"远\"其实是一种还没被消耗的弹性</strong>。这里地方够大，湖面够宽，连风都比市区凉快两度。你可以躺在草坪上什么都不做，也可以跟着市集热闹一下午。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 16px;\">而它最棒的地方是——<span style=\"color:#8b4a2b;font-weight:bold;\">这座湖还在慢慢长大</span>。运动中心刚开工，环湖景观带还在继续修，总有新的事情在发生。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 36px;\">周末想放空的时候，不妨再来一次。</p>\n\n<p style=\"font-size:14px;color:#888;text-align:center;margin:40px 0 8px;\">——</p>\n<p style=\"font-size:14px;color:#888;text-align:center;margin:0 0 6px;\">你最近一次去滴水湖是什么时候？</p>\n<p style=\"font-size:14px;color:#888;text-align:center;margin:0;\">评论区聊聊你的玩法👇</p>\n"
}

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
