<script id="post-data" type="application/json">
{
  "title": "临港买房er集合！藏在双河之间的半岛住区，今起认购啦",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月5日 19:26",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/bandao-location.jpg\" alt=\"开云·海越半岛 区位示意图\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 项目区位效果图，仅供参考，最终以开发商公示为准</p>\n\n<p style=\"text-align:center;margin:30px 0 8px;font-size:13px;letter-spacing:4px;color:#126e82;\">临港买房er集合📢</p>\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1a1a1a;margin:0 0 6px;line-height:1.4;\">青创湾\"半岛\"时刻来了</p>\n<p style=\"text-align:center;font-size:15px;color:#666;margin:0 0 30px;line-height:1.6;\">开云·海越半岛 · 今起认购 · 372套</p>\n\n<p style=\"font-size:15px;color:#333;line-height:2.1;margin:0 0 12px;text-align:center;\">临港103板块</p>\n<p style=\"font-size:15px;color:#333;line-height:2.1;margin:0 0 12px;text-align:center;\">终于迎来了它的\"半岛\"时刻</p>\n<p style=\"font-size:15px;color:#333;line-height:2.1;margin:0 0 12px;text-align:center;\">开云·海越半岛</p>\n<p style=\"font-size:15px;color:#333;line-height:2.1;margin:0 0 28px;text-align:center;\"><strong>认购通道正式开启啦！</strong></p>\n\n<p style=\"background:#f4f8f9;border-left:4px solid #126e82;padding:14px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">一个藏在双河之间的半岛住区，兼顾通勤便利与自然惬意。11月5日9时起开始认购登记，11月9日12时截止，11月14日开盘。一起来解锁这份临港安家新选择~</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#126e82;margin:46px 0 20px;\">这次推什么？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">项目采用一期开发、一期销售的模式开发建设。本次开盘为第一批次预售，共计<strong>372套</strong>，总面积<strong>4.2万㎡</strong>，均为<strong>13至17层高层住宅</strong>，三面环水的半岛地形，在临港新房中并不多见。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">主力户型建面约<strong>99-187㎡</strong>，销售备案均价为<strong>32900元/平方米</strong>。这个面积段覆盖了从首改到深度改善的需求，销售价格亲民，对于在临港工作、或者看好临港长期价值的购房者来说，这是一个不需要\"踮脚到极限\"的上车机会。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">值得一提的是，首开认购享受<strong>总价95折</strong>，并有<strong>1万元优惠购车位</strong>活动。以热门的约99㎡户型为例，过会总价在230万左右，叠加首开优惠后进一步下探，同板块内100平新房总价普遍在300万左右——首开的价格诚意，可以说相当足了。</p>\n\n<img src=\"assets/bandao-plan.jpg\" alt=\"楼栋分布示意图\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 楼栋分布示意图，仅供参考，最终以开发商公示为准</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#126e82;margin:46px 0 20px;\">开云·海越半岛亮点一览</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 16px;\">\n✅ <strong>13-17层小高层，无连廊设计</strong><br>\n楼栋排布宽松，采光、通风条件优秀，居住私密性拉满，居住舒适度加分。\n</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 16px;\">\n✅ <strong>主力建面约99-187㎡，户型选择丰富</strong><br>\n热门约99㎡、120㎡飞机户型，格局方正、全明通透，刚需首套、三口之家自住友好；同时还有更大面积改善户型，满足大家庭的居住需求。\n</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 16px;\">\n✅ <strong>首开价格亲民</strong><br>\n首开认购享总价95折 + 1万元优惠购车位活动，具体以售楼处公示为准。\n</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 28px;\">\n✅ <strong>容积率2.2，绿化率约35%</strong><br>\n社区规划了充足的园林景观，下楼就是绿植花园，茶余饭后散步遛弯，遛娃休闲都有好去处。\n</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#126e82;margin:46px 0 20px;\">周边配套：不用等的现成资源</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>🚇 便捷交通</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">临港布局沪乍杭铁路（在建）、沪舟甬铁路（规划）、南汇支线（在建）、南枫线（在建）、地铁16号线，临港主城轨交线，搭配S2/S3高速、G1503绕城高速、两港大道快速路，轨道与高快速路协同，通达全城、联动长三角。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>🌳 生态文旅</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">项目坐拥双滨水景观，毗邻莫比乌斯科学公园。周边排布春花秋色公园、南汇嘴观海公园等城市绿地；上海天文馆、海昌海洋公园、耀雪冰雪世界、滴水湖剧院等人文文旅资源环绕，休闲体验选择丰富。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>🛍️ 繁华商业</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">自带千平社区商业，近享港城新天地、港城广场、海港中心（在建中）、莫比乌斯公园\"顶科晶耀\"商业区（已开业）等商业综合体，购物、餐饮、娱乐一站式轻松畅享。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>🏫 教育&医疗</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">青创湾集聚<strong>12所学校</strong>，构建全龄段教育布局，项目周边优质教育环绕，守护孩子成长无忧。项目临近三甲<strong>上海市第六人民医院（临港院区）</strong>，为家人健康保驾护航。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#126e82;margin:46px 0 20px;\">安家临港，还有这些政策助力</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">今年以来，楼市政策面持续友好：8月20日上海六部门联合出台\"沪八条\"，从公积金、信贷、\"以旧换新\"购房补贴等方面优化购房环境；国庆假期上海新建商品住宅成交面积同比翻倍，市场暖意可见。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">临港这边，人才政策也在持续加码。符合认定条件的优秀人才购房补贴<strong>最高可达500万元</strong>；青年人才还可申请最高<strong>10.4万元</strong>一次性安家补贴、每月最高<strong>5000元</strong>租房补贴，\"青春驿站\"提供最长2个月免费住宿。好房子加上好政策，这波诚意临港给足了！政策认定条件详见临港新片区管委会官方发布。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#126e82;margin:46px 0 20px;\">认购须知</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 20px;\">\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;width:32%;\">认购登记时间</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">2026年11月5日9时 - 2026年11月9日12时</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">认购登记地点</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">上海市浦东新区美人蕉路616弄3-5号（开云海越半岛销售中心）</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">认购登记意向金</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">人民币3万元/套，认购人名下借记卡（不接受信用卡）</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">首开优惠</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">首开认购享受总价95折，并有1万元优惠购车位活动（更多优惠详情可咨询售楼处）</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">售楼处电话</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">021-58538006</td>\n</tr>\n</table>\n\n<p style=\"background:#fff3cd;border-left:4px solid #e0a800;padding:14px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">*特别提示：11月9日到场办理认购的客户，须于当日上午10:00前进场，方可收取认购登记材料并办理认购手续。因相关系统录入设有时限，逾时进场可能导致当日无法完成认购登记手续，请购房人合理预留到场时间。认购所需材料请提前咨询售楼处备齐。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#126e82;margin:46px 0 20px;\">项目信息</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 28px;\">\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;width:32%;\">开发公司</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">上海顶科经济发展有限公司</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">项目地址</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">上海市浦东新区美人蕉路606弄、618弄</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">均价</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">销售备案均价为32900元/平方米</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">户型面积段</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">99-187平方米</td>\n</tr>\n<tr>\n<td style=\"padding:12px 10px;border:1px solid #ddd;background:#f4f8f9;font-weight:bold;\">售楼处地址</td>\n<td style=\"padding:12px 10px;border:1px solid #ddd;\">上海市浦东新区美人蕉路616弄3-5号</td>\n</tr>\n</table>\n\n<p style=\"text-align:center;font-size:17px;color:#1a1a1a;line-height:2;margin:40px 0 8px;\"><strong>科创热土之上</strong></p>\n<p style=\"text-align:center;font-size:17px;color:#1a1a1a;line-height:2;margin:0 0 24px;\"><strong>静享半岛慢生活</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">开云海越半岛认购火热进行中，有意向的小伙伴不要错过哦。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">还想看户型拆解、人才补贴认定攻略的，评论区扣个\"1\"，人多我们下期专门出一篇👇</p>\n\n<p style=\"text-align:center;font-size:14px;color:#999;margin:36px 0 0;line-height:1.8;\">—— 持续锁定，为你带来临港一手安家资讯 ——</p>\n\n<p style=\"background:#f5f5f5;padding:12px 16px;font-size:12px;color:#999;line-height:1.8;margin:30px 0 0;border-radius:6px;\">信息来源：建设和交通管理处公开发布信息、临港新片区管委会官网、售楼处公示及安居客/房天下等公开楼盘资料。文中区位图及楼栋分布示意图来源于公开发布的项目资料，仅供参考，最终以开发商公示为准；价格与优惠政策以开发商现场公示及政府部门认定为准，本文不构成任何投资建议。</p>"

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
