<script id="post-data" type="application/json">
{
  "title": "230万，在上海买一套三面环水的房子",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月5日 18:53",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/haiyue-hero.jpg\" alt=\"半岛住区概念图\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 24px;border-radius:8px;\">\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先说一个数字：<strong>230万。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">在上海，这个预算大概是什么段位？市区同面积段的改善新盘，一套99㎡奔着一千三百万去；而在临港，230万买到的是一套<strong>三面环水的半岛房</strong>，今天开始认购，95折之后一手价约218万。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">临港103板块的<strong>开云·海越半岛</strong>，认购通道11月5日上午9点正式开了，只开5天。372套，先到先得。</p>\n\n<p style=\"display:inline-block;background:#126e82;color:#fff;font-size:16px;font-weight:bold;padding:8px 20px;border-radius:4px;margin:46px 0 20px;\">1 · 先看价格：今年最\"不踮脚\"的上车机会</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这次是第一批次预售，<strong>372套，总面积4.2万㎡</strong>，全部是13-17层高层住宅。销售备案均价<strong>32900元/㎡</strong>，主力户型建面约99-187㎡。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">重点看99㎡这个段位：<strong style=\"color:#d6451e;\">过会总价230万左右，首开认购再打95折，实际约218万</strong>。什么概念？同板块里100平的新房，总价普遍在300万上下。</p>\n\n<img src=\"assets/price-card.jpg\" alt=\"价格对比卡\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 同为99㎡的总价直观对比（口径见卡内标注）</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">更别说市区——同样是99㎡，市区改善盘的总价够在这里<strong>买两套半还找零</strong>。价格这一关，海越半岛是诚意的。</p>\n\n<p style=\"display:inline-block;background:#126e82;color:#fff;font-size:16px;font-weight:bold;padding:8px 20px;border-radius:4px;margin:46px 0 20px;\">2 · 房子本身：藏在双河之间的半岛</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">临港新房不少，但<strong>三面环水的半岛地形</strong>，真不多见。整个社区被双河环抱，等于自带一条天然的水岸线。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">几个硬指标：</p>\n\n<p style=\"background:#f4f8f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2.1;margin:0 0 16px;\">\n✅ <strong>13-17层小高层 + 无连廊设计</strong>——楼栋排布宽松，采光通风在线，私密性拉满<br>\n✅ <strong>容积率2.2，绿化率约35%</strong>——下楼就是园林，遛弯遛娃有去处<br>\n✅ <strong>约99㎡、120㎡\"飞机户型\"</strong>——格局方正、全明通透，刚需和三口之家友好<br>\n✅ <strong>最大到约187㎡</strong>——二孩家庭、三代同堂的改善需求也接得住\n</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">99-187㎡这个面积段，正好覆盖从<strong>首套上车到深度改善</strong>的全链条——一个盘把临港人的\"人生进度条\"都排进去了。</p>\n\n<p style=\"display:inline-block;background:#126e82;color:#fff;font-size:16px;font-weight:bold;padding:8px 20px;border-radius:4px;margin:46px 0 20px;\">3 · 配套：不用等的现成资源</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">买房最怕\"规划里都有，现实中没有\"。海越半岛周边的配套，多数是<strong>已经能用的</strong>：</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>交通</strong>：地铁16号线已通车，南汇支线、南枫线、沪乍杭铁路在建，沪舟甬铁路规划中，外加S2/S3、G1503、两港大道——轨交+高快速路双保险，进市区、连长三角都有路可走。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>生态文旅</strong>：项目坐拥双滨水景观，毗邻莫比乌斯科学公园；上海天文馆、海昌海洋公园、耀雪冰雪世界、滴水湖剧院——周末想遛娃还是想看展，出门就有答案。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>商业</strong>：自带千平社区商业，港城新天地、港城广场、\"顶科晶耀\"商业区已开业，海港中心在建。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>教育医疗</strong>：青创湾板块集聚<strong>12所学校</strong>，全龄段覆盖；看病有三甲的<strong>上海市第六人民医院临港院区</strong>兜底。</p>\n\n<img src=\"assets/lingang-life.jpg\" alt=\"临港滨水生活概念图\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 临港滨水生活 AI 概念图（非官方），仅作情境示意</p>\n\n<p style=\"display:inline-block;background:#126e82;color:#fff;font-size:16px;font-weight:bold;padding:8px 20px;border-radius:4px;margin:46px 0 20px;\">4 · 真正的王炸：房子打折，政策也在\"打折\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">单看楼盘还不够。真正值得今年出手的原因，是<strong>政策和房价第一次拧到了同一个方向</strong>。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">8月20日，上海六部门联合出台<strong>\"沪八条\"</strong>，从公积金、信贷、\"以旧换新\"购房补贴、房票安置等五方面松绑。效果立竿见影：国庆假期上海新房成交面积<strong>同比翻倍</strong>（3.46万㎡，去年同期1.73万㎡）。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">临港这边再加码。今年5月首个\"上海临港人才日\"，临港发布人才政策矩阵2.0，六年引进人才已超17万。符合条件的人才，真金白银是这样的：</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 24px;\">\n<tr>\n<th style=\"background:#126e82;color:#fff;padding:10px 8px;text-align:left;border:1px solid #126e82;\">政策</th>\n<th style=\"background:#126e82;color:#fff;padding:10px 8px;text-align:left;border:1px solid #126e82;\">力度（符合认定条件者）</th>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;\">优秀人才购房补贴</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">最高 <strong style=\"color:#d6451e;\">500万元</strong>（A类按总房款100%补贴）</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">青年人才一次性安家补贴</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;\">最高 <strong>10.4万元</strong></td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;\">人才租房补贴</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">每月最高 <strong>5000元</strong></td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">\"青春驿站\"免费住宿</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;\">最长 2个月</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;\">\"小蓝鲸计划\"实习补贴</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">每月最高 <strong>6000元</strong></td>\n</tr>\n</table>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">一套218万的房子，叠加人才补贴之后，实际安家成本还能再往下探。<strong style=\"color:#d6451e;\">好房子叠加好政策，这波诚意，临港是给足了。</strong></p>\n\n<p style=\"display:inline-block;background:#126e82;color:#fff;font-size:16px;font-weight:bold;padding:8px 20px;border-radius:4px;margin:46px 0 20px;\">5 · 认购清单：5天窗口，材料先备齐</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">想冲的，这几条记好——尤其有一条时间红线，很多人会踩坑：</p>\n\n<p style=\"background:#fff3cd;border-left:4px solid #d6451e;padding:14px 18px;font-size:15px;color:#333;line-height:2;margin:0 0 20px;\">\n⚠️ <strong>11月9日到场认购的客户，须当日上午10:00前进场</strong>。系统录入有时限，逾时进场可能导致当天无法完成认购登记，务必预留到场时间。\n</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 24px;\">\n<tr>\n<th style=\"background:#126e82;color:#fff;padding:10px 8px;text-align:left;border:1px solid #126e82;\">项目</th>\n<th style=\"background:#126e82;color:#fff;padding:10px 8px;text-align:left;border:1px solid #126e82;\">内容</th>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;\">认购登记时间</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">2026年11月5日9时 - 11月9日12时</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">认购登记地点</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;\">浦东新区美人蕉路616弄3-5号（销售中心）</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;\">意向金</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">3万元/套（认购人名下<strong>借记卡</strong>，不收信用卡）</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">存款证明</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;\">首套15万（二套更高，以售楼处公示为准）</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;\">首开优惠</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">总价<strong>95折</strong> + 认购<strong>1万元优惠购车位</strong>活动</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">开盘/选房</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;\">2026年11月14日</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;\">售楼处电话</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">021-58538006</td>\n</tr>\n</table>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">开发商为上海顶科经济发展有限公司，项目地址在美人蕉路606弄、618弄，一期开发、一期销售，Mode上不存在分期\"养盘\"的等待成本。</p>\n\n<p style=\"display:inline-block;background:#126e82;color:#fff;font-size:16px;font-weight:bold;padding:8px 20px;border-radius:4px;margin:46px 0 20px;\">6 · 什么人该看看这套房</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">三种人，建议直接去现场：</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">一是<strong>在临港工作的人</strong>——通勤半径内，32900的均价买无连廊小高层，性价比没有对手；</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">二是<strong>够不上市区首付的年轻人</strong>——218万上车上海，再叠加人才补贴和租房补贴过渡，这是\"踮一踮够得着\"而不是\"踮到极限\"的选择；</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">三是<strong>看好临港长期价值的人</strong>——轨交在建、产业导入、六年17万人才，新城的逻辑从来不是明天涨，而是十年后回头看。</p>\n\n<p style=\"font-size:16px;color:#1a1a1a;line-height:1.9;margin:30px 0 20px;\"><strong>5天认购窗口，372套房源，11月14日开盘。看得上的犹豫，看得懂的已经在去美人蕉路的路上了。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">你会考虑在临港安家吗？评论区聊聊你的预算和需求👇 想看户型详解、人才补贴认定攻略的，扣个\"1\"，人多的话我们下期专门拆一篇。</p>\n\n<p style=\"text-align:center;font-size:14px;color:#999;margin:40px 0 0;line-height:1.8;\">—— 关注我们，临港一手安家资讯不迷路 ——</p>\n\n<p style=\"background:#f5f5f5;padding:12px 16px;font-size:12px;color:#999;line-height:1.8;margin:30px 0 0;border-radius:6px;\">免责声明：本文信息综合自官方发布及公开资料（售楼处公示、安居客/房天下楼盘页、临港新片区管委会、本地宝等），价格为销售备案价及首开优惠测算，可能随时间变动；项目效果图均为AI概念示意（非官方）。购房决策请以开发商现场公示与政府部门认定为准，本文不构成任何投资建议。</p>"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">

  <!-- 顶部提示条（复制/导出说明） -->

  </div>

  <!-- 正文 -->

    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
