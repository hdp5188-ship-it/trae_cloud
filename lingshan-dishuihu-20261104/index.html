<script id="post-data" type="application/json">
{
  "title": "滴水湖这半年：金色圆环要开了，湖边要建运动中心",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月4日 08:03",
  "location": "北京",
  "is_original": true,
  "body_html": "<!-- 首图 -->\n<p style=\"margin:0 0 6px;\"><img src=\"assets/honor-ring.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 32px;\">滴水湖金融湾核心地标「荣耀之环」正在进行最后收尾 &nbsp; 来源：临港管委会</p>\n\n<!-- 开篇钩子 -->\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\"></p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">地铁16号线滴水湖站出来，不用查攻略，跟着人潮往湖边走就行。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">这半年变化快得有点跟不上——</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 32px;\">先是那个悬在四栋楼上的金色大圆环要完工了，接着湖边的运动中心也开工了，连滴水湖本身都在搞「幸福河湖」升级。</p>\n\n<!-- 章节1 标题：荣耀之环 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:40px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">那个悬浮的金色圆环</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">说的就是「荣耀之环」。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">高50米，架在滴水湖金融湾西岛的四栋楼顶上。远看像个飞碟悬在半空，近看每根钢梁都亮着金色。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">主体去年就封顶了，今年一直在做玻璃幕墙和景观配套。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\"><strong>临港管委会最新消息：年底完工，明年春节前后向公众开放。</strong></p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">到时候可以登环俯瞰整个滴水湖，天气好能看到东海那条白线。</p>\n\n<p style=\"margin:24px 0 6px;\"><img src=\"assets/dishuihu-bay.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 12px;\">滴水湖金融湾西岛全貌 &nbsp; 来源：临港管委会</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">查了下配套数字：</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">超89万平米商业空间、7500多平米市民文化场地、2.8万多平米公共开放区。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 32px;\">说白了，不只是个观景台，是整个金融湾的「客厅」。</p>\n\n<!-- 章节2 标题：运动中心开工 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:40px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">湖边要建运动中心了</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">跑步骑车绕湖的人越来越多，官方终于跟上节奏了。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">今年9月，<strong>滴水湖运动中心（一期工程）</strong>拿到了开工放样复验合格证。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">项目业主是临港新片区生态环境绿化市容事务中心，招标代理是同济工程项目管理——正经单位。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">滴水湖本身一圈就是天然运动场，这次算是把配套补全了。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 32px;\">具体有啥设施没查到详细公开图，等有了再追。</p>\n\n<!-- 章节3 标题：幸福河湖 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:40px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">滴水湖正在变干净</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">说出来你可能不信，滴水湖是个人工湖。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">5.56平方公里的圆形湖面，2003年开建，引的是东海潮水。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">今年临港在搞「幸福河湖建设」——</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">东起主海塘，西到人民塘随塘河，南临芦潮引河，北到北护城河，整片水系都在升级。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">干的事儿包括：电力排管、入河排口整治、智慧监管设施。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 32px;\">说白了就是两件事：让水更清，让管得更精。</p>\n\n<!-- 章节4 标题：近期活动和生活指南 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:40px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">现在去能玩啥</p>\n\n<p style=\"margin:24px 0 6px;\"><img src=\"assets/dishuihu-aerial.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 12px;\">滴水湖航拍全景 &nbsp; 来源：临港管委会</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">如果最近打算去，给你几个靠谱的：</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:20px 0 6px;font-weight:bold;color:#0a84ff;\">① 地铁口直接「看海」</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">16号线滴水湖站二楼平台，出来就是湖景。天气好的傍晚，水面泛金。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:20px 0 6px;font-weight:bold;color:#0a84ff;\">② 滴水湖广场周末市集</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">「山河月宴」美食生活节还在续，40多个摊位，有手作体验、非遗拓印。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:20px 0 6px;font-weight:bold;color:#0a84ff;\">③ 滴水湖后街音乐会</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">每周五六晚19点，后街有专业乐队现场。免费。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:20px 0 6px;font-weight:bold;color:#0a84ff;\">④ 一尺花园东岸店</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">湖边的咖啡馆，旁边就是湿地，骑行打卡顺路歇脚。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:20px 0 6px;font-weight:bold;color:#0a84ff;\">⑤ 绕湖骑行</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 32px;\">一圈大约8公里，租车点在地铁站附近。建议下午去，不晒还能看日落。</p>\n\n<!-- 结尾 -->\n<p style=\"margin:50px 0 0;border-top:1px solid #eee;\"></p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:32px 0 12px;\">其实写这篇的时候我一直在想：</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">滴水湖这地方，从2003年挖第一锹土到现在，才23年。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">算起来比很多读者的年纪还小。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\">但它长得真快。环湖的楼一栋接一栋拔起来，地铁通了，商业起来了，现在连运动中心和观景台都要配齐了。</p>\n<p style=\"font-size:15px;line-height:1.85;color:#2b2b2b;margin:0 0 32px;\">有机会的话，选个天好的下午去转转。</p>\n\n<p style=\"font-size:14px;color:#999;line-height:1.75;margin:0 0 12px;\">这是上午篇，下午篇会聊临港的产业和人才政策。</p>\n<p style=\"font-size:14px;color:#999;line-height:1.75;margin:0 0 12px;\">关于滴水湖，你最期待它的哪个新变化？评论区聊聊。</p>\n\n<p style=\"font-size:14px;color:#bbb;line-height:1.75;margin:40px 0 0;text-align:center;\">— 关注我，看上海身边事 —</p>\n"
}

  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
