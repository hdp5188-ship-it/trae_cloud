{

  "body_html": "<img src=\"assets/hero.jpg\" alt=\"海贼王1198话情报\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">▲ 第1198话情报卡。情报整理自多渠道速报，以官方连载为准</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这话说出来你可能不信：<strong>路飞黑发了。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">不是晒的，不是影子，是那种从头发根黑到眼底的黑。第1198话「怪物之岛」，尾田把这一话画成了全员的变身大会——而最炸的那一个，压轴。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先看总账：</p>\n\n<img src=\"assets/beats.jpg\" alt=\"1198话四连爆\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 28px;\">▲ 本话四大爆点速览</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e42717;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e42717;margin:18px 0 26px;\">路飞黑发了，还咬爆了一个神</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">上话结尾，路飞从伊姆和洛基的战场中途开溜。洛基都看傻了：四皇说跑就跑？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这一话给答案——巨人村的屋顶上，蹲着个\"陌生人\"：<strong>黑发、獠牙、长尾、猴鼻</strong>。没笑容，没橡皮枪，就那么蹲着，盯着雨神扎扎MMA。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">下一格，他跳下去了。抓住雨神，<strong style=\"color:#e42717;\">一口，咬爆。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">巨人村全员懵圈：\"这他妈是谁？！\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">老一辈见多识广的加班只说了一句：\"这小子……<strong>是动物系啊</strong>。\"</p>\n\n<p style=\"background:#fff3f0;border-left:4px solid #e42717;padding:14px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">情报师 Redon 的解读（注意，是解读不是原文）：这是尼卡果实的<strong>未完成觉醒</strong>——动物系觉醒过头，兽性反噬人格。还记得蛋头岛夏克那句设定吗？动物系觉醒，人会逐渐变得像\"它\"。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">海外论坛已经把龙珠大猿对比图刷疯了：黑发、尾巴、兽化暴走——尾田敬鸟山明这事儿，这回是写在脸上了。但尾田的版本更狠：<strong style=\"color:#e42717;\">大猿是力量，猿神是代价。</strong></p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e42717;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e42717;margin:18px 0 26px;\">伊姆现真身：一击，放倒洛基</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">那个统治世界八百年的\"王\"，第三形态终于露了：躯干修长，脖子长得像座塔，头上巨角峥嵘。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">对面是洛基——从1193话铺垫到现在的动物系混血形态，诅咒之国的巨人王子，攒了五话的怒气，终于是\"怪兽对怪兽\"的牌面了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">结果呢？伊姆先问他艾尔巴夫古代科技的下落，洛基说不知道；伊姆认可了他的强——然后<strong>一击，放倒</strong>。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">放倒洛基之后，伊姆把目光转向了黑发的路飞。临走还留了句话：<strong style=\"color:#e42717;\">得赶紧回玛丽乔亚，不然命都保不住。</strong>——这位八百岁的\"王\"，居然也有\"赶时间\"的一天。下一话的火药味，全在这句话里。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e42717;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e42717;margin:18px 0 26px;\">山治一脚，神骑低头</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">上话山治刚觉醒霸王色，这一话直接验收成果：<strong>一脚踹碎麒麟圣的盔甲</strong>，人直接踢飞。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">然后是全话最好笑也最解气的一幕：麒麟圣掉头就跑，跑相和上话萨默斯在索隆面前的狼狈一模一样。神骑士团，世界政府明面上的最高战力，现在集体在草帽一伙面前练田径。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">倒是那个雨神扎扎MMA，值得多说一句：她把身体伸向船上，<strong>自己斩断手臂，把被拐的孩子一个个扔回了船上</strong>。敌人阵营里干出这事的，尾田向来都要么给她安排后手，要么给她安排故事。这根断臂，我赌是伏笔。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e42717;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e42717;margin:18px 0 26px;\">彩蛋与坏消息</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">扉页：布琳配了副三镜片眼镜——三只眼，三块镜片，尾田连配眼镜都讲设定，这人是真不放过任何一格。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">坏消息：下周一<strong>休刊</strong>。第1199话要等到 11 月 19 日的 JUMP N°53。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">也就是说，\"黑发路飞到底怎么了\"这个问题的答案，尾田要吊我们整整两个星期。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1a1a1a;line-height:1.75;margin:34px 0 24px;\">尼卡在笑，也在饿。<br>黑发不是失控，是账单到了。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区聊聊：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">给黑发猿神形态打几分（1-10）？你站\"觉醒代价\"派还是\"人格侵蚀\"派？</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">顺便押一个：伊姆说\"必须回玛丽乔亚\"，是谁在背后给他倒计时？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注，情报一出第一时间陪你拆。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">情报来源：Weekly Shonen Jump 2026 No.51 多渠道速报（bleachmx、pirateboard、Gulf News、海吧分析吧等互核）。速报情报可能与最终官方连载存在出入，以集英社官方发布为准。</p>\n"
}

      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
