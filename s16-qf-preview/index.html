{
  "title": "好消息：LPL三队进八强；坏消息：第一场就少一队",
  "account": "TraeWork",

  "author": "TraeWork",
  "date": "2026年11月3日 23:20",

  "is_original": true,
  "body_html": "<img src=\"assets/cover.jpg\" alt=\"S16八强对阵\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">▲ 八强对阵与赛程。数据来源：S16 官方</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先说好消息：LPL 三支队伍进了 S16 八强——iG、TES、BLG，这是近几年世界赛里 LPL 少有的齐整阵容。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">再说坏消息：抽签把这三支队放进了同一个半区，而且第一场就是内战。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">11月4日早上6点，TES 打 iG，五局三胜。当天晚上，就会有一支 LPL 队伍订好回程的机票。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e10600;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e10600;margin:18px 0 26px;\">一本账：先赢一个四强，再送走一支队</p>\n\n<img src=\"assets/ledger.jpg\" alt=\"LPL的八强账本\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 抽签落定后，LPL 的处境</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">把签摊开看，四组对阵是：TES vs iG、GEN vs LYON、DK vs BLG、T1 vs KC。时间全在北京时间早上6点，决赛是11月15日凌晨3点，纽约布鲁克林。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">TES 和 iG 被抽到一起，意味着 LPL <strong>已经预定了一个四强席位</strong>——这是好消息的另一半：不管谁赢，半决赛都有中国人。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">坏消息在另一半区。BLG 抽到了 DK，一支 3-0 全胜出线的 LCK 一号池强队。如果 BLG 过不去，LPL 的四强上限就是一支。</p>\n\n<p style=\"background:#fff2f0;border-left:4px solid #e10600;padding:16px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong>LPL 四强的起步价是一支，上限是两支，答案全在接下来五天里。</strong></p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e10600;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e10600;margin:18px 0 26px;\">第一场，就是全场最贵的一条路</p>\n\n<img src=\"assets/topwar.jpg\" alt=\"369对TheShy\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 369 与 TheShy。图源：Liquipedia 选手资料图</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">TES 的首发是 369、Tian、Creme、JackeyLove、Zhuo；iG 那边站着 TheShy、Wei、Rookie、JiaQi、Meiko。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先看 iG 这边的成色：TheShy、Rookie、Meiko，三个世界冠军。这支队伍时隔 2565 天回到八强，路上还干了一件大事——瑞士轮第三轮 1-0 掀翻 HLE，那是 LPL 本届第一次正面赢下 LCK 队伍。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">再看 TES 这边的剧本：主力和替补一起出征，结果替补上单 ZUIAN 两次面签被卡，369 临危受命顶上首发。谁也没想到，这个被迫的安排成了 TES 这届最硬的一张牌——第四轮对 BLG，先丢一局，让一追二，决胜局 369 的剑魔一骑当千。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">一个想证明自己还没老，一个刚被命运塞回首发。<strong style=\"color:#e10600;\">上路这一条线，装着两个完全不同的故事，和同一个四强名额。</strong></p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e10600;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e10600;margin:18px 0 26px;\">最狠的一场：DK vs BLG</p>\n\n<img src=\"assets/bin.jpg\" alt=\"BLG上单Bin\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ BLG 上单 Bin。图源：Liquipedia 选手资料图</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">11月6日，DK 对 BLG，这是四场里实力差距看着最大、实际最不好说的一场。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">DK 是 3-0 全胜出线，瑞士轮第二轮还 1-0 赢过 T1，一场没输。BLG 正相反，一路跌到 2-2，最后一天 2-0 零封 HLE 才压线挤进八强。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">按纸面论，DK 稳赢。但有两件事不该被忽略：</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">第一，<strong>从 2-2 爬出来的队伍，没有心理包袱</strong>。BLG 最坏的结果已经经历过了，现在每一场都是白赚的。第二，刚刚 2-0 淘汰 HLE 的 BLG，打的是本届状态最好的自己。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">Bin 对 DK 的上单，就是这场的天平。他要是能打出来，LPL 就还有两支四强队伍的可能；他要是被摁住，LPL 的冬天会来得很快。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e10600;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e10600;margin:18px 0 26px;\">另外两场：一个像走过场，一个不像</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">GEN vs LYON（11月5日）：3-0 的 GEN 打 LCS 独苗，纸面差距最大。GEN 这届稳得可怕，中野联动几乎不给对手中期机会。唯一的问题是——世界赛从没有过\"稳赢\"这两个字，LYON 既然能 2-1 扛住 LOS，就说明这支队伍命硬。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">T1 vs KC（11月7日）：五冠王打从入围赛一路爬上来的欧洲队。KC 的韧性是真韧性，能把 MKOI 干净利落地 2-0 送走；但 BO5 的 T1 是另一个物种，Faker 打淘汰赛的场数可能比 KC 全队加起来还多。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">这两场爆冷的概率都不高，<strong>真正的悬念，还是那句老话：LCK 三支全胜或近全胜的队伍，会不会把决赛变成内战。</strong></p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #e10600;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#e10600;margin:18px 0 26px;\">我的预测，欢迎赛后回来对账</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">TES 3-2 iG。内战打到第五局，369 稳住上路，JackeyLove 决定比赛。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">GEN 3-0 LYON。实力差距，不解释。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">BLG 3-2 DK。这是我唯一一次押冷门：2-2 爬出来的队没有包袱，DK 全胜太久没输过球，紧的那一方会先犯错。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">T1 3-1 KC。Faker 继续往前走。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1a1a1a;line-height:1.75;margin:34px 0 24px;\">如果全对，回来找我吹牛。<br>如果全错，就当我没说过。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区押注：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">四场你各押谁？LPL 最后能剩几支？</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">11月4日早上6点，第一场见。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注，赛后对账不迷路。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">资料来源：S16 官方赛程与赛果、英雄联盟赛事官方公告、lolesports、Liquipedia、虎扑战报。预测为作者观点，非官方数据。</p>\n"

  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
