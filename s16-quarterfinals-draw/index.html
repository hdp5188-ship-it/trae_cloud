<script id="post-data" type="application/json">
{
  "title": "S16八强出炉：LPL三队晋级，明早6点先打一场内战",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月3日 23:09",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/s16-hero.jpg\" alt=\"S16全球总决赛\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 24px;border-radius:8px;\">\n\n<p style=\"text-align:center;margin:30px 0 8px;font-size:13px;letter-spacing:4px;color:#9a8c6a;\">S16 全球总决赛</p>\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;margin:0 0 6px;line-height:1.4;\">八强全部出炉</p>\n<p style=\"text-align:center;font-size:15px;color:#666;margin:0 0 30px;line-height:1.6;\">LPL 三队晋级 · 对阵落定 · 赛程全梳理</p>\n\n<p style=\"background:#f5f5f5;border-left:4px solid #0a84ff;padding:14px 18px;font-size:15px;color:#333;line-height:1.8;margin:0 0 28px;\">北京时间11月1日凌晨，S16瑞士轮第五轮结束：KC 2-0 MKOI、LYON 2-1 LOS、BLG 2-0 HLE。八强全部产生——LCK 三席（GEN、DK、T1）、<strong>LPL 三席（iG、TES、BLG）</strong>、LEC 一席（KC）、LCS 一席（LYON）。抽签随后进行，四组对阵落定，11月4日早上6点开打。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">八强名单：三支LCK，三支LPL</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">GEN（3-0，LCK一号种子）</strong>：三战全胜，一场比赛没输就拿到了八强门票。Chovy + Canyon 的中野组合在中期决策上几乎不给对手机会。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">DK（3-0，LCK三号种子）</strong>：同样全胜出线，第二轮 1-0 拿下 T1，是全胜路上最硬的一场。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">T1（3-1，LCK二号种子）</strong>：五冠王。唯一的败仗是 0-1 负于 DK，随后迅速调整，第四轮拿下 MKOI 锁定八强。Faker 还在打，这本身就是新闻。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#0a84ff;\">iG（3-1，LPL四号种子）</strong>：首轮 0-1 负 GEN，随后三连胜——第三轮 1-0 掀翻 HLE，这是 LPL 本届对 LCK 的首场胜利；第四轮 2-1 拿下 LYON，成为 LPL 第一支锁定八强的队伍。时隔七年重返世界赛八强。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#0a84ff;\">TES（3-1，LPL三号种子）</strong>：首轮 0-1 负 HLE，之后连赢三场——AL、G2、BLG，第四轮 2-1 逆转 BLG 锁定八强。369 是替补上单 ZUIAN 两次面签被卡后临危受命进的首发，状态一路走高。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong style=\"color:#0a84ff;\">BLG（3-2，LPL二号种子）</strong>：一路跌到 2-2，第五轮 2-0 零封 HLE 压线晋级。Knight 的海报文案是官方给的八个字：狭路相逢，勇者向前。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>KC（3-2，LEC三号种子）</strong>和 <strong>LYON（3-2，LCS二号种子）</strong>是最后两张门票的主人，两队都从生死战里爬了出来。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">最后三张门票</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">第五轮三场 2-2 生死战，<strong>BO3，赢了晋级，输了回家</strong>。</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 16px;\">\n<strong style=\"color:#0a84ff;\">KC 2-0 MKOI</strong><br>\n欧洲内战一边倒。KC 把 MKOI 挡在八强门外，从 2-2 组里爬了出来。\n</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 16px;\">\n<strong style=\"color:#0a84ff;\">LYON 2-1 LOS</strong><br>\n打得远比想象中惊险，LYON 险胜晋级，成为 LCS 最后一根独苗。\n</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 28px;\">\n<strong style=\"color:#c0392b;\">BLG 2-0 HLE</strong><br>\n当天的重头戏。HLE 第一轮赢过 TES，一路打到生死战，最后被 BLG 干净利落地 2-0 淘汰。LPL 保住三席，LCK 定格在三席。\n</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">四组对阵：第一场就是内战</p>\n\n<img src=\"assets/bracket.jpg\" alt=\"S16八强对阵\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 八强对阵与赛程</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">11月4日 · TES vs iG</strong>：LPL 内战提前上演，必有一队止步八强。369 对 TheShy，替补救火的老将打 S8 冠军上单，这条线是全场最贵的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>11月5日 · GEN vs LYON</strong>：全胜种子打 LCS 黑马。GEN 首轮只打 3-2 的队伍，纸面优势明显。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>11月6日 · DK vs BLG</strong>：中韩对决。BLG 刚在生死战零封 HLE，手感正热；DK 则是全胜晋级，一场没输过。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong>11月7日 · T1 vs KC</strong>：Faker 对欧洲新面孔。KC 从入围赛打到现在，韧性强，但 BO5 的 T1 是另一个物种。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">赛程表：11月4日开打</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">淘汰赛全部为 <strong>BO5（五局三胜）单败淘汰</strong>。四分之一决赛和半决赛在德克萨斯州艾伦市举行，决赛移师纽约布鲁克林。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">比赛时间（北京时间）：<strong>四强之前每天早上6:00 开赛</strong>。对国内观众来说，闹钟得调好。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 12px;\">\n<tr>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">阶段</th>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">日期</th>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">北京时间</th>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">对阵</th>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月4日（周三）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;font-weight:bold;color:#c0392b;\">TES vs iG</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月5日（周四）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">GEN vs LYON</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月6日（周五）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">DK vs BLG</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月7日（周六）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">T1 vs KC</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">半决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月8日（周日）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">对阵待定</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">半决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月9日（周一）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">对阵待定</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;font-weight:bold;color:#856404;\">决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;color:#856404;\">11月15日（周日）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;color:#856404;\">凌晨3:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;color:#856404;\">纽约布鲁克林</td>\n</tr>\n</table>\n<p style=\"font-size:12px;color:#999;margin:0 0 28px;\">▲ 数据来源：S16 官方赛程、lolesports</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">几个值得关注的看点</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>LPL 三席，但第一场就内战。</strong>11月4日 TES 打 iG，意味着八强刚开打就必有一支 LPL 队伍回家。另一场 DK vs BLG，赢了才有两队进四强的可能。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>3-0 的种子优势有多大？</strong>GEN 和 DK 首轮只打 3-2 的队伍，纸面上晋级四强的概率很大。但 BO5 的世界赛，从来没有\"稳\"这个字。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>BLG 是变量。</strong>跌到 2-2 才出线的队伍，往往在淘汰赛里最没包袱。2-0 淘汰 HLE 那场，是他们这届打得最痛快的一场。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong>Faker 还能走多远？</strong>没有人会在 BO5 里低估 T1。五冠王的每一步，都是新闻。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">6</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">明早6点，先打内战</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">北京时间11月4日早上6点，TES vs iG，八强揭幕战。五局三胜，输的直接回家。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">对国内观众来说，这个时间不算友好。但 S16 打到这里，LPL 只剩三支，第一场就要走一个。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#0a84ff;line-height:1.75;margin:34px 0 24px;\">定好闹钟。<br>这一场，值得早起。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区聊聊：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">四组对阵，你觉得谁会翻车？</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">LPL 这次能有几队进四强？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注。这几天的 S16 淘汰赛，每一场都跟。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">资料来源：S16 官方赛果与赛程、lolesports、dotesports、虎扑战报。数据截至北京时间11月3日。</p>\n"
}

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
