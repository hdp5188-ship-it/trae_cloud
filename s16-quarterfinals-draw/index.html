<script id="post-data" type="application/json">
{
  "title": "S16八强抽签今夜落定：五席已锁，GEN/DK避开LPL，赛程全梳理",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月31日 13:28",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/s16-hero.jpg\" alt=\"S16全球总决赛\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 24px;border-radius:8px;\">\n\n<p style=\"text-align:center;margin:30px 0 8px;font-size:13px;letter-spacing:4px;color:#9a8c6a;\">S16 全球总决赛</p>\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;margin:0 0 6px;line-height:1.4;\">八强抽签今夜落定</p>\n<p style=\"text-align:center;font-size:15px;color:#666;margin:0 0 30px;line-height:1.6;\">五席已锁 · 三席待决 · 赛程全梳理</p>\n\n<p style=\"background:#f5f5f5;border-left:4px solid #0a84ff;padding:14px 18px;font-size:15px;color:#333;line-height:1.8;margin:0 0 28px;\">10月31日，S16瑞士轮最后一轮抽签出炉。GEN、DK、T1、iG、TES 已锁定八强；LOS vs LYON、KC vs MKOI、HLE vs BLG 三场生死战将于11月1日凌晨1点开打，胜者搭上八强末班车。随后进行的八强抽签，将决定淘汰赛首轮对阵。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">八强已锁五席，豪门扎堆</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">瑞士轮打到第四轮，五支队伍率先拿到3胜，提前晋级淘汰赛。细看这五队的名字，分量足够重——<strong>四支拿过S赛冠军的队伍</strong>，加上一支LPL新贵。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">GEN（3-0，LCK一号种子）</strong>：本届瑞士轮唯一一支两战全胜且未尝败绩的队伍之一。中野联动稳定，Chovy + Canyon 的组合在中期决策上几乎不给对手机会。3-0 的战绩意味着他们在八强抽签中拥有\"种子优势\"——只会抽到3-2的队伍。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">DK（3-0，LCK三号种子）</strong>：另一支3-0晋级的队伍。ShowMaker 状态回暖，打野 Lucid 的节奏把控是 DK 这届最锋利的刀。和 GEN 一样，八强首轮避开所有3-1队伍。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">T1（3-1，LCK二号种子）</strong>：五冠王。瑞士轮首轮输给 LPL 的 TES 爆出冷门，但随后迅速调整，连下三城。Faker 还在打，这本身就是新闻。3-1 的战绩让他们落入\"3-1互抽池\"，可能撞上 iG 或 TES。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#c0392b;\">iG（3-1，LPL四号种子）</strong>：S8冠军时隔多年重返世界赛八强。瑞士轮第三轮2-1爆冷掀翻 HLE，为LPL拿下本届对LCK的首场胜利。YSKM 的上路压制力是 iG 这届最大的惊喜。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong style=\"color:#c0392b;\">TES（3-1，LPL三号种子）</strong>：瑞士轮首轮就赢了 T1，给LPL打了一针强心剂。JackeyLove + Meiko 的下路组合经验丰富，打野 Tarzan 的节奏是 TES 的晴雨表。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">三张门票，三场生死战</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">还剩三个八强名额，由瑞士轮第五轮的三场2-2生死战决出。<strong>BO3，赢了晋级，输了回家</strong>。比赛时间：北京时间11月1日凌晨1点。</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 16px;\">\n<strong style=\"color:#0a84ff;\">LOS（CBLOL）vs LYON（LCS）</strong><br>\n巴西一号种子 vs 北美二号种子。LYON 在瑞士轮第四轮1-2惜败 iG，状态不差；LOS 则是踩着 G2 进的2-2组。这场是外赛区之间的直接对话，谁赢谁创造赛区历史。\n</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 16px;\">\n<strong style=\"color:#0a84ff;\">KC（LEC）vs MKOI（LEC）</strong><br>\n欧洲内战。KC 从入围赛杀上来，韧性极强；MKOI 瑞士轮第四轮0-2输给 T1，暴露了对上LCK强队时的差距。两队彼此知根知底，谁先拿到赛点谁就掌握主动。\n</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 28px;\">\n<strong style=\"color:#c0392b;\">HLE（LCK）vs BLG（LPL）</strong><br>\n关注度最高的一场。HLE 拥有 Zeka + Gumayusi 的明星组合，Zeka 赛前放话\"我们现在的状态绝对比BLG强\"；BLG 则是LPL二号种子，Bin 的上路和 Elk 的下路都有carry能力。这场的胜者将以3-2的身份进入八强，<strong>很可能在首轮撞上 GEN 或 DK</strong>。\n</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">八强赛程：11月3日开打</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">淘汰赛阶段全部为 <strong>BO5（五局三胜）单败淘汰</strong>。四分之一决赛和半决赛在德克萨斯州艾伦市举行，决赛移师纽约布鲁克林。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">比赛时间（北京时间）：<strong>每天早上6:00 开赛</strong>。对国内观众来说，闹钟得调好。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 28px;\">\n<tr>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">阶段</th>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">日期</th>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">北京时间</th>\n<th style=\"background:#0a84ff;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0a84ff;\">赛制</th>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月3日（周二）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">BO5</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月4日（周三）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">BO5</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月5日（周四）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">BO5</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">四分之一决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月6日（周五）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">BO5</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">半决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月7日（周六）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">BO5</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">半决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">11月8日（周日）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">6:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">BO5</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;font-weight:bold;color:#856404;\">决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;color:#856404;\">11月14日（周六）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;color:#856404;\">3:00</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#fff3cd;color:#856404;\">BO5</td>\n</tr>\n</table>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">抽签规则：3-0 打 3-2，3-1 互抽</p>\n\n<img src=\"assets/bracket-concept.jpg\" alt=\"八强对阵示意\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 16px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 八强单败淘汰对阵示意</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">八强抽签的规则很明确，也直接决定了哪些对决是\"可能发生\"的：</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>第一组对阵</strong>：两支 3-0 的队伍（GEN、DK）将随机抽到两支 3-2 的队伍。也就是说，GEN 和 DK 的八强对手，一定来自今晚三场生死战的胜者。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>第二组对阵</strong>：剩下的四支队伍（T1、iG、TES，加上两支3-2胜者中未被3-0抽中的那一支...不对，是三支3-1 + 一支3-2）随机两两配对。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">换成大白话：</p>\n\n<p style=\"background:#f0f7ff;border-left:4px solid #0a84ff;padding:14px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">GEN 和 DK 首轮不会碰到 T1、iG、TES。T1、iG、TES 这三支3-1队伍之间，大概率会有一场内战——要么 LPL 内战（iG vs TES），要么中韩对决（T1 vs iG / T1 vs TES）。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">几个值得关注的看点</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>LCK 能占几席？</strong>目前 LCK 已有 GEN、DK、T1 三队晋级，如果 HLE 赢下 BLG，LCK 将史无前例地在八强占据4个席位。半决赛有可能出现 LCK 内战。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>LPL 的希望在哪？</strong>iG 和 TES 已经锁定八强。如果 BLG 也能赢下 HLE，LPL 将有3队晋级。但3-1的抽签池意味着 iG 和 TES 有概率在八强就相遇——这是LPL粉丝最不想看到的结果。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>Faker 还能走多远？</strong>没有人会在BO5里低估T1。瑞士轮首轮输给TES之后，T1连赢三场调整回来了。如果八强抽到 iG 或 TES，那将是本届最受关注的对决之一。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong>3-0 的种子优势有多大？</strong>GEN 和 DK 避开了所有3-1队伍，首轮只打3-2。从纸面实力看，他们晋级四强的概率很大。但BO5的世界赛，从来没有\"稳\"这个字。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">6</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">今夜看什么</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">11月1日凌晨1点，三场生死战同时开打。HLE vs BLG 是焦点中的焦点——这场不仅决定一个八强名额，还间接影响整个八强抽签的格局。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">生死战结束后，八强抽签随即进行。届时 GEN、DK 会抽到谁，T1、iG、TES 会不会撞在一起，全部见分晓。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">定好闹钟。S16的淘汰赛，要来了。</p>\n\n<p style=\"text-align:center;margin:40px 0 20px;font-size:13px;color:#999;letter-spacing:2px;\">— END —</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
