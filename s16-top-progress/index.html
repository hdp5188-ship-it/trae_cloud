<script id="post-data" type="application/json">
{
  "title": "进步最大的上单，不是 TheShy，也不是 Bin",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月2日 16:57",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/cover-top3.jpg\" alt=\"369 TheShy Bin\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">▲ 左起：369、TheShy、Bin。图源：Liquipedia</p>\n\n<p style=\"text-align:center;margin:0 0 10px;font-size:13px;letter-spacing:4px;color:#8a8a8a;\">S16 · 上单之争</p>\n<p style=\"text-align:center;font-size:25px;font-weight:bold;color:#1a1a1a;margin:0 0 8px;line-height:1.45;\">进步最大的上单，<br>不是 TheShy，也不是 Bin</p>\n<p style=\"text-align:center;font-size:15px;color:#777;margin:0 0 30px;line-height:1.6;\">369：从\"救火队员\"打到\"999\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先说结论：<strong style=\"color:#0f766e;\">这届 S16，进步最大的上单是 369。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">TheShy 是\"回来\"，Bin 是\"守住\"，只有 369，是从一个几乎没人指望的位置，把自己打成了 TES 的命门。</p>\n\n<p style=\"background:#f2f8f7;border-left:4px solid #0f766e;padding:16px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">三个人的起点完全不一样。所以\"进步\"这件事，不能只看现在谁最强——那样对 369 不公平，对 Bin 也不公平。</p>\n\n<p style=\"text-align:center;font-size:46px;font-weight:900;color:#0f766e;letter-spacing:3px;line-height:1;margin:48px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">先看三条起跑线</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>Bin</strong>：BLG 的绝对核心。赛前论坛上最热的话题之一，就是\"Bin 和 Zeus 谁才是世一上\"。他是被拿来争第一的人。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>TheShy</strong>：2018 年世界冠军，2023 年亚军。今年春天一度不在大名单里，6 月才回到 IG。26 岁，第四次打进世界赛淘汰赛。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>369</strong>：25 岁，2025 年世界赛四强。据外媒报道，他是开赛前一周才被重新拉回首发，休息期间排位只打到翡翠段位。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">一个在争\"世一上\"，一个是冠军回归，一个是临时救火。<strong>三条起跑线，根本不在一个平面上。</strong></p>\n\n<p style=\"text-align:center;font-size:46px;font-weight:900;color:#0f766e;letter-spacing:3px;line-height:1;margin:48px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">369：把一支队伍的命接住了</p>\n\n<img src=\"assets/369.jpg\" alt=\"369\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 22px;\">▲ 369（白家浩），TES 上路。图源：Liquipedia</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">TES 的瑞士轮开局并不好。第一轮输给 HLE，之后连赢 AL 和 G2，才爬到 2-1 组。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">2-1 组的对手是 BLG——Bin 的队伍。第一局 TES 输了，再输一局就要掉进 2-2 的生死池。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">然后 369 开始\"摇 9\"。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">第二局他用剑魔在团战里一骑当千，TES 逆风翻盘扳回一城。决胜局锁下鳄鱼，对线顶住 Bin 的压力，23 分钟小龙团冲进阵中拿下双杀，一波奠定胜势。<strong>连续两局 MVP。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">整轮系列赛，369 交出 8/4/14。对手是 Bin——被讨论\"世一上\"的那个人。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#0f766e;line-height:1.7;margin:26px 0 26px;\">他不是把状态找回来，<br>是把一支队伍的命接住了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">TES 最后 3-1 出线。一个开赛前一周才归队的人，成了这轮系列赛最硬的那块板。</p>\n\n<p style=\"text-align:center;font-size:46px;font-weight:900;color:#0f766e;letter-spacing:3px;line-height:1;margin:48px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">TheShy：这不是进步，是回来</p>\n\n<img src=\"assets/theshy.jpg\" alt=\"TheShy\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 22px;\">▲ TheShy（姜承録），IG 上路。图源：Liquipedia</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">IG 这条线，故事性拉满。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">首轮 0-1 输给 GEN，第二轮赢 TSW，第三轮 1-0 掀翻 HLE——<strong>成了 S16 第一支击败 LCK 的 LPL 队伍</strong>。第四轮 2-1 拿下 LYON，3-1 出线。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这是 IG 隔 2565 天重回世界赛淘汰赛，也是 TheShy 第四次打进 S 赛八强。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">他自己的说法很松：\"一开始小目标是离开涅槃组，大目标是进世界赛，再往后压根没想过。\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">数据上，他对 LYON 那轮是 4/4/10，参团率 41.2%；瑞士轮首日的分均伤害是 806。不炸裂，但够用。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong style=\"color:#0f766e;\">TheShy 这一届真正变好的，是心态。</strong>一个拿过冠军、也跌到过谷底的人，现在能笑着说\"没想过\"，这比多打 200 点分均伤害更难。</p>\n\n<p style=\"text-align:center;font-size:46px;font-weight:900;color:#0f766e;letter-spacing:3px;line-height:1;margin:48px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">Bin：他一直站在这，所以显得\"没进步\"</p>\n\n<img src=\"assets/bin.jpg\" alt=\"Bin\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 22px;\">▲ Bin（陈泽彬），BLG 上路。图源：Liquipedia</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">单看数据，Bin 其实是三个人里最漂亮的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">瑞士轮前三场，他 KDA 9.00，场均 4.33 杀 / 1.00 死 / 4.67 助，参团率 60.0%，分均伤害 476。对位 Zeus 的那组对比里，他的 KDA 是 9.00，Zeus 是 3.00。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">但 BLG 的路径不顺。2-1 组被 TES 让一追二，掉到 2-2，最后一天才拿下 HLE，拿到最后一张八强门票。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">整届瑞士轮 8 场打完，Bin 的 KDA 是 4.46，参团率 51.8%，分均伤害 405。数字依然体面，只是没有前三场那么亮。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">论坛上也有人说他\"舒服流打法\"——不抢资源、不硬拼单点，混住线等队友。这话对不对另说，但能看出来：<strong>大家对 Bin 的要求，从来不是\"打好\"，而是\"打穿\"。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">所以 Bin 不是退步。他只是起点太高，进步这件事在他身上看不出斜率。</p>\n\n<p style=\"text-align:center;font-size:46px;font-weight:900;color:#0f766e;letter-spacing:3px;line-height:1;margin:48px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">换个问法，答案就变了</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">如果你问的是\"谁进步最大\"，答案是 369。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">如果你问的是\"谁现在最强\"，答案大概率还是 Bin。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">如果你问的是\"谁最让人感慨\"，那只能是 TheShy。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 20px;\">三个问题，三个答案。把它们混在一起吵，永远吵不出结果。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 24px;\">\n<tr>\n<th style=\"background:#0f766e;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0f766e;\">&nbsp;</th>\n<th style=\"background:#0f766e;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0f766e;\">369</th>\n<th style=\"background:#0f766e;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0f766e;\">TheShy</th>\n<th style=\"background:#0f766e;color:#fff;padding:10px 8px;text-align:left;border:1px solid #0f766e;\">Bin</th>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">起点</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">开赛前一周归队</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">春季休赛，6月回归</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">一直是争世一上的人</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">瑞士轮</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">3-1</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">3-1</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">3-2</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">KDA</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">2.50（前3场）<br>对BLG 8/4/14</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">对LYON 4/4/10</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">9.00（前3场）<br>4.46（全8场）</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">分均伤害</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">557（前3场）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">806（首日）</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">476（前3场）<br>405（全8场）</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">一句话</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;color:#0f766e;font-weight:bold;\">斜率最陡</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;color:#0f766e;font-weight:bold;\">故事最足</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;color:#0f766e;font-weight:bold;\">高度最高</td>\n</tr>\n</table>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:0 0 28px;\">注：三人数据的统计口径与场次数不同（部分为瑞士轮前 3 场，部分为整个瑞士轮），仅作参考，不宜直接横向比较。</p>\n\n<p style=\"text-align:center;font-size:46px;font-weight:900;color:#0f766e;letter-spacing:3px;line-height:1;margin:48px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">答案，11 月 4 日早上见分晓</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">八强抽签，最巧的一组是 TES 对 IG。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">369 对 TheShy。一个刚刚打出生涯最硬系列赛的人，对上一个刚刚找回笑容的冠军上单。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">北京时间 11 月 4 日早上 6 点，BO5。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">至于 Bin，BLG 八强要碰 DK。他要面对的，是另一场硬仗。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#0f766e;line-height:1.75;margin:34px 0 24px;\">进步最大的是 369，<br>但\"最进步\"这件事，得靠下一场证明。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区聊聊：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">你觉得谁进步最大？</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">TES vs IG，你押谁？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注。八强每打完一场，这里都会第一时间出复盘。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">资料来源：Liquipedia（Worlds 2026 选手数据）、虎扑电竞、凤凰网、上游新闻、海峡网、LoL Esports。文中数据口径不同，已逐项标注。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
