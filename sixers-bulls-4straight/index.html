<script id="post-data" type="application/json">
{
  "title": "40岁的詹姆斯，在费城学会了“划水”",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月3日 14:54",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/lebron-drive.jpg\" alt=\"詹姆斯持球突破\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">▲ 詹姆斯持球突破。图源：直播吧战报图（比赛现场画面）</p>\n\n<p style=\"text-align:center;margin:0 0 10px;font-size:13px;letter-spacing:4px;color:#8a8a8a;\">NBA · 76 人四连胜</p>\n<p style=\"text-align:center;font-size:25px;font-weight:bold;color:#1a1a1a;margin:0 0 8px;line-height:1.45;\">40 岁的詹姆斯，<br>在费城学会了\"划水\"</p>\n<p style=\"text-align:center;font-size:15px;color:#777;margin:0 0 30px;line-height:1.6;\">126-107 胜公牛，7 胜 1 负东部第一，首发五人全部 15+</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">北京时间 11 月 3 日，76 人在主场 126-107 轻取公牛，拿到本赛季第一次四连胜。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">比分看着是 19 分大胜，过程其实不复杂：首节 30-23 起手，半场只领先 5 分，第三节一波 19-6 把差距拉开到两位数，末节再补一刀，比赛就结束了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">真正值得说的，是这支球队现在的样子。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">詹姆斯 15 分 7 篮板 9 助攻，正负值 <strong>+30</strong>。恩比德 15 分 8 篮板，末节没上。马克西 26 分 11 助攻，其中末节 15 分。布朗 25 分 11 篮板，埃奇库姆 21 分。</p>\n\n<p style=\"background:#f5f5f5;border-left:4px solid #ed174c;padding:16px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong>首发五个人，全部 15+。</strong>这不是某个人爆了，是五个人都没闲着。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#ed174c;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#ed174c;margin:14px 0 22px;border-bottom:3px solid #ed174c;padding-bottom:9px;\">老詹改行了</p>\n\n<img src=\"assets/starters-chart.jpg\" alt=\"76人首发五人得分\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 22px;\">▲ 76 人首发五人得分分布</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这场球最舒服的地方，是詹姆斯几乎没怎么硬解。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">半场 7 次助攻，其中两次是接近全场的击地长传，直接把球送到快下的埃奇库姆手里。第三节末段一个上篮把分差拉到 17 分，第四节 5 分 40 秒打成 2+1，领先 16 分，基本收工。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">他不再是那个必须拿 30 分才能赢球的人。现在他的工作是发牌、控节奏、在关键回合站出来打一个。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">15 分 9 助攻，+30，全场最高之一。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong style=\"color:#ed174c;\">40 岁的人，终于打上了可以\"划水\"还能赢球的比赛。</strong>这话不是贬义，是这支球队成熟的标志。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#ed174c;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#ed174c;margin:14px 0 22px;border-bottom:3px solid #ed174c;padding-bottom:9px;\">收尾的人，是马克西</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">前三节，马克西其实打得不算亮眼。真正的爆发在第四节。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">节开始一个突破上篮，之后连续冲击篮筐。6 分半钟那记三分，把比分改写成 107-96，比赛基本失去悬念。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">单节 15 分，全场 26 分 11 助攻，还有 2 抢断 2 盖帽。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">这就是现在 76 人的分工：<strong>前三节詹姆斯梳理，最后一节马克西接管。</strong>一个负责让所有人吃饱，一个负责在最后时刻把门关上。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#ed174c;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#ed174c;margin:14px 0 22px;border-bottom:3px solid #ed174c;padding-bottom:9px;\">大帝只打了三节，这才是重点</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">恩比德赛前因为脚伤被列为\"出战成疑\"，最后还是上了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">15 分 8 篮板 3 助攻，打了三节，第四节不需要他。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">对 76 人来说，这比赢 19 分更重要。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">这支球队的上限，从来不取决于詹姆斯还能拿多少分，也不取决于马克西能爆几场——<strong style=\"color:#ed174c;\">取决于恩比德能不能在四月、五月还站在场上。</strong>常规赛让他三节打卡，是保护，也是必须。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#ed174c;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#ed174c;margin:14px 0 22px;border-bottom:3px solid #ed174c;padding-bottom:9px;\">先别急着喊\"东部第一\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">7 胜 1 负，东部第一，四连胜。成绩确实漂亮。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">但这场球的对手，是 1 胜 6 负、五连败的公牛。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">公牛不是没有亮点。今年的 4 号秀威尔逊拿了 24 分 7 篮板 4 助攻 4 抢断，鲍威尔 18 分，吉迪 13 分 10 助攻。年轻人能打，但整支球队现在缺人、缺默契，也缺赢球的习惯。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">所以这场 19 分大胜，说明 76 人该赢的球赢得很稳，但还说明不了太多。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">真正的检验在下一场：<strong>客场打活塞。</strong>再往后，才是东部的硬仗。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#ed174c;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#ed174c;margin:14px 0 22px;border-bottom:3px solid #ed174c;padding-bottom:9px;\">这支球队，终于像一支球队了</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">过去几年的 76 人，总给人一个感觉：纸面很强，打起来很累。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">现在不一样了。五个人都能得分，球权分配清楚，老将不用硬撑，年轻人敢出手，替补席上还有人能顶。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">比赛还剩 5 分钟，主力就可以坐着看。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#ed174c;line-height:1.75;margin:34px 0 24px;\">能让 40 岁的人打上\"养老球\"，<br>才是一支强队真正成熟的样子。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区聊聊：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">四连胜里，你觉得哪场赢得最硬？</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">这支 76 人，你给打几分？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注。东部强队的每一场硬仗，这里都会跟。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">资料来源：AP、央视网、直播吧。数据截至北京时间 11 月 3 日赛后。</p>\n"
}

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
