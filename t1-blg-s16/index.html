  "body_html": "<img src=\"assets/t1-score.jpg\" alt=\"T1 3-1 KC比分卡\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 比赛结果（自制图）</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">3-1，T1晋级四强。比分谈不上碾压，KC甚至扳回过一局。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">但真正让人后背发凉的，是赛后采访。Faker先夸了一句：<strong>\"BLG是有争冠实力的。\"</strong>然后补了下半句：<strong>\"不过很可惜，他们半决赛碰到了我们。\"</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先礼后兵，火药味拉满。半决赛，T1对BLG，9日开打。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">01 四局比赛：KC咬得比想象中紧</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">首局T1前半程被KC压着打，中盘才靠Peyz的爆发接管团战，25分钟、27分钟连吃两波团，35分钟艰难拿下。第二局倒是干脆：开局3分钟就打出3杀，29分钟中路一波团灭对手，2-0。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">第三局KC不肯退场，上单Canna的克桑提在大龙前挡住T1的进场，随后大龙、龙魂、远古龙全部收下，38分钟硬生生扳回一城。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">第四局双方咬到32分钟，T1集齐龙魂后，Keria的尼科在决胜团里把大招\"绽放\"砸进了人堆——一个技能，决定四强归属。35分钟，比赛结束。</p>\n\n<img src=\"assets/team1.jpg\" alt=\"T1全员赛后背影\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ T1队员赛后背身复盘（图源：Riot Games）</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">02 \"状态不好\"的卫冕冠军，最可怕</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">赛后韩媒专访，Faker说：\"说实话，今天我的状态并不是特别好，多亏队友发挥才赢下比赛。\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">结合另一个细节看这句话更冷：据现场记者描述，T1全员晋级后<strong>面无表情，赢了像输了一样</strong>。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">淘汰赛12连胜，冲击世界赛史上首个四连冠、队史第7冠——对这支队伍来说，八强只是流程，<strong>还剩两场胜利</strong>。而状态\"不好\"的Faker，和全情投入的Oner、Keria、Peyz、Doran，才是他们的完全体。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">03 Faker的\"先夸后杀\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">聊到半决赛对手，Faker的完整表述是这样的：</p>\n\n<p style=\"background:#f5f7fa;padding:18px 20px;border-radius:6px;font-size:15px;color:#1f3a5f;line-height:2;margin:0 0 16px;font-style:italic;\">\"BLG在本届比赛展现出了极强的实力，接连击败LCK的队伍，是有争冠实力的。不过很可惜，他们半决赛碰到了我们。\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先承认你强，再告诉你强也没用。这是老牌王朝的说话方式：不否认对手，只是平静地宣判。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">BLG这边也给出了回应。Viper赛前表态：<strong>\"一定要打破在世界赛不胜T1的魔咒。\"</strong>魔咒是真实的——BLG世界赛历史交手T1，一场没赢过。这次，是新阵容、新复仇故事的机会。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f3a5f;margin:46px 0 20px;\">04 越过欧洲之墙，撞上万里长城</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">韩国媒体赛后用了这么一句话：\"越过欧洲之墙的T1，现在向万里长城进发。\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">四强就此定型，两场半决赛全部是中韩对决：</p>\n\n<img src=\"assets/t1-semis.jpg\" alt=\"半决赛对阵卡\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 6px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ 半决赛赛程（自制图，据官方赛程整理）</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">8日GEN对iG，9日T1对BLG。若GEN与T1双双过关，决赛将上演LCK内战；若LPL双杀，则把S16变成LPL的收官派对。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">评论区聊聊：<strong>两场半决赛，LPL能双杀LCK吗？</strong>T1的王朝和LPL的新王，你押哪边？</p>\n\n<p style=\"text-align:center;font-size:14px;color:#999;margin:36px 0 0;line-height:1.8;\">—— 周六、周日，不见不散 ——</p>\n\n<p style=\"background:#f5f5f5;padding:12px 16px;font-size:12px;color:#999;line-height:1.8;margin:30px 0 0;border-radius:6px;\">信息来源：LPL/LoL Esports官方赛程、韩媒国民日报Faker专访（直播吧译）、sportsseoul达拉斯现场报道、懂球帝、虎扑、搜狐等公开报道。比赛照片图源Riot Games/韩国媒体现场图，比分卡与对阵卡为自制图。</p>\n"

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
