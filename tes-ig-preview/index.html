<script id="post-data" type="application/json">
{
  "title": "明天6点，LPL内战：TES赌稳，iG赌疯",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月3日 22:35",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/cover-tes-ig.jpg\" alt=\"TES vs iG 八强内战\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">▲ 369 与 TheShy。图源：Liquipedia 选手资料图</p>\n\n<p style=\"text-align:center;margin:0 0 10px;font-size:13px;letter-spacing:4px;color:#8a8a8a;\">S16 四分之一决赛 · LPL 内战</p>\n<p style=\"text-align:center;font-size:25px;font-weight:bold;color:#1a1a1a;margin:0 0 8px;line-height:1.45;\">明天 6 点，LPL 内战：<br>TES 赌稳，iG 赌疯</p>\n<p style=\"text-align:center;font-size:15px;color:#777;margin:0 0 30px;line-height:1.6;\">BO5 单败淘汰，第一场四分之一决赛，输的人直接回家</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">北京时间 11 月 4 日早上 6 点，TES 和 iG 站上同一张地图。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这是 S16 淘汰赛的第一场，也是 LPL 的内战。五局三胜，没有复活，没有下一轮。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong>赢的人进四强，输的人赛季结束。</strong>就这么简单。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#e10600;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#e10600;margin:14px 0 22px;border-bottom:3px solid #e10600;padding-bottom:9px;\">两条晋级路，两种性格</p>\n\n<img src=\"assets/paths.jpg\" alt=\"两条晋级路\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 22px;\">▲ TES 与 iG 的瑞士轮出线方式</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">两队战绩都是 3-1，但内容完全不一样。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong style=\"color:#e10600;\">TES</strong> 瑞士轮首轮就把 T1 赢了，开局直接把 LPL 的气势拉起来。之后稳扎稳打，输一场、赢三场，走的是\"先立威、再控盘\"的路。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>iG</strong> 的路更颠。四号种子，一路不被看好，直到末轮 2-1 掀翻 HLE，才把自己送进八强。那是 S16 里 LPL 第一次正面击败 LCK。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">TheShy 隔了 2565 天重新打回世界赛淘汰赛。这个数字，本身就够写一篇稿子。</p>\n\n<p style=\"background:#f5f5f5;border-left:4px solid #e10600;padding:16px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong>同一赛区，两种性格：TES 是稳稳落子，iG 是赌一把。</strong>这轮系列赛的味道，从出线方式就已经定了。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#e10600;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#e10600;margin:14px 0 22px;border-bottom:3px solid #e10600;padding-bottom:9px;\">上路，全场最贵的一条线</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">369 对 TheShy。这条线，基本决定了系列赛的走向。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>369</strong> 是本届最意外的一张牌。开赛前被临时拉回来救火，结果在 2-1 组碰上 BLG，先丢一局再让一追二，决胜局直接打出统治级表现。状态是热的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>TheShy</strong> 是另一回事。他的上限没人质疑，S8 的冠军上单，敢打、敢换、敢赌。问题是波动——打得顺的时候能一个人撕开整条边路，打得不顺的时候，也会把资源一起赔进去。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">BO5 里，这两种特质会被放大。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong style=\"color:#e10600;\">iG 需要 TheShy 赢线，而且必须赢得足够大；TES 只需要 369 不崩。</strong>一个要赢，一个只要平。这个心理差，很致命。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#e10600;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#e10600;margin:14px 0 22px;border-bottom:3px solid #e10600;padding-bottom:9px;\">iG 只有一种赢法</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">把两队的赢球路径摆在一起，会看得很清楚。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 12px;\">\n<tr>\n<th style=\"background:#1a1a1a;color:#fff;padding:10px 8px;text-align:left;border:1px solid #1a1a1a;\">维度</th>\n<th style=\"background:#1a1a1a;color:#fff;padding:10px 8px;text-align:left;border:1px solid #1a1a1a;\">TES</th>\n<th style=\"background:#1a1a1a;color:#fff;padding:10px 8px;text-align:left;border:1px solid #1a1a1a;\">iG</th>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">上路</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">状态热，只要不崩</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">上限最高，波动也最大</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">下路</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">JackeyLove + Meiko，经验足</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">需要顶住前中期压力</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">赢法</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">对线稳、团战强、可拖后</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">上路滚雪球，前中期结束</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #ddd;background:#f9f9f9;font-weight:bold;\">BO5 经验</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">更足</td>\n<td style=\"padding:10px 8px;border:1px solid #ddd;\">更少</td>\n</tr>\n</table>\n<p style=\"font-size:12px;color:#999;margin:0 0 22px;\">▲ 表格为作者基于公开赛况的判断，非官方数据。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">结论不复杂：<strong>iG 的胜利条件写在明面上</strong>——上路打出优势，前中期把节奏滚起来，不给 TES 拖到后期。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这条路只要有一环掉链子，就会断。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">TES 不一样。他可以打对线，可以打团，可以拖后期，也可以等 JackeyLove 站出来。赢法多，容错就高。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\"><strong style=\"color:#e10600;\">BO5 从来不是比谁的上限高，是比谁的漏洞少。</strong>这句话，对 iG 不太友好。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#e10600;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#e10600;margin:14px 0 22px;border-bottom:3px solid #e10600;padding-bottom:9px;\">两种剧本，你押哪一种</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>剧本 A：iG 赢了。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">四号种子掀翻三号种子，TheShy 在淘汰赛再往前一步，LPL 拿到一个完全没有预设的新故事。这种结局，情怀拉满。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 24px;\"><strong>剧本 B：TES 赢了。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">369 从救火队员变成四强上单，TES 带着更完整的阵容去碰下一轮。这个结局更\"合理\"，也更能打硬仗。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">如果让我押，我还是押 TES，三比一或者三比二。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">但如果你问我更想看哪个——<strong>我想看 iG 赢。</strong>不是因为更强，是因为更少见。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;background:#e10600;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#e10600;margin:14px 0 22px;border-bottom:3px solid #e10600;padding-bottom:9px;\">6 点的闹钟</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">北京时间 11 月 4 日早上 6 点，第一场四分之一决赛。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">对国内观众来说，这个时间不算友好。但 S16 打到这里，LPL 只剩两支队，一场内战注定了要走一个。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#e10600;line-height:1.75;margin:34px 0 24px;\">定好闹钟。<br>这一场，值得早起。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区押注：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">TES 还是 iG？比分你猜多少？</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">赛前说对的人，赛后回来认领。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注。这几天的 S16 淘汰赛，每一场都跟。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">资料来源：S16 官方赛果、Liquipedia。文中对位与胜负判断为作者观点，非官方数据。</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
