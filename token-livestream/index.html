<script id="post-data" type="application/json">
{
  "title": "321，上Token：李佳琦把AI卖成了口红",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月3日 00:38",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/livestream.jpg\" alt=\"李佳琦与陈宇森直播\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">▲ 11月2日晚，千问办公 CEO 陈宇森（右）做客李佳琦直播间。图源：受访者供图</p>\n\n<p style=\"text-align:center;margin:0 0 10px;font-size:13px;letter-spacing:4px;color:#8a8a8a;\">双 11 · Token 上架</p>\n<p style=\"text-align:center;font-size:25px;font-weight:bold;color:#1a1a1a;margin:0 0 8px;line-height:1.45;\">321，上 Token：<br>李佳琦把 AI 卖成了口红</p>\n<p style=\"text-align:center;font-size:15px;color:#777;margin:0 0 30px;line-height:1.6;\">10 分钟 5 万份，半小时 10 万份，约 2 万亿 Token</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">11 月 2 日晚 7 点半，李佳琦的购物车里多了一件看不见的东西。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">没有色号，不能试涂，价格 1 分钱。商品名叫\"千问办公个人会员月卡\"，卖点是 Token。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">评论区开始刷屏：<strong>\"321，上 Token。\"</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">10 分钟，5 万份售出。半小时，接近 10 万份。按直播间的说法，对应的 AI 算力额度合计约 2 万亿 Token。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这是主播直播间第一次卖 AI 算力商品。那个创下\"5 分钟卖 1.5 万支口红\"纪录的人，这次卖的是算力。</p>\n\n<p style=\"background:#f4f4ff;border-left:4px solid #4f46e5;padding:16px 18px;font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">在屏幕前，这只是一场热闹的带货。但把镜头拉远一点，它更像一个标志：<strong style=\"color:#4f46e5;\">AI 的计费单位，第一次以商品的形式，摆上了大众的货架。</strong></p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:18px;font-weight:bold;width:40px;height:40px;line-height:40px;box-shadow:6px 6px 0 #4f46e5;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#4f46e5;margin:18px 0 24px;\">先把 2 万亿拆开看</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这个数字很吓人，但它其实经不起细算。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">2 万亿 Token，按 10 万份月卡摊下来，平均每份约 2000 万 Token 的额度。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">而这份月卡的价格是 1 分钱。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">1 分钱不是定价，是补贴价。它是双 11 的引流款，是品牌买曝光的成本，不是这门生意的真实价格。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">还有一点更关键：<strong>2 万亿是\"权益额度\"，不等于实际被消耗掉的算力。</strong>就像健身房年卡卖了一万张，不代表一万个人真的去跑了一万次步。</p>\n\n<p style=\"background:#f9f9f9;padding:16px 18px;border-radius:6px;font-size:15px;color:#333;line-height:2;margin:0 0 28px;\"><strong>已知事实：</strong><br>销量：10 分钟 5 万份，半小时近 10 万份<br>价格：1 分钱会员月卡（补贴价）<br>折算：约 2 万亿 Token 权益额度<br>福利池：官方称整场放出 20 万亿 Token</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">所以别被\"2 万亿\"这四个字吓住。它证明的是卖得快，不是算力便宜。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:18px;font-weight:bold;width:40px;height:40px;line-height:40px;box-shadow:6px 6px 0 #4f46e5;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#4f46e5;margin:18px 0 24px;\">为什么是现在</p>\n\n<img src=\"assets/token-timeline.jpg\" alt=\"Token零售化时间线\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 22px;\">▲ Token 走上货架的四个节点</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">因为供给端已经把路铺好了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">中国信通院的数据：2026 年 6 月，国内词元日均消耗量约 500 万亿，是 2025 年 12 月的近 4 倍。同期，国内词元归一化均价从 6.8 元涨到 13.46 元，接近翻倍。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">量在涨，价也在涨。这说明 Token 不再是实验室里的概念，而是真实生产流程里持续烧掉的\"数字燃料\"。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">既然天天要烧，就总得有个地方买。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">9 月，天猫上线 AI 空间站，把 DeepSeek、阿里云、智谱、Kimi、千问办公等厂商的 Token 订阅摆进同一个专区。10 月，MiniMax 干脆在天猫开了官方旗舰店。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">双 11 开售首日，Token 品类的成交额环比增长 450%。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">从专区到旗舰店，再到头部主播的直播间，这条路走得很标准：<strong>先能买，再能比价，最后需要一个\"321 上链接\"的瞬间。</strong></p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:18px;font-weight:bold;width:40px;height:40px;line-height:40px;box-shadow:6px 6px 0 #4f46e5;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#4f46e5;margin:18px 0 24px;\">他们买的不是 Token</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">直播里，李佳琦问陈宇森：\"能不能帮我做个 AI 分身，24 小时陪女生们聊天？\"</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">陈宇森的回答当晚就出圈了：<strong style=\"color:#4f46e5;\">\"AI 取代不了李佳琦。我更希望帮粉丝用 AI 解决琐事——到点下班、陪伴猫狗、照顾家人。\"</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这句话聪明的地方在于，他没有卖\"算力\"，他卖的是\"早点下班\"。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">当晚演示的场景也很具体：家长用 AI 整理孩子的试卷，生成针对性的训练小游戏；直播运营把回放和弹幕丢进去，一键出复盘报告；钓鱼爱好者聊几句话，就生成一张能多人访问的全球钓鱼地图。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">没有人会为\"2000 万 Token\"激动。但会有人为\"再也不用熬夜剪复盘\"下单。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这跟当年买流量包一模一样。你买的不是 GB，是\"能追多少集剧\"。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">Token 只是账单上的单位，用户要的是账单背后的那件事。</p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:18px;font-weight:bold;width:40px;height:40px;line-height:40px;box-shadow:6px 6px 0 #4f46e5;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#4f46e5;margin:18px 0 24px;\">它离日用品，还差一枚价签</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">热闹之下，有个问题没人回答：这 2000 万 Token 到底能干什么？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">额度适用于哪些功能？有效期多长？能写几份 PPT、整理几套试卷、生成几张地图？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这些规则不讲清楚，Token 就还是一张看不懂的价签。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">还有一个更微妙的后果：万亿级的数字，本身就在制造焦虑。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">\"2 万亿\"听起来像一场必须参与的军备竞赛，好像不囤一点就要被时代甩下。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">但现实是，在会员畅用模式下，普通用户对 Token 的感知很弱。真正需要精算额度的，是调 API 的开发者，和要控成本的企业。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">对大多数人来说，该问的不是\"我的额度够不够\"，而是\"我到底用不用得上\"。<strong style=\"color:#4f46e5;\">AI 的价值不取决于 Token 有多少，取决于它能不能替你把活干完。</strong></p>\n\n<p style=\"text-align:center;margin:46px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:18px;font-weight:bold;width:40px;height:40px;line-height:40px;box-shadow:6px 6px 0 #4f46e5;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#4f46e5;margin:18px 0 24px;\">货架变了，故事也变了</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">头部主播的货架，一向是观察消费趋势的窗口。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">以前摆的是口红、纸巾、洗衣液。现在多了一个 Token，还有内置 AI 的电脑、AI 听记卡、桌面机器人。据天猫披露，今年双 11 会有 70 款搭载千问办公的电脑硬件首发。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">当 AI 公司开始谈转化率、客单价、拉新成本，这个行业的重心就变了：从参数和榜单，转向货架和账单。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">这不是一家公司的事。Token 一旦被零售，计量、定价、售后就得跟上——像卖流量套餐那样卖智能。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#4f46e5;line-height:1.75;margin:34px 0 24px;\">2 万亿 Token 卖爆，<br>只能证明 AI 上了货架；<br>能不能留在货架上，<br>要看下一枚价签写得清不清楚。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区聊聊：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">你会在直播间囤 Token 吗？</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">或者说，你现在用 AI，一个月花多少钱？</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注。AI 产品怎么卖、怎么定价、值不值，这里会继续盯。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">资料来源：潮新闻、界面新闻、猎云网、36 氪、纵相新闻、中国信通院公开数据。文中\"2 万亿\"为权益额度，非实际消耗算力；1 分钱为双 11 补贴价。</p>\n"
}
</script>

  <!-- 顶部提示条（复制/导出说明） -->

    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
