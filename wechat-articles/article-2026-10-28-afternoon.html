{
  "title": "滴水湖不只有湖｜地铁直达、新地标亮相、咖啡馆扎堆——这座年轻的城藏不住了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月28日 18:03",
  "location": "北京",
  "is_original": true,
  "body_html": "\n<p style=\"margin:0 0 16px;font-size:14px;color:#888;line-height:1.6;\">\n  作者：周末跑临港的上海土著 ｜ 编辑：滴水湖畔观察员\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#555;text-align:justify;\">\n  前阵子跟朋友约饭，她在临港新片区上班。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#555;text-align:justify;\">\n  吃完她拉我坐16号线回市区，路过滴水湖站的时候，我突然反应过来——<strong>我上一次来滴水湖，还是三年前的事。</strong>\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#555;text-align:justify;\">\n  那时候的印象很单薄：一个巨大的圆湖，湖边没什么像样的店，风一吹人就散了。\n</p>\n\n<p style=\"margin:0 0 32px;font-size:16px;font-weight:bold;line-height:1.8;color:#1a1a1a; letter-spacing:1px;\">\n  这次我专门留了一整天，好好逛了一圈。\n</p>\n\n<p style=\"text-align:center;margin:0 0 12px;\">\n  <img src=\"assets/gloryring.jpg\" style=\"max-width:100%;width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);\">\n</p>\n<p style=\"text-align:center;margin:0 0 40px;font-size:13px;color:#999;\">\n  图｜临港新地标\"荣耀之环\"（来源：解放日报/上海发布 孟雨涵摄）\n</p>\n\n\n<!-- ============ 章节一 ============ -->\n\n<p style=\"margin:54px 0 0;font-size:13px;letter-spacing:5px;color:#0a84ff;text-align:center;\">— 01 —</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#0a84ff;margin:12px 0 28px;\">那个\"飘浮\"在半空中的圆环，年底就要开门了</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  最先撞见的是金融湾的\"荣耀之环\"。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  之前只在效果图上看过，这次亲眼——怎么说呢，真的很像一只倒扣在楼顶上的金色飞碟。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  高50米，架在四栋高楼的顶端，圆环本身是透明的，据说内部有一条全玻璃的观景通道。站在上面，滴水湖全景和东海海岸线能同时装进眼里——<strong>这可能是上海第一个，同时能\"看湖又看海\"的城市观景台。</strong>\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  官方说建筑主体今年1月就完工了，正在做最后的内部装修，<strong>计划明年春节前后对公众开放</strong>。整个金融湾片区还有89万平米的商业空间，地下通道已经打通，等它开门，临港的市中心就真的\"立\"起来了。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:13px;color:#999;line-height:1.6;\">\n  ✦ 实用信息：目前荣耀之环本身不对外开放，周边的金融湾沿街商铺已有部分开业。\n</p>\n\n\n<!-- ============ 章节二 ============ -->\n\n<p style=\"margin:54px 0 0;font-size:13px;letter-spacing:5px;color:#0a84ff;text-align:center;\">— 02 —</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#0a84ff;margin:12px 0 28px;\">地铁16号线——出站就能\"看海\"</p>\n\n<p style=\"text-align:center;margin:0 0 12px;\">\n  <img src=\"assets/metro.jpg\" style=\"max-width:100%;width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);\">\n</p>\n<p style=\"text-align:center;margin:0 0 40px;font-size:13px;color:#999;\">\n  图｜地铁16号线滴水湖站二楼平台（来源：上海发布/上海市文旅局）\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  从市区坐16号线过来，终点站就是滴水湖站。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  出闸机上到二楼平台，眼前突然炸开一片蓝——真的像大海。湖的面积接近杭州西湖，风从湖面吹过来，带着水汽，跟市区的风完全不是一个味道。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  我特意绕到车站的另一侧，能看到整个湖的圆形轮廓，像被什么东西精准地画了一个圈。据说这是国内最大的人工湖，引的是东海的水。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  <strong>一个冷知识：滴水湖的设计其实是\"水滴形\"，不是正圆形。</strong>当初挖的时候是按一颗落入湖面的水滴的形状来的，所以北岸稍微尖一点，南岸圆润。站在金融湾那一侧拍照，才能看出完整的水滴感。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:13px;color:#999;line-height:1.6;\">\n  ✦ 实用信息：地铁16号线直达滴水湖站，车程约1小时20分钟（从龙阳路起）。出站后步行5分钟到湖边。\n</p>\n\n\n<!-- ============ 章节三 ============ -->\n\n<p style=\"margin:54px 0 0;font-size:13px;letter-spacing:5px;color:#0a84ff;text-align:center;\">— 03 —</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#0a84ff;margin:12px 0 28px;\">壹号码头 · 工业风的湖岸出片地</p>\n\n<p style=\"text-align:center;margin:0 0 12px;\">\n  <img src=\"assets/marina.jpg\" style=\"max-width:100%;width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);\">\n</p>\n<p style=\"text-align:center;margin:0 0 40px;font-size:13px;color:#999;\">\n  图｜滴水湖壹号码头（来源：上海发布/Hi临港）\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  离开地铁口，沿着环湖路往北走，大约10分钟就到壹号码头。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  半开放式的伞状钢结构，水泥质感的阶梯和观景台，工业风拉满。站在上面拍湖面，蓝得很清透，不像人工湖，倒像把一片海搬进了上海。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  码头边上有家叫\"壹福·li\"的湖景餐厅，粗犷的原木桌配大落地窗，窗外就是湖水。我去的时候是下午三点，阳光斜着打进来，靠窗的位置全坐满了。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  更意外的是——<strong>Manner Coffee滴水湖店就在码头旁边</strong>。这家店号称\"最孤独的Manner\"，几何造型的白色建筑从湖边\"长\"出来，像一座小型美术馆。推门进去就是橙色的座椅和热带绿植，反差感拉满。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:13px;color:#999;line-height:1.6;\">\n  ✦ 实用信息：壹号码头免费开放，地址在浦东新区环湖北一路26号。Manner和壹福餐厅都在同一个园区。\n</p>\n\n\n<!-- ============ 章节四 ============ -->\n\n<p style=\"margin:54px 0 0;font-size:13px;letter-spacing:5px;color:#0a84ff;text-align:center;\">— 04 —</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#0a84ff;margin:12px 0 28px;\">不止湖边咖啡，还有运动中心正在破土</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  但临港的变化，远不止这些\"网红打卡点\"。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  我特意查了下最新的规划——<strong>滴水湖运动中心（一期工程）今年9月刚拿到开工许可</strong>。位置在滴水湖东北岸，靠近临港大道那一片。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  这个运动中心规模不小：体育场、游泳馆、篮球馆、羽毛球馆、网球中心……光主体育场就能坐3万人，以后说不定能在这里开演唱会或者做业余联赛。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  加上已经建好的耀雪冰雪世界、海昌海洋公园、上海海昌天文馆，临港正在把\"周末一天游\"变成\"可以留下来过夜甚至定居\"的样子。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  <strong>国庆那场\"山河月宴\"美食生活节，来了超过5万人。</strong>40多个摊位沿着湖边排开，全国美食、潮玩手作、青年交友、甚至高薪岗位招聘会都搞在一起——\"吃喝玩乐、脱单、求职一站式搞定\"，这个口号不是空的。\n</p>\n\n<p style=\"margin:0 0 24px;font-size:15px;line-height:1.8;color:#333;text-align:justify;\">\n  你看，<strong>年轻人真的开始留下来了</strong>。不是来拍张照就走，而是开始在这里找工作、交朋友、过日子。\n</p>\n\n\n<!-- ============ 结尾 ============ -->\n\n<p style=\"text-align:center;margin:60px 0 32px;font-size:18px;font-weight:bold;color:#1a1a1a;line-height:1.6;\">\n  这座\"年轻的城\"<br>正在悄悄长出它的血肉\n</p>\n\n<p style=\"text-align:center;margin:0 0 24px;font-size:15px;color:#555;line-height:1.8;\">\n  下次如果朋友约饭在临港，<br>别再嫌远了——<br>留一天给自己，好好逛一逛。\n</p>\n\n<p style=\"text-align:center;margin:40px 0 24px;font-size:15px;color:#333;line-height:1.8;\">\n  <strong>你最近去过滴水湖吗？</strong><br>有什么私藏的好去处？\n</p>\n\n<p style=\"text-align:center;margin:0 0 60px;font-size:14px;color:#999;line-height:1.8;\">\n  评论区聊聊～点赞在看的朋友们<br>下次临港活动我们组团一起去！\n</p>\n\n<p style=\"margin:48px 0 0;border-top:1px dashed #e0e0e0;padding-top:24px;font-size:13px;color:#aaa;line-height:1.8;text-align:center;\">\n  本文部分信息参考：解放日报、上海发布、临港管委会官网<br>\n  配图来源已在每张图注中标明<br>\n  如有活动信息变动，请以官方公告为准\n</p>\n"
}

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
