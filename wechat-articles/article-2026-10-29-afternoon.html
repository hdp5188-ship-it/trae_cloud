<script id="post-data" type="application/json">
{
  "title": "在上海活了三十年，上周末才第一次认真逛滴水湖",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月29日 18:04",
  "location": "北京",
  "is_original": true,
  "body_html": "<!-- 开篇首图 -->\n<p style=\"margin:0 0 6px;text-align:center;\"><img src=\"assets/dishui-lake-sunset.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 36px;\">临港管委会 摄</p>\n\n<!-- 摘要 -->\n<p style=\"font-size:16px;line-height:1.8;color:#555;margin:0 0 40px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;说起来挺丢人的，在上海活了三十年，直到上周末才第一次认真逛滴水湖。以前总觉得那地方远——临港新城嘛，听着就像还在建设的大工地。结果地铁16号线一站站坐过去，从龙阳路出发，五十分钟，竟比我每次去虹桥还快。\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#555;margin:0 0 40px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;湖很大，大到我骑了两个小时才绕了半圈。但风是甜的，阳光是暖的，路边不时有野餐垫铺在草地上，有人骑车、有人散步、有人发呆。就是那种——你知道吗——在上海市区已经很难找到的、没那么紧、没那么挤的松弛感。\n</p>\n\n<!-- 章节一 -->\n<p style=\"text-align:center;font-size:22px;font-weight:900;color:#1a1a1a;letter-spacing:2px;line-height:1;margin:50px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#333;margin:10px 0 8px;\">一条藏不住的骑行线</p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 28px;\">「棒棒糖」40公里环湖骑行</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;滴水湖本身就是个圆形。官方修了一条40公里的骑行道，绕湖一圈，配上一捺伸向海边的小半岛，远看像根棒棒糖。\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;我是上午十点从一号码头出发的。一路沿西岸往北，先是湖畔的芦苇荡，然后是东岸的城市天际线，最后绕回南岛的洲际酒店。中途在一尺花园歇了半小时，喝了杯冰美式。\n</p>\n\n<p style=\"font-size:13px;line-height:1.8;color:#888;background:#f7f5f1;padding:18px 22px;margin:0 0 28px;border-radius:6px;\">\n<span style=\"font-weight:bold;color:#2b2b2b;\">📌 实用信息卡</span><br>\n路线起点：滴水湖一号码头<br>\n总里程：约40公里（含棒棒糖小半岛）<br>\n租车点：一号码头、南岛、临港大道地铁站旁均有共享单车/租赁车<br>\n最佳时段：工作日9-11点 / 周末16点后（避开人流高峰）<br>\n⏰ 暗知识：东岸靠近金融湾那段有一段地下通道，没信号，别慌，100米就出来\n</p>\n\n<!-- 章节二 -->\n<p style=\"text-align:center;font-size:22px;font-weight:900;color:#1a1a1a;letter-spacing:2px;line-height:1;margin:50px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#333;margin:10px 0 8px;\">湖边的咖啡，真的能让人坐一下午</p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 28px;\">两家值得专程绕路的小店</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;第一家是<b style=\"color:#1a1a1a;\">一尺花园</b>，在滴水湖西岸。说是\"花园\"一点不夸张——一千五百平米的空间，六千多本书，还有七个景观区打造的玻璃森林。我拍的那张帆就是从他家二楼露台往外扫的。\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;第二家是<b style=\"color:#1a1a1a;\">Manner 一号码头店</b>。开在工业风的码头建筑里，户外座位直接对着湖面。点杯燕麦拿铁，吹着湖风看帆船从湖心漂过来——我在这儿坐了俩小时，愣是没舍得走。\n</p>\n\n<p style=\"margin:18px 0 6px;text-align:center;\"><img src=\"assets/dishui-lake-sailing.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 28px;\">滴水湖湖心帆船 &nbsp;|&nbsp; 临港管委会 摄</p>\n\n<p style=\"font-size:13px;line-height:1.8;color:#888;background:#f7f5f1;padding:18px 22px;margin:0 0 28px;border-radius:6px;\">\n<span style=\"font-weight:bold;color:#2b2b2b;\">📌 实用信息卡 · 一尺花园</span><br>\n地址：滴水湖西岸湖滨路（骑行道旁）<br>\n营业时间：10:00 - 21:00<br>\n人均：80-120元（含饮品和甜点）<br>\n💡 暗知识：二楼临窗位置和露台最抢手，周末11点后基本坐满；如果是下午来，试试直接问能不能在吧台点单打包，坐到户外台阶上，视野一样好，还省了位<br><br>\n<span style=\"font-weight:bold;color:#2b2b2b;\">📌 实用信息卡 · Manner 一号码头店</span><br>\n地址：滴水湖一号码头工业风建筑内<br>\n营业时间：7:30 - 20:00<br>\n人均：25-35元\n</p>\n\n<!-- 章节三 -->\n<p style=\"text-align:center;font-size:22px;font-weight:900;color:#1a1a1a;letter-spacing:2px;line-height:1;margin:50px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#333;margin:10px 0 8px;\">游船、烟花、喷泉：晚上的湖，是另一个湖</p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 28px;\">别吃完晚饭就回家</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;我是下午四点多开始留意游船的。一号码头停着好几艘不同类型的船，有复古风的蒸汽船，也有现代感的快艇。挑了个夕阳正红的时段，二十分钟环湖一段——\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;水是蓝绿色的，阳光照下来，湖面像碎了一湖金子。我们绕着湖心岛转了半圈，船上有个游客在喊\"快看快看，那边有只白鹭\"——\n</p>\n\n<p style=\"margin:18px 0 6px;text-align:center;\"><img src=\"assets/dishui-lake-cruise.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 28px;\">滴水湖游船 &nbsp;|&nbsp; 临港管委会 摄</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;晚上七点，庆典广场的<b style=\"color:#d4380d;\">音乐喷泉</b>准点开。水柱跟着音乐节奏飙到三四十米高，投影、激光、烟花一起上，持续半小时。国庆期间我朋友去看了新版的\"心动时刻\"光影秀，说比去年又升级了。\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;如果不想挤，推荐去<b style=\"color:#d4380d;\">后街音乐会</b>。就在滴水湖枢纽站对面，每周五六晚上七点开始，专业乐队现场唱，风格从摇滚到民谣都有，免费。我上周碰到一支唱华语老歌的乐队，全场跟着大合唱，特别暖。\n</p>\n\n<p style=\"font-size:13px;line-height:1.8;color:#888;background:#f7f5f1;padding:18px 22px;margin:0 0 28px;border-radius:6px;\">\n<span style=\"font-weight:bold;color:#2b2b2b;\">📌 实用信息卡 · 夜间活动</span><br>\n音乐喷泉：庆典广场，每晚19:00 / 20:00各一场，时长约30分钟<br>\n后街音乐会：滴水湖枢纽站后街，每周五六 19:00-21:00<br>\n光影秀（定期）：湖心 + 环湖楼宇，节假日常有大型版本<br>\n💡 暗知识：音乐喷泉第二场20:00那场人明显少，位置好；如果想看烟花版的大型光影秀，关注\"临港发布\"公众号，提前一周放预告\n</p>\n\n<!-- 章节四 -->\n<p style=\"text-align:center;font-size:22px;font-weight:900;color:#1a1a1a;letter-spacing:2px;line-height:1;margin:50px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#333;margin:10px 0 8px;\">最后说点实在的：怎么去、住哪儿、吃什么</p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 28px;\">三件你一定会问的事</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;<b style=\"color:#1a1a1a;\">🚇 怎么去</b>\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;地铁16号线滴水湖站3号出口，步行5分钟就到湖边。从龙阳路地铁站发车，全程大概50分钟。自驾的话走S2沪芦高速，临港新城出口下，停车的话一号码头、南岛公园都有，周末偶尔紧张但不会找不到车位。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:24px 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;<b style=\"color:#1a1a1a;\">🏨 住哪儿</b>\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;不差钱选滴水湖洲际，位置最好，南岛边上看湖景。预算友好的话，滴水湖枢纽附近有锦江、全季、桔子水晶，步行15分钟到湖边。民宿的话，北岛有几家老洋房改造的，小而美，性价比不错。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:24px 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;<b style=\"color:#1a1a1a;\">🍜 吃什么</b>\n</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;环湖一线餐厅密度不低。湖南路那边有几家融合菜，皎皎南炉的烧腊饭我觉得可以专门绕一趟。龙光蓝鲸世界购物城地下一层是美食街，基本覆盖火锅、日料、港式茶餐厅。想自己动手的话，世纪联华可以买食材，湖边草坪随便找块地就能野餐。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 28px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;<b style=\"color:#1a1a1a;\">❌ 不推荐</b>：湖中心那家旋转餐厅，性价比真不行，风景虽好但菜单贵还味道平平，不如找家湖边小馆子坐一坐。\n</p>\n\n<!-- 结尾 -->\n<p style=\"margin:50px 0 28px;\"><span style=\"display:inline-block;width:40px;height:1px;background:#ccc;vertical-align:middle;margin-right:14px;\"></span><span style=\"color:#999;font-size:14px;\">写在最后</span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;那天骑车骑到东岸的时候，太阳开始落了。湖面是金色的，远处的高楼玻璃幕墙也被染成一片暖橙。我停下车，靠在一棵梧桐树上喘气。\n</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;想起以前总觉得临港是\"大工地\"，还在建设、还远、还不方便。结果那天才发现——它其实已经长起来了。街道干净，人不那么挤，湖风吹过来带着青草的味道。\n</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 28px;\">\n&nbsp;&nbsp;&nbsp;&nbsp;上海这座城市的脾气是，东边西边都住着一群怕耽误了什么的人。但滴水湖不一样，它好像故意慢了半拍，留给愿意停下来的人。\n</p>\n\n<p style=\"text-align:center;font-size:15px;color:#555;margin:40px 0 10px;\">\n** 周末想找个不那么赶的地方，来滴水湖转转吧。**\n</p>\n\n<!-- 互动引导 -->\n<p style=\"margin:50px 0 0;background:#f5f3ef;padding:20px 22px;border-radius:8px;font-size:15px;color:#333;font-weight:bold;line-height:1.8;\">💬 你去过滴水湖吗？</p>\n<p style=\"margin:0;background:#f5f3ef;padding:0 22px 20px;border-radius:0 0 8px 8px;font-size:14px;color:#666;line-height:1.8;\">评论区聊聊你最喜欢的打卡点，或者有什么我没发现的好地方——收藏这篇，下周末就出发。</p>\n"
}

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
