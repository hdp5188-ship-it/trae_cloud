{
  "title": "滴水湖又搞大事了！新地标+新配套，这波是真的猛",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月30日 18:03",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"color:#999;font-size:13px;text-align:center;margin:20px 0 10px;\">上海 · 临港滴水湖</p>\n\n<p style=\"font-size:26px;font-weight:bold;color:#1a1a1a;text-align:center;margin:10px 0 5px;\">滴水湖又搞大事了！</p>\n<p style=\"font-size:22px;font-weight:bold;color:#0a84ff;text-align:center;margin:5px 0 20px;\">新地标+新配套，这波是真的猛</p>\n\n<img src=\"assets/honor-ring.jpg\" style=\"max-width:100%;width:100%;\">\n<p style=\"color:#999;font-size:12px;text-align:center;margin:5px 0 30px;\">荣耀之环 · 临港管委会供图</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:20px 0;\">上海的朋友注意了。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">如果你最近去过临港，应该已经注意到——那座悬在滴水湖金融湾上空的金色大圆环，<strong style=\"color:#0a84ff;\">亮起来了</strong>。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">没错，就是被很多人称作\"临港东方明珠\"的——荣耀之环。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:20px 0;\">年初的时候官方就说了，这玩意儿建设基本完成，即将投入使用。掐指一算，<strong style=\"color:#0a84ff;\">年底就能跟大家见面</strong>。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">我前阵子刷到一张它夜晚亮灯的照片，说实话被震了一下。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">153米直径的巨型圆环，悬在临湖的四栋商办楼上。夜幕下泛着金光，从空中俯瞰，真的像一只金色飞碟停在城市上空。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">这造型，搁几年前说这是临港要搞的东西，你信吗？</p>\n\n<p style=\"margin:40px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">荣耀之环到底是什么来头</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">先给大家扒一扒这个\"环\"。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">位置在滴水湖北岸的金融湾核心区，是整个滴水湖金融湾一期的标志性建筑。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">直径153米，建筑面积大概6000平方米，架在四栋20层的商办楼顶上。设计师说这是象征金融服务业态与各行各业紧密相连的\"合作之环\"。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">不过说实话，大家记住它，纯粹是因为<strong style=\"color:#8b4a2b;\">好看</strong>。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">从湖边拍过去，四个角度四种感觉。白天是金属质感的科幻派，晚上灯光一打直接变身赛博朋克。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:20px 0;\">而且这不是个空架子。底下配了超89万平方米商业空间、7500多平方米市民文化场地，还有2.8万多平方米的公共开放区域。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">等开了之后，湖边又多了一个吃喝逛的好去处。</p>\n\n<img src=\"assets/dishui-lake-aerial.jpg\" style=\"max-width:100%;width:100%;\">\n<p style=\"color:#999;font-size:12px;text-align:center;margin:5px 0 30px;\">滴水湖航拍 · 临港管委会供图</p>\n\n<p style=\"margin:40px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">运动中心也来了，住临港的有福了</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">地标是面子，配套是里子。这不，运动中心也安排上了。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">今年9月底，滴水湖运动中心一期工程完成了开工放样复验，<strong style=\"color:#0a84ff;\">正式进入施工阶段</strong>。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">位置在哪呢？就在滴水湖北岸，环湖北三路那边——从地铁站出来骑车十分钟能到。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">简单说就是：住临港新城镇的小伙伴，以后家门口就能踢球、跑步、搞各种运动了。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:20px 0;\">其实临港这几年的变化，真的是肉眼可见。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">我去年第一次去滴水湖的时候，感觉还是个\"大工地+大公园\"。去了趟临港图书馆，然后湖边转一圈，吃饭只能去附近几个商业体。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">这次再刷到这些新闻，感觉完全不一样了。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">荣耀之环年底亮，运动中心开建，还有之前说的288航空科幻基地年底要内测开放——你算算，<strong style=\"color:#8b4a2b;\">从一个纯工作日的上班点，变成了周末也能待一整天的新目的地</strong>。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:20px 0;\">而且不光是新东西。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">今年国庆期间，滴水湖搞的那个光影节和烟花秀，朋友圈刷爆了。环湖灯光秀、无人机表演、花车巡游，连本地人都在说\"这还是我认识的临港吗\"。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">还有之前的滴水湖幸福河湖建设工程也批了，整个水系都在升级。</p>\n\n<p style=\"margin:40px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">临港这盘棋，下得真快</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">说点题外话。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">临港新片区从2019年8月挂牌到现在，才7年多一点。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">想想7年前是什么样？那时候你说\"我要去临港上班\"，亲戚朋友可能会问\"临港在哪\"。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">现在呢？芯片、航空、人工智能，三大产业都在那边砸重金。自贸区离岸贸易金融改革试点扩围、\"超级个体\"经济政策刚出来，三年免租、百万奖励、算力补贴拉满。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">这不只是造个新城。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">是真的在打造一个<strong style=\"color:#0a84ff;\">能吸引年轻人留下来工作、生活、安家的新地方</strong>。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:20px 0;\">我有时候觉得，滴水湖就是这个新城的\"灵魂所在\"。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">湖本身是个人工湖，形状像一滴水落下的涟漪。围绕着它，一圈一圈建起来的东西——从最早的港城广场、朵云书院，到现在的荣耀之环、运动中心。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">像是一个正在展开的故事。每建一个新东西，故事就往前进了一页。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">而现在，这故事才刚刚翻到精彩的章节。</p>\n\n<img src=\"assets/dishui-lake-night.jpg\" style=\"max-width:100%;width:100%;\">\n<p style=\"color:#999;font-size:12px;text-align:center;margin:5px 0 30px;\">滴水湖一号码头夜景 · 临港管委会供图</p>\n\n<p style=\"margin:40px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">最后说点实在的</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">如果你还没去过临港，真的可以安排一下。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">路线给你简单规划一下：</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">地铁16号线到滴水湖站，出来就是湖边。坐个环湖观光车或者租辆自行车，顺着湖东岸骑到北岸。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\"><strong style=\"color:#8b4a2b;\">推荐傍晚去</strong>。日落的时候湖面会变色，然后等到晚上亮灯，荣耀之环的金光加上环湖楼宇的灯光秀，氛围感拉满。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">吃饭的话，港城广场、龙光蓝鲸世界都在边上，选择还挺多的。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">等年底荣耀之环正式开放了，再来一波更爽。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:20px 0;\">对了，评论区聊聊——</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">你去过临港滴水湖吗？</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">对那个金色大圆环怎么看？</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:10px 0;\">或者，你最期待临港还有什么新变化？</p>\n\n<p style=\"font-size:15px;color:#999;line-height:1.9;margin:40px 0 20px;text-align:center;\">\n本文信息来源：<br>\n临港管委会官网(lingang.gov.cn)<br>\n上海发布、上观新闻、解放日报等公开报道\n</p>\n\n<p style=\"font-size:14px;color:#bbb;text-align:center;margin:20px 0;\">— END —</p>\n"
}

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
