<script id="post-data" type="application/json">
{
  "title": "今天，33位诺奖得主正在滴水湖边开会——世界顶尖科学家论坛开幕了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月30日 08:26",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 8px;\"><img src=\"assets/forum-venue-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:6px 0 32px;line-height:1.6;\">世界顶尖科学家论坛永久会址——临港中心，10月4日无人机航拍。摄影：新华社 丁汀</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">今天早上坐16号线，到滴水湖站，出站第一眼就觉得不对。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">多了一堆穿正装、拖拉杆箱的外国人。有人边走边用英语打电话，有人在拍照，对着临港中心那两栋白色塔楼。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">刷了一下新闻，才反应过来——</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">今天，世界顶尖科学家论坛在滴水湖边开幕了。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">33位诺贝尔奖、图灵奖、沃尔夫奖、菲尔兹奖得主，以及139位资深科学家、81位青年科学家，整个周末都要在临港中心待着。</p>\n\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2b2b2b;margin:44px 0 20px;line-height:1.6;letter-spacing:1px;\">你可能还没意识到，<br>这件事有多大。</p>\n\n<p style=\"margin:42px 0 0;\"><span style=\"display:inline-block;background:#2b4b8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:7px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2b4b8b;margin:12px 0 24px;border-bottom:3px solid #2b4b8b;padding-bottom:9px;line-height:1.4;\">这是上海每年最不该错过的三天</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">顶科论坛从2018年开始办，前几年在上海科技馆、临港中心轮着来。2022年起，永久落在临港。每年10月底，这帮\"诺奖天团\"都会飞一趟上海。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">今年的阵容是迄今最硬的一次：<strong style=\"color:#2b2b2b;\">7位诺奖得主、3位图灵奖得主、10位世界顶尖科学家奖获奖者</strong>。连两次拿过诺贝尔化学奖的巴里·夏普利斯都来了——老爷子80多岁了，去年刚在上海领过奖。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">而且第一次，<span style=\"background:#e3ecfa;color:#2b4b8b;font-weight:bold;padding:1px 5px;border-radius:3px;\">产业界的人也坐到了主桌</span>。宁德时代的曾毓群要和2025年诺贝尔化学奖得主奥马尔·亚吉、菲尔兹奖得主洛朗·拉福格一起上台演讲。以前顶科论坛都是\"纯学术\"，今年产业第一次真正走进来——这是信号。</p>\n\n<p style=\"margin:42px 0 0;\"><span style=\"display:inline-block;background:#2b4b8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:7px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2b4b8b;margin:12px 0 24px;border-bottom:3px solid #2b4b8b;padding-bottom:9px;line-height:1.4;\">中国人第一次拿顶科奖，是什么奖？</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">顶科奖是论坛自己设的，分量和诺奖差不多，每年评一次。今年的结果9月就出来了，最让人激动的一件事：<strong style=\"color:#2b4b8b;\">邵峰，成为顶科奖创办以来第一位中国籍获奖者。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">他和袁钧瑛、王晓东、维什瓦·迪克西特一起拿的是\"生命科学或医学奖\"，四个人研究的是<span style=\"background:#e3ecfa;color:#2b4b8b;font-weight:bold;padding:1px 5px;border-radius:3px;\">程序性细胞死亡</span>的分子机制——说人话就是，搞清楚细胞是怎么\"自己结束自己\"的。这件事听起来很干，但脓毒症、自身炎症、神经退行性病变甚至癌症的治疗都跟它直接相关。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">更有意思的是新设的\"青年科学家奖\"，6位得主里<strong style=\"color:#2b4b8b;\">5位是华人</strong>。其中有个叫吴佳俊的年轻人，研究的是\"物理真实的世界模型\"——直白说就是让机器真正理解世界，跟机器人、自动驾驶直接相关。还有谢伟迪，把AI用到了罕见病诊断上，已经在临床上用起来了。</p>\n\n<p style=\"margin:42px 0 0;\"><span style=\"display:inline-block;background:#2b4b8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:7px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2b4b8b;margin:12px 0 24px;border-bottom:3px solid #2b4b8b;padding-bottom:9px;line-height:1.4;\">论坛这三天，他们到底聊些啥？</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">主题是<strong style=\"color:#2b2b2b;\">\"范式变革：科学突破的下一个十年\"</strong>。六个平行论坛，分别对应六大前沿——未来半导体、人工智能、生物医药、空天信息、未来能源、量子科学。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">光AI那个分会场，就会图灵奖得主杰克·唐加拉、马丁·赫尔曼，还有寒武纪创始人陈云霁到场。他们聊的不是\"GPT好用不好用\"，是AI下一个十年该怎么造——从芯片到伦理，全链条。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">论坛还设了四个主题活动：青年科学家大会、女科学家大会、未来科学家大会（面向青少年）、顶尖孵化器大会。明天（10月31日）开幕式下午，开幕式就将颁发顶科奖。</p>\n\n<p style=\"margin:42px 0 0;\"><span style=\"display:inline-block;background:#2b4b8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:7px;\">04</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2b4b8b;margin:12px 0 24px;border-bottom:3px solid #2b4b8b;padding-bottom:9px;line-height:1.4;\">为什么选在滴水湖边？</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">这个问题我问过几个朋友，有人说\"因为临港空\"，有人说\"政策支持\"。都不完整。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">临港中心不是个普通会议室。2022年11月永久会场启用的时候，新华社用了一个词：<strong style=\"color:#2b4b8b;\">\"科学自由港\"</strong>。它旁边连着科学公园、海智国际研发社区、上海天文馆、上海海事大学——一个从\"会场\"延伸到\"城市\"的完整链条。</p>\n\n<p style=\"margin:0 0 8px;\"><img src=\"assets/forum-venue-front.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:6px 0 32px;line-height:1.6;\">临港中心正门。摄影：新华社 丁汀</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">今年论坛还配套了四条科技参访路线——同济大学的智能网联汽车测评基地、国家蛋白质科学研究（上海）设施、上海天文馆、长电科技汽车电子。科学家们开完会，转个弯就去看上海的硬核科技设施了。这就是\"科学自由港\"的意思：<span style=\"background:#e3ecfa;color:#2b4b8b;font-weight:bold;padding:1px 5px;border-radius:3px;\">开会在这儿，研究也在这儿，产业转化也在这儿。</span></p>\n\n<p style=\"margin:42px 0 0;\"><span style=\"display:inline-block;background:#2b4b8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:7px;\">05</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2b4b8b;margin:12px 0 24px;border-bottom:3px solid #2b4b8b;padding-bottom:9px;line-height:1.4;\">最后说两句实在的</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">顶科论坛的主论坛和很多平行论坛是不对外开放的。但有几个你可以凑凑热闹：</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">论坛前后四天的科技参访面向公众开放部分名额；\"顶科HUB\"分享区免费，同期有青年科学家海报长廊和产学研对接；闭幕式还会有刘徽展临展——用古籍和数字装置讲中国古代数学。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">还有一件事值得留意：明年2027年是顶科论坛的第十年。今年闭幕式上要正式发出设立常设性国际组织的倡议——也就是说，这三天的\"年会\"可能要变成一个常驻上海的国际平台。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#2b2b2b;line-height:1.8;margin:44px 0 24px;letter-spacing:1px;\">一个城市的格局，<br>藏在它愿意接下的那几天里。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">周末如果有空，坐16号线去滴水湖走走。从湖岸望向临港中心那两栋白色塔楼，你会意识到——</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 20px;text-align:justify;letter-spacing:0.3px;\">就在那里面，33位诺奖得主正在聊人类科学的下一个十年。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3f3f3f;margin:0 0 26px;text-align:justify;letter-spacing:0.3px;\">对了，今年顶科论坛的开幕式是10月31日（明天）上午。邵峰的顶科奖颁奖就在那儿。有兴趣的可以留意官方直播。</p>\n\n<p style=\"background:#f3f5f9;border-left:4px solid #2b4b8b;padding:18px 20px;margin:0 0 26px;font-size:14px;line-height:2;color:#4f4f4f;letter-spacing:0.3px;\">2026世界顶尖科学家论坛<br>时间：10月30日（今天）—11月1日（周日）<br>地点：上海临港中心（世界顶尖科学家论坛永久会址）<br>主题：范式变革：科学突破的下一个十年<br>重点关注：10月31日上午开幕式暨颁奖典礼（邵峰等顶科奖得主亮相）<br>公众活动：顶科HUB分享区（免费）、科技参访路线（部分开放报名）</p>\n\n<p style=\"text-align:center;font-size:12px;color:#b0b0b0;margin:30px 0 0;letter-spacing:3px;\">— END —</p>\n"
}
</script>

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
