<script id="post-data" type="application/json">
{
  "title": "上海秋天最舒服的40公里，藏在16号线的终点站",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月30日 08:04",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 10px;\"><img src=\"assets/honor-ring.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:8px 0 30px;line-height:1.6;\">从空中看滴水湖金融湾，湖对岸的天际线已经长起来了。摄影：解放日报 孟雨涵</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">上海的秋天很短。短到你还没想好周末去哪，梧桐叶就落完了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">所以上周六早上七点半，我坐上了16号线，一路往东，坐到终点站。出站抬头，天低得不像上海，云像刚洗过，风里有一股咸味。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">这里是滴水湖。上海最东边，也是最容易被市区人忘掉的一个湖。</p>\n\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2b2b2b;line-height:1.7;margin:36px 0;letter-spacing:1px;\">但它真的是个骑行好地方。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#a04a26;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#a04a26;margin:12px 0 22px;border-bottom:3px solid #a04a26;padding-bottom:9px;line-height:1.4;\">先认清两个圈</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">滴水湖是圆的，圆得很规整。贴着湖水的环湖一路，骑一整圈是8公里。慢慢骑四十分钟，赶时间半小时也能绕完。路面平整，几乎没坡，湖一直在你右手边。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">但网上说的“滴水湖40公里”，指的是另一条线，大家叫它<span style=\"background:#f6e7da;color:#a04a26;font-weight:bold;padding:1px 4px;border-radius:3px;\">“棒棒糖”</span>——一根棍子加三个圈。棍子是海港大道往返，三个圈是环湖一路、二路、三路，一圈比一圈大。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">完整走法大概是这样：洲际酒店出发，环湖一路南下，经过一尺花园、壹号码头、朵云书院，转上海港大道，接环湖二路，穿过春花秋色公园和星空之境海绵公园，再路过中国航海博物馆、南汇新城城市公园，绕到环湖三路，看一眼上海天文馆，最后经海港大道回到起点。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">听着很唬人。所以第一次来，<strong style=\"color:#2b2b2b;\">别硬上40公里。</strong>先把8公里的环湖一路骑舒服了，觉得不过瘾，再往外加圈。骑到一半没劲了，随时可以掉头，湖边没有哪一段是白骑的。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#a04a26;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#a04a26;margin:12px 0 22px;border-bottom:3px solid #a04a26;padding-bottom:9px;line-height:1.4;\">早上骑，和下午骑是两回事</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">这是我最想提醒的一句。<span style=\"background:#f6e7da;color:#a04a26;font-weight:bold;padding:1px 4px;border-radius:3px;\">周末九点以后，一号码头和七彩桥就开始排队拍照了。</span>八点半之前出发，整条湖岸线基本是你的。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">租车不用愁。16号线滴水湖站1号口附近就有租车点，共享单车也能骑。建议逆时针，湖在右手边，看水不用歪头。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">还有几个细节，是骑过才知道的。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">东港大道早间常有晨雾，能见度不高，前灯记得开。海堤段的风能到三四级，防风手套和面巾别嫌麻烦。东港大道到观海公园有一段缓坡，秋天早上路面有露水，下坡别冲。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">我第一次去没带手套，骑到海堤手冻得握不住刹车。这不算什么大事，但确实影响心情。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#a04a26;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#a04a26;margin:12px 0 22px;border-bottom:3px solid #a04a26;padding-bottom:9px;line-height:1.4;\">路上值得停下来的四个地方</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\"><strong style=\"color:#a04a26;\">一尺花园（西岸店）</strong>，环湖西一路858号。云朵形状的玻璃房落在码头上，六千多本书，七种景观。二楼临窗的位置最好，早上刚开门，几乎没人。</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/yichi-garden.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:8px 0 30px;line-height:1.6;\">一尺花园西岸店，像一朵落在码头上的云。图片来源：乐游上海</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\"><strong style=\"color:#a04a26;\">壹号码头</strong>，环湖西一路1号。半开放的混凝土框架，人站在伞状的阴影底下，湖面蓝得像海。拍照别站台阶正中，往边上走两步，画面会干净很多。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\"><strong style=\"color:#a04a26;\">朵云书院</strong>，港城广场文化艺术中心五楼。二十米的通天书架，七万册书沿着台阶往上铺。巨大的落地窗外就是湖。低头看书，抬头看湖，这句话在这儿不是文案。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\"><strong style=\"color:#a04a26;\">春花秋色公园</strong>，环湖南二路。芦苇、草甸、水岸，一整片没什么人的野地。秋天来这儿最对，风一吹，芦苇穗子全往一个方向倒。</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/chunhua-qiuse.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:8px 0 30px;line-height:1.6;\">春花秋色公园入口，木栈道一直往里延伸。图片来源：乐游上海</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">想再走远一点，还有星空之境海绵公园、中国航海博物馆、上海天文馆。天文馆要提前预约，别骑到门口才发现进不去。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#a04a26;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">04</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#a04a26;margin:12px 0 22px;border-bottom:3px solid #a04a26;padding-bottom:9px;line-height:1.4;\">顺便说三件新事</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">骑到金融湾那一段，抬头会看见一个巨大的金色圆环。这是“荣耀之环”，直径153米，今年1月基本建成，底下有89万平方米商业空间。原来说上半年开放，现在开没开，你到现场看一眼就知道了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">第二件，市域铁路南汇支线今年8月全线结构贯通，34.86公里、6座车站，终点站就在滴水湖北站。以后从浦东机场过来，不用再绕一大圈。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">第三件是给在这儿上班的人看的。8月的发布会上，临港说“十五五”期间会放宽落户、给重点用人单位更大的引才自主权；人才购房补贴也从9月21日起常态化申请。这些听着离骑行很远，但对住在这里的人来说，是每天傍晚能不能轻松来湖边散步的事。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#2b2b2b;line-height:1.8;margin:44px 0 24px;letter-spacing:1px;\">滴水湖的好，<br>不在某一个景点，<br>在那段没什么人的路上。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 20px;letter-spacing:0.4px;text-align:justify;\">骑完40公里，我在一号码头坐了很久。湖对岸的楼一栋栋亮起来，风还是咸的。市区那边大概已经在堵车了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3f3f3f;margin:0 0 26px;letter-spacing:0.4px;text-align:justify;\">你在滴水湖骑过吗？哪一段最好看，或者哪家店值得专门停一下——留言区说说，下次我按你们的路线再骑一遍。</p>\n\n<p style=\"background:#fbf6ef;border-left:4px solid #a04a26;padding:18px 20px;margin:0 0 26px;font-size:14px;line-height:2;color:#5a5a5a;letter-spacing:0.3px;\">出行贴士<br>交通：地铁16号线至滴水湖站，1号口附近可租车<br>距离：环湖一路一圈8公里，完整“棒棒糖”线约40公里<br>时间：周末建议8:30前出发，避开拍照人流<br>装备：防风手套、面巾、车灯；带水，秋天也要防晒<br>顺路：一尺花园、壹号码头、朵云书院、春花秋色公园</p>\n\n<p style=\"text-align:center;font-size:12px;color:#b0b0b0;margin:30px 0 0;letter-spacing:3px;\">— END —</p>\n"
}

      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
