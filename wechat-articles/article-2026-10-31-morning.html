<script id="post-data" type="application/json">
{
  "title": "早上6点47分，滴水湖刚醒",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月31日 08:14",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 10px;\"><img src=\"assets/01-dishui-lake.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">滴水湖与金融湾。图源：临港集团</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">五点五十，龙阳路站开出第一班16号线。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">六点四十七，车停在滴水湖。出站，风先到。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">很多人对临港的印象，是芯片厂、是写字楼、是晚上十点还亮着灯的办公室。没错，但那不是全部。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">临港最舒服的时候，是早上七点。湖面还没被太阳晒热，草坪上只有遛狗的人和跑步的人，整个城市像刚洗完脸。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 01 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">湖是挖出来的</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">滴水湖不是天然的。2002年6月动工，挖了15个月，运走1780多万立方米土，才有了这一汪圆水。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">湖面直径2.5公里，整片区域5.56平方公里，湖里还有三座岛。站在岸边，对岸的楼看着很近，走起来才知道远。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">早上来最大的好处，是人少。没有排队，没有抢机位，拍照不用等别人让开。</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#16615f;line-height:1.7;margin:30px 0;letter-spacing:1px;\">滴水湖的好，全在上午九点之前。</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/03-lakeside-lawn.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">环湖草坪上，帐篷比人多。图源：乐游上海</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">我那天在湖边坐了二十分钟，看一个爷叔把折叠椅打开，保温杯拧开，茶叶倒进去，再拧上。动作很慢，一点不赶。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">这大概就是临港的早晨。不热闹，但很松弛。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 02 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">一圈8.5公里，别贪快</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">环湖一圈8.5公里。走完大概90分钟，骑车不到一小时，跑步的话，配速六分半刚好一圈。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">路线不用记太细，从一号码头出发，沿着环湖绿带一直走，北岛、南岛、西岛挨个过一遍，最后回到起点。亲水平台、草坪、雕塑，都在路边。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">带娃的走到北岛就可以折返，四公里左右，小孩不会闹。想刷完整圈的，把水带上，沿途补给点不算密。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">湖边风比市区大。</strong>早上尤其凉，短袖出门十有八九要后悔。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">共享单车地铁站外就有，但周末去得晚，常常一辆不剩。想骑，赶早。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">骑得动的话，还有一条40公里的“棒棒糖”线路，从洲际酒店出发，绕环湖一路、环湖二路、环湖三路，把春花秋色公园、海绵公园、航海博物馆、天文馆全串起来。那是另一个强度，量力而行。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 03 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">九点半，进馆</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/02-sponge-park.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">星空之境海绵公园，远处是上海天文馆。图源：乐游上海</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">太阳一高，湖边就晒了。这时候往馆里走，刚刚好。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">上海天文馆在临港大道380号，9点半开馆，4点停止入馆，周一闭馆，法定节假日除外。成人票30块，周六和法定节假日会延时开放。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">票要提前约。热门时段的票，周末常常几天前就没了，临时起意基本进不去。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">旁边还有中国航海博物馆，和海绵公园那片水杉林。水杉秋天最好看，现在正是时候，一排排立在水边，风一吹，叶子往下掉。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">如果只安排半天，我的顺序是：湖边先走一小时，九点半进馆，十一点半出来吃饭。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 04 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">湖边吃什么</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">朵云书院、一尺花园、壹号码头，这几家都在环湖一带，书店加咖啡，坐着能看到水。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">但它们大多十点前后才开门。真想吃口热的早饭，往地铁站和山兰路步行街那边走，选择更多，也更像本地人吃的东西。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">周末中午，湖边这几家基本都要等位。错峰的办法很简单，十一点前落座。</p>\n\n<p style=\"border-left:4px solid #16615f;background:#f4f8f7;padding:14px 18px;margin:28px 0;font-size:15px;line-height:1.9;color:#31524f;\">一个上午的时间表，可以直接抄：<br>06:47 到站，湖边走走<br>07:30 环湖 8.5 公里<br>09:30 天文馆或航海博物馆<br>11:30 湖边吃饭，收工</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 05 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">临港还在长</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">湖边待久了会发现，这片地方一直没停。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">滴水湖运动中心一期，9月底刚完成开工放样。位置在环湖北三路、香柏路、春涟河围起来的那块地，以后湖边跑步的人，多了个能进去练的地方。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">金融湾的“荣耀之环”，1月完成建设，今年已经亮起来、用起来了。直径153米，环顶56米高，站上去能360度看整个滴水湖。光影节、世界技能大赛的临港专场，都往那儿放。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">临港的上海288基地，5月启动，计划年底前完成大规模建设、启动内测。航空科幻IP落地临港，听着有点远，但工地在那儿。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">医疗和教育也在补。按8月发布会上的说法，浦东医院临港院区年内建成，华东师范大学、同济大学的临港校区在加快推进。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">10月28日，2026上海国际再保险会议也放在临港开。金融湾不只是几栋好看的楼，是真有人在里面做事。</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#16615f;line-height:1.7;margin:30px 0;letter-spacing:1px;\">这些不是效果图，是已经在发生的事。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">所以每次有人问我，临港值不值得专门跑一趟。我的答案是：早上去，别下午去。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 06 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">走之前，记三件事</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">带件外套。湖边的风，比市区大不止一点。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">看好回程。滴水湖往龙阳路，末班车22:30，上午来的人多半用不上，但留着总没错。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">周一天文馆闭馆，别白跑。票提前约，别赌现场。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">这篇写的是上午。傍晚的滴水湖是另一副样子，灯光、人群、烟火气，留到下一篇说。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">你最早一次到滴水湖，是几点？</strong>在评论区说说，我看看有多少人跟我坐过同一班车。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#a3a3a3;letter-spacing:2px;margin:40px 0 0;\">— 完 —</p>\n<p style=\"text-align:center;font-size:14px;color:#8a8a8a;line-height:1.9;margin:14px 0 30px;\">图源：临港集团、乐游上海<br>资料：上海发布、临港新片区管委会、上海天文馆</p>\n"
}

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
