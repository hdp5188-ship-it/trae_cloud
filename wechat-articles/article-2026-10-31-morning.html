<script id="post-data" type="application/json">
{
  "title": "今天上午，滴水湖来了32位全世界最聪明的人",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月31日 10:15",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 10px;\"><img src=\"assets/01-dishui-lake-west.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">滴水湖与西岛。图源：临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">今天周六。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">滴水湖一天里，塞了三件事。最重的一件，就在上午。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">如果坐最早那班16号线，5点50分从龙阳路发车，6点47分到滴水湖。出站时天刚亮透，湖边的风先给你一巴掌。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">这个点来，你赶上的不只是一片湖。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 01 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">今早，湖边开的是这个会</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/02-lingang-center.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">临港中心，世界顶尖科学家论坛永久会址。图源：临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">10月30日到11月1日，2026世界顶尖科学家论坛在临港中心开，会期三天。今天上午，开幕式、颁奖典礼和主论坛，全在这一场里。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">规模不小。32位顶尖科学家确认到场，里面有6位诺贝尔奖得主、3位图灵奖得主，7位是第一次来。再算上140位资深科学家、81位青年科学家，这几天滴水湖边的“大脑密度”，大概比上海任何一栋写字楼都高。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">今年的主题是“范式变革：科学突破的下一个十年”。听着有点虚，落到议程上却很实——六场平行论坛，分别聊未来半导体、生物医药、空天信息、人工智能、未来能源、量子科学。</p>\n\n<p style=\"border-left:4px solid #16615f;background:#f4f8f7;padding:14px 18px;margin:28px 0;font-size:15px;line-height:1.9;color:#31524f;\">芯片、药、卫星、AI、能源、量子。六个方向，基本就是临港这几年在押的注。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">2026顶科奖一共11位得主。生命科学或医学奖的4人里，3位是华人，邵峰成了这个奖创办以来首位中国籍获奖者。今年新设的青年科学家奖，6位得主里5位是华人，每人奖金100万。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">明天11月1日闭幕，主题是“顶科论坛十周年，再出发”。</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#16615f;line-height:1.7;margin:30px 0;letter-spacing:1px;\">这场会不对外卖票，但它跟每个住在临港的人都有关系。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">论坛从2018年落地上海，永久会址就在滴水湖边。科学家来开会，顺手看的是这座城能不能留下人。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 02 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">同一时间，湖边还有两场“跑”</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">今天在滴水湖，还有第三届残健融合轮椅跑，名字叫“无以‘轮’比·共驰人生”。前两届分别在郊野公园和上海国际旅游度假区办，今年轮到临港。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">另一场更大众。第三届滴水湖棒棒糖骑行，今天是最后一天。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">路线40公里，从滴水湖洲际酒店出发，绕环湖一路、二路、三路，把朵云书院、一尺花园、壹号码头、春花秋色公园、航海博物馆、天文馆串成一个“棒棒糖”。每天9点到18点，去酒店礼宾部领电子骑行手册、签协议就能出发。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">免费，但车自带，保险自己买。全程骑完、发一篇小红书，前300名有奖。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">四十公里不是闹着玩的。</strong>平时不骑车的人，别一口气硬上，骑到北岛折返，也能领一份秋天。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 03 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">你今天能进的三个地方</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/03-duoyun.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">朵云书院（滴水湖店）。图源：临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">会场进不去，湖边能玩的还是那些。周六人多，顺序排好，体验差很多。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">上海天文馆。</strong>9点半开馆，4点停止入馆，周一闭馆，成人30元。周六延时开放到晚上8点，但票得提前约，热门时段常常几天前就空了。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">中国航海博物馆。</strong>9点半到4点，3点半就不让进了。成人30元，同样周一闭馆。想看船、看航海史，这里比天文馆更“实”。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">环湖草坪。</strong>不要钱。帐篷一支，风筝一放，一下午就过去了。别搭在步道和亲水平台上，风大的时候，天幕记得压好。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">饿了往朵云书院、一尺花园、壹号码头走，书店加咖啡，坐着能看水。这几家大多十点后才开门，想吃热乎早饭，去地铁站和山兰路步行街。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 04 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">抄一张周六时间表</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">第一次来，照这个走就行：</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 30px;font-size:14px;color:#3b3b3b;\">\n<tr>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;width:88px;color:#16615f;font-weight:bold;\">08:00</td>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;line-height:1.7;\">到湖边，先走一段环湖绿带，8.5公里走不完就走到北岛折返</td>\n</tr>\n<tr>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;color:#16615f;font-weight:bold;\">09:30</td>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;line-height:1.7;\">进天文馆，或者航海博物馆，二选一</td>\n</tr>\n<tr>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;color:#16615f;font-weight:bold;\">12:00</td>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;line-height:1.7;\">湖边吃饭，十一点前落座，避开等位</td>\n</tr>\n<tr>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;color:#16615f;font-weight:bold;\">14:00</td>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;line-height:1.7;\">朵云书院翻书，或去草坪躺着</td>\n</tr>\n<tr>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;color:#16615f;font-weight:bold;\">16:30</td>\n<td style=\"padding:12px 8px;border-bottom:1px solid #e6e6e6;line-height:1.7;\">西岛看日落，湖边风大，外套穿上</td>\n</tr>\n</table>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 05 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">为什么都挤在滴水湖</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">一个湖，上午开科学家论坛，同时办轮椅跑和骑行，不是巧合。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">临港把自己定位成“年轻的城，年轻人的城”。口号背后是有账本的：临港科创城定了个目标，到2027年底，高新技术企业不少于2000家，导入创新创业人才4万人以上。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">论坛开幕前，秋季校招直接开进北大，近40家单位放出900多个岗位，覆盖集成电路、民用航空、智能汽车与高端装备。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">今年4月出的“超级个体”政策，给一人公司这类小创业主体最长3年办公场地免租，算力服务最高补贴80%。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">产业也接得住。上海集成电路产业规模2025年到了5800亿元，今年1到8月产值同比涨20%。浦东这条链子超过3000亿元，占全市七成、全国两成以上。</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#16615f;line-height:1.7;margin:30px 0;letter-spacing:1px;\">科学家来不来，看的不是风景，是这座城有没有下文。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">对普通人的意义也直接：岗位、学校、医院、周末能去哪。这些事，比一栋楼好不好看重要得多。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 06 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">出门前，记四件事</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">带外套。湖边的风，比市区大不止一点，中午热，傍晚凉。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">看好回程。滴水湖往龙阳路，末班车22点30分，今天人多，别卡着点走。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">票提前约。天文馆和航海博物馆都实名预约，周一两馆都闭馆。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">骑车买保险。棒棒糖骑行今天最后一天，玩得开心，也得玩得稳。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">今天你在滴水湖吗？</strong>拍到什么，评论区放一张，我看看今天湖边有多少人。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">这篇写的是白天。傍晚的滴水湖是另一副样子，灯光、人群、烟火气，留到下一篇说。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#a3a3a3;letter-spacing:2px;margin:40px 0 0;\">— 完 —</p>\n<p style=\"text-align:center;font-size:14px;color:#8a8a8a;line-height:1.9;margin:14px 0 30px;\">图源：临港新片区管委会<br>资料：上海发布、临港新片区管委会、顶科论坛、上海天文馆</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
