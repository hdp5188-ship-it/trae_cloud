<script id="post-data" type="application/json">
{
  "title": "秋天的滴水湖，最好早上七点去",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月1日 08:21",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">出16号线滴水湖站，还没看见湖，风先到了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">秋天的风从湖面上过来，有点凉，带着水汽。顺着指示牌走三百来米，路忽然让开，一大片灰蓝色的水铺在眼前，望不到边。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">那一刻，站口烤肠的油烟气、车厢里的短视频外放声，都被这阵风吹没了。</p>\n\n<p style=\"text-align:center;margin:28px 0 6px;\"><img src=\"assets/cycling-lakeside.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">滴水湖环湖步道上的骑行者。图：上观新闻</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">我去过几次，都是早上。湖边只有骑车的人、跑步的人，还有几个架着三脚架等日出的。九点往后，人才慢慢多起来。</p>\n\n<!-- 01 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">把早上留给这片湖</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">滴水湖在浦东最东边。从市区坐16号线，晃晃悠悠一个小时才到。所以很多人中午出发，下午两点多站在湖边，正赶上风最大、光最平的时候。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">早上七点到九点，是另外两个小时。太阳低，光斜着照进来，湖面有明暗；骑行道是空的，能听见自己的车链子响。</p>\n<p style=\"font-size:18px;line-height:1.85;font-weight:bold;color:#15527c;margin:0 0 18px;\">滴水湖的好，一半在景，一半在空。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">它其实不算精致。湖边没有密集的商业，没有排长队的网红店，有时候空旷得有点过分。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">也正因为空，你才走得动、坐得下、看得远。</p>\n\n<!-- 02 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">一圈8.3公里，怎么走都不亏</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">滴水湖是个正圆，湖面直径约2.5公里，沿湖一圈8.3公里。走路两小时出头，骑车半小时。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">16号线滴水湖站1号口出来就有租车点。扫一辆，沿骑行道走。环湖东一路那一段，从滴水湖站往东到临港大道，是我最喜欢的——一边是湖，一边是成片的花。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">骑行道和步道是分开的，不用跟跑步的人抢路。想慢一点，就沿湖走木栈道，走累了找张长椅坐下，看对岸的房子在水里晃。</p>\n\n<p style=\"background:#f4f8fb;border-left:3px solid #1b6ca8;padding:14px 18px;margin:0 0 22px;font-size:16px;line-height:1.85;color:#2c3e50;\">八公里多一点，说长不长，刚好够走完一圈，也刚好够把手机揣回兜里。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">如果有一整个上午，可以走“棒棒糖线”：40公里，从洲际酒店出发，绕湖一圈再往外延，串起朵云书院、一尺花园、壹号码头、春花秋色公园、中国航海博物馆、上海天文馆。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">十月底到十一月初，是这条路最好的时候。银杏、水杉、红枫一层层变色，芦苇也白了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">骑不动也没关系。这条线的好处是随时能停，随时能打车回地铁站。</p>\n\n<!-- 03 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">秋天那点粉，已经开了</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">十月中到十一月中，滴水湖最出片的不是湖，是粉黛乱子草。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">环湖景观带的C区，蓝色塑胶步道两侧种了好几片；F区西侧也有。花穗是淡淡的粉紫，一片连着一片，远看像地上起了一层雾。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">早上逆光去拍最好。太阳从花穗后面透过来，边缘是金边，中间是粉的，手机直出就很好看。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong>但粉黛很脆，踩一脚就倒一片。</strong>护栏外站着拍，一样出片。每年这个时候，花海被踩秃的新闻都不少，别做那个主角。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">再往南，环湖二路的星空之镜海绵公园，芦苇刚泛白。风一吹，整片穗子朝一个方向倒，声音很轻，沙沙的。</p>\n\n<!-- 04 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">湖边的几个门口，值得停一停</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">绕湖一圈，能走进去的地方不少。挑几个我自己还会再去的：</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong>上海天文馆。</strong>那个银灰色的球体，看多少次都觉得不像在地球上。门票要提前抢，公众号放票、绑定身份证；周一闭馆，别跑空。</p>\n\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/planetarium.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">临港的上海天文馆。图：上观新闻</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong>中国航海博物馆。</strong>外形就是一艘船。带孩子的话，里面的互动展项能耗掉半天。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong>壹号码头。</strong>湖边最适合发呆的地方。咖啡、书店、草坪都聚在这一圈，庆典广场的水滴雕塑也在附近。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong>朵云书院·滴水湖店。</strong>书店开在湖边，落地窗外就是水。买杯咖啡坐一会儿，比在市区排队舒服。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong>春花秋色公园·童趣花园。</strong>遛娃的记一下：27公顷，48亩四季花海，2500平方米儿童游乐区，还有2100平方米的粉色沙滩和泵道。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">不想骑车，可以坐那辆粉红色双层观光巴士。路线覆盖朵云书院、一号码头这些地标，车上有语音导览，适合第一次来的人。</p>\n\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/sightseeing-bus.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">滴水湖的粉红双层观光巴士。图：上观新闻</p>\n\n<!-- 05 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;05&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">去之前，记下这几件事</p>\n\n<p style=\"background:#f5f8fa;border-left:3px solid #1b6ca8;padding:16px 18px;margin:0 0 24px;font-size:14px;line-height:2;color:#3d4a52;\">交通：地铁16号线终点站滴水湖，1号口出站；自驾可停滴水湖地下停车场。<br>环湖：一圈8.3公里，步行约2小时，骑行约30分钟。<br>烟花：每周六晚20:00，庆典广场一带视野最好，免费、免预约，建议提前半小时到。<br>门票：天文馆要提前预约，周一闭馆；其他场馆出发前也查一眼开放时间。<br>装备：湖边风大，体感比市区低两三度，早上带件外套；这一段商业不多，水和吃的自己带一点。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">周六晚上八点，湖上放烟花，配无人机表演，不要钱、不用抢票。很多人不知道，这已经是滴水湖的固定节目。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">看完再坐16号线回去，到家可能十一点多。累是累，但值得。</p>\n\n<!-- 结语 -->\n<p style=\"text-align:center;font-size:16px;color:#1b6ca8;letter-spacing:6px;margin:46px 0 18px;\">·&nbsp;&nbsp;·&nbsp;&nbsp;·</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">上海有很多值得赶早的地方，滴水湖算一个。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">它不像外滩那么有名，也不像武康路那么好拍。它就是一大片水，安安静静地放在城市的东边。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">一个城市能留出这么一块空的地方，挺难得的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">你去滴水湖，最喜欢哪一段？是东岸的花，还是一号码头的风？留言告诉我，下次我照着你的路线走一遍。</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
