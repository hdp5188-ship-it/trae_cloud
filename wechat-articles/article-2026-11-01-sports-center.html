<script id="post-data" type="application/json">
{
  "title": "滴水湖运动中心一期开工，临港人的运动自由要来了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月1日 13:22",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">临港人等运动场地，等了挺久。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">好消息是，滴水湖运动中心一期，9月底已经正式开工了。规划许可证、设计方案、开工放样，一套流程走完，地已经动了。</p>\n\n<p style=\"text-align:center;margin:28px 0 6px;\"><img src=\"assets/sports-center-plan.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">滴水湖运动中心一期设计方案总平面图。图：临港新片区管委会公示</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">这块地不算小，66900多平方米，放在环湖北三路南边，乔柏路和香柏路之间，挨着春涟河。以后从滴水湖地铁站过去，骑车十来分钟。</p>\n\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/runners-glory-ring.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">滴水湖迎新跑，跑者经过荣耀之环。图：上观新闻</p>\n\n<!-- 01 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">先弄清楚，这是个什么项目</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">名字叫滴水湖运动中心（一期工程），建设单位是临港新片区生态环境绿化市容事务中心。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">注意一点：它的用地性质是<strong>公共绿地</strong>。所以你不会在这里看到一个巨大的室内体育馆。按照绿化部门的要求，建筑物占地不能超过总面积的2%。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">换句话说，这是一个<strong>长在公园里的运动场</strong>。草地、球场、步道，是它的主角。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">临港一直不缺空地，缺的是能让人真正动起来的配套。环湖8公里的步道很美，但如果你想踢一场球、打一场篮球，以前得开车去找地方。</p>\n<p style=\"font-size:18px;line-height:1.85;font-weight:bold;color:#15527c;margin:0 0 18px;\">这一次，球场直接建在湖边了。</p>\n\n<!-- 02 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">能玩什么，给你数清楚</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">根据已公示的设计方案，一期的场地配置是这样的：</p>\n\n<p style=\"background:#f4f8fb;border-left:3px solid #1b6ca8;padding:16px 18px;margin:0 0 22px;font-size:16px;line-height:2;color:#2c3e50;\">\n<strong>足球：</strong>1片11人制 + 3片7人制 + 1片5人制训练场<br>\n<strong>球类：</strong>多块篮球场、网球场、匹克球场<br>\n<strong>配套：</strong>能量站、运动驿站（公共服务设施）\n</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">5块足球场，这个配置在上海的社区级运动中心里不算小。11人制的场子可以踢正式比赛，7人制和5人制的对业余球队更友好——人好凑，节奏快。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">匹克球单独列出来，算是跟上了这两年的潮流。这块场子比网球小、比羽毛球大，上手快，中年人特别多。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">公示期间有居民提意见，说希望减少足球场、增加室内场馆。管委会的回复很明确：用地是绿地性质，没有增设室内场馆的空间。方案里已经配了能量站和运动驿站，更衣室、厕所、补给这些基本需求会覆盖到。</p>\n\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/runners-action.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">滴水湖迎新跑现场。图：上观新闻</p>\n\n<!-- 03 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">它不是一个孤立的场子</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">滴水湖运动中心一期，是临港更大一盘棋里的一块。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">旁边的\"超级运动汇\"综合体，2027年秋天就要开业。这个项目总建筑面积12.4万平方米，由1.1万根钢构架拼成，核心亮点是<strong>全国首家360°全透明室内深潜馆</strong>——24米深，地上三层地下两层，未来能隔着玻璃看人潜水。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">官方用\"一体两翼\"来形容这个布局：超级运动汇是主体，滴水湖运动中心和星空之境海绵公园是两翼，室内外打通，下雨天也能玩。</p>\n\n<p style=\"background:#f4f8fb;border-left:3px solid #1b6ca8;padding:14px 18px;margin:0 0 22px;font-size:15px;line-height:1.85;color:#2c3e50;\">简单说就是：想踢足球、打篮球，去运动中心；想潜水、攀岩、玩极限，去超级运动汇；想跑步、骑行、遛娃，环湖景观带和海绵公园免费敞开。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">久事体育、咪咕体育、安踏、蓝时潜水这些品牌已经签了合作。临港这盘\"运动+商业\"的棋，下得不小。</p>\n\n<!-- 04 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">什么时候能用得上</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">捋一下时间线：</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong>2026年5月</strong>，设计方案公示，收集居民意见。<br>\n<strong>2026年7月</strong>，建设工程设计方案批复。<br>\n<strong>2026年9月</strong>，规划许可证下发，9月28日通过开工放样复验，正式动工。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">目前官方还没公布一期的竣工日期。参考临港同类项目的节奏，室外球场加配套，一般一年到一年半能交付。乐观估计，2027年底到2028年初，这片场子大概率能开门。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">到时候，超级运动汇也差不多开业了。室内深潜、室外足球，同一天都能安排上。</p>\n\n<!-- 05 -->\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1b6ca8;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;05&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#222;margin:10px 0 24px;\">实用信息卡</p>\n\n<p style=\"background:#f5f8fa;border-left:3px solid #1b6ca8;padding:16px 18px;margin:0 0 24px;font-size:14px;line-height:2;color:#3d4a52;\">\n项目：滴水湖运动中心（一期工程）<br>\n位置：南汇新城镇，乔柏路以东、春涟河以北、香柏路以西、环湖北三路以南<br>\n用地：约66910平方米，公共绿地属性<br>\n业态：1片11人制+3片7人制+1片5人制足球场，篮球、网球、匹克球场，能量站、运动驿站<br>\n进度：2026年9月已开工，预计2027—2028年交付（以官方公告为准）<br>\n联动：超级运动汇（2027秋开业，含全国首家360°全透明深潜馆）\n</p>\n\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/cycling-lakeside.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">滴水湖环湖骑行道。图：上观新闻</p>\n\n<!-- 结语 -->\n<p style=\"text-align:center;font-size:16px;color:#1b6ca8;letter-spacing:6px;margin:46px 0 18px;\">·&nbsp;&nbsp;·&nbsp;&nbsp;·</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">临港这两年变了不少。从天文体馆到航海博物馆，从环湖步道到现在的运动中心，城市的骨架一点点长出来了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">一个地方留不留得住人，有时候不看写字楼有多高，看的是下班以后有没有地方跑一跑、出一身汗。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">滴水湖边的这片球场，建好以后，欢迎来踢一场。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">你最期待这里多一个什么场地？评论区聊聊。</p>\n"
}

  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
