<script id="post-data" type="application/json">
{
  "title": "早安，临港：周一的地铁，已经坐满了",
  "account": "滴水湖笔记",
  "account_sub": "",
  "author": "滴水湖笔记",
  "date": "2026年11月2日 07:30",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">周一，六点四十。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">闹钟响到第三遍，天还是灰的。窗帘缝里透进来一点光，落在拖鞋上。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">你在临港。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 24px;letter-spacing:0.5px;\">这个点，小区门口的早餐车已经支好了。蒸笼盖一掀，白气冲到路灯下面，慢慢散开。</p>\n\n<p style=\"margin:26px 0 0;text-align:center;\"><img src=\"assets/dishui-metro.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#98a2a8;text-align:center;margin:10px 0 32px;line-height:1.7;\">清晨的滴水湖站，出站就是湖　图源：临港新片区管委会</p>\n\n<p style=\"text-align:center;font-size:14px;letter-spacing:6px;color:#b56a45;margin:50px 0 0;\">— 01 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#243038;margin:10px 0 28px;line-height:1.5;letter-spacing:1px;\">周一的地铁，从来不空</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">七点一过，16号线开始上人。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">背包的、拎电脑的、手里还攥着半个包子的。有人站着补觉，头一点一点，到站前又能准时醒。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">这条线开进临港的时候，窗外会先出现芦苇，再出现湖。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">很多人就是在这个瞬间抬头的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">明明要去上班，却先看见一片水。</p>\n\n<p style=\"font-size:21px;font-weight:bold;color:#a9613c;text-align:center;margin:34px 0 36px;letter-spacing:2px;line-height:1.8;\">临港的周一，是从湖开始的。</p>\n\n<p style=\"text-align:center;font-size:14px;letter-spacing:6px;color:#b56a45;margin:50px 0 0;\">— 02 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#243038;margin:10px 0 28px;line-height:1.5;letter-spacing:1px;\">有人赶时间，有人已经在生活</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">出站往湖边走两分钟，会看到另一拨人。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">跑完一圈的，正在拉伸；骑车的，把车停在栏杆边，摘头盔；还有几位钓鱼的，马扎一支，一坐就是一上午。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">他们不打卡。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">但你能感觉到，这座城不是只有写字楼和工地。有人在赶路，也有人在过日子。</p>\n\n<p style=\"margin:26px 0 0;text-align:center;\"><img src=\"assets/huanhu-greenway.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#98a2a8;text-align:center;margin:10px 0 32px;line-height:1.7;\">环湖景观带，湖岸、步道与草地　图源：临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">环湖一圈8.3公里。跑得快的人四十几分钟，慢一点一个多小时。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">这个距离刚刚好。够出一身汗，又不耽误九点的会。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">所以这里的健身房，很多时候就是这条湖岸线。</p>\n\n<p style=\"text-align:center;font-size:14px;letter-spacing:6px;color:#b56a45;margin:50px 0 0;\">— 03 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#243038;margin:10px 0 28px;line-height:1.5;letter-spacing:1px;\">你上班的时候，这座城也在上班</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">北岸往东北，有一块地一直围着围挡。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">那是滴水湖运动中心，一期工程。6.7万平方米，差不多9个标准足球场。今年9月，规划许可证公开，现场也开工了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">以后楼下就能踢球、打球，不用再往市区跑。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">再远一点，南汇支线今年8月全线结构贯通。34.86公里，6座车站，一路到滴水湖北站。按市里8月发布会上的说法，明年7月建成通车。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">到那时候，从浦东机场来临港，不用再绕。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">你每天走的这条路，正在一点点变短。</p>\n\n<p style=\"margin:26px 0 0;text-align:center;\"><img src=\"assets/dishui-lake-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#98a2a8;text-align:center;margin:10px 0 32px;line-height:1.7;\">滴水湖与临港天际线　图源：临港新片区管委会</p>\n\n<p style=\"text-align:center;font-size:14px;letter-spacing:6px;color:#b56a45;margin:50px 0 0;\">— 04 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#243038;margin:10px 0 28px;line-height:1.5;letter-spacing:1px;\">给周一的你，三句闲话</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">第一句，外套带上。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">十一月的临港，早晚和中午不是一个季节，湖上的风说来就来。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">第二句，别卡着点出门。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">周一的电梯、周一的路口、周一的电梯口，都比平时慢半拍。早十分钟，能少生一肚子气。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">第三句，中午去湖边站一会儿。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">不用跑，不用拍照，就站两分钟。风把头发吹乱，再回去改 PPT，心情会不太一样。</p>\n\n<p style=\"background:#faf4ef;border-left:4px solid #b56a45;padding:20px 22px;margin:36px 0 30px;font-size:15px;line-height:1.95;color:#4a4038;letter-spacing:0.3px;\"><strong style=\"font-size:16px;color:#a9613c;letter-spacing:1px;\">今天的小提醒</strong><br><br>早上湖区风大，骑车记得带件防风外套。<br>地铁站到湖边走两分钟就到，不用绕远。<br>如果今天实在很忙，至少在下班路上，抬头看一眼湖。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">周一总归是周一。会多，消息多，待办列表拉不到底。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">但临港有个好处——再忙，走几步就能看见水。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">水面很平，风很直，天很大。你那些烦心事，放在这个尺度里，会小一点。</p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#a9613c;text-align:center;margin:38px 0 30px;letter-spacing:2px;line-height:1.9;\">周一早上好。<br>愿你今天开会顺利，午饭不排队，<br>下班还能赶上湖边的落日。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#5b6368;margin:0 0 20px;letter-spacing:0.5px;\">留言说说：你今天几点出门的？路上有没有看到什么有意思的事。说不定下一次，就写进这里。</p>\n"
}

  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
