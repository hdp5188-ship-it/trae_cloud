<script id="post-data" type="application/json">
{
  "title": "早上六点半，滴水湖已经跑起来了",
  "account": "滴水湖笔记",
  "account_sub": "",
  "author": "滴水湖笔记",
  "date": "2026年11月2日 07:30",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">六点二十，16号线滴水湖站。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">出站不用找路。扶梯往上一升，湖就在眼前。天还没亮透，湖面是那种发灰的蓝。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">站前广场上已经有人在拉伸。穿压缩裤的，戴头灯的，还有把自行车从电梯里推出来的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 24px;letter-spacing:0.5px;\">临港的早晨，从这一刻开始。</p>\n\n<p style=\"margin:26px 0 0;text-align:center;\"><img src=\"assets/dishui-metro.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#98a2a8;text-align:center;margin:10px 0 32px;line-height:1.7;\">滴水湖地铁站，出站就是环湖广场　图源：临港新片区管委会</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#1a6d8c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:4px;letter-spacing:1px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a2a33;margin:12px 0 26px;padding-bottom:10px;border-bottom:2px solid #e3edf1;line-height:1.5;letter-spacing:1px;\">一圈8.3公里，刚好够一顿早饭前的运动</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">滴水湖是个正圆，周长8.3公里。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">这个距离很妙。跑得快的四十几分钟，慢一点一个多小时。跑完回小区冲个澡，八点半照样坐在工位上。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">所以临港跑步的人，不太去健身房。</p>\n\n<p style=\"font-size:22px;font-weight:bold;color:#1a6d8c;text-align:center;margin:34px 0 36px;letter-spacing:3px;\">湖，就是健身房。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">环湖景观带贴着岸线铺开，最宽的地方有60到80米。里面藏着好几条道：靠水的木板步道，红色沥青的漫步道，还有一条蓝色的塑胶跑道。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\"><strong style=\"color:#1a6d8c;\">想跑得舒服，认准蓝色那条。</strong></p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">第一次来容易跑错方向，跟着人走就行。早上六点多，大部分人是逆时针，从西岸往北岸。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">为什么逆时针？东岸风大。这事地图上看不出来，跑一次就懂。先把背风的西岸、北岸跑完，把风口留在最后。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">十一月的早上，六点半左右天刚亮，湖面上浮着一层薄雾。太阳从东边水面顶出来的时候，整条跑道会变成金色，差不多只有十分钟。</p>\n\n<p style=\"margin:26px 0 0;text-align:center;\"><img src=\"assets/huanhu-greenway.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#98a2a8;text-align:center;margin:10px 0 32px;line-height:1.7;\">环湖景观带，步道、跑道与湖岸相连　图源：临港新片区管委会</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#1a6d8c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:4px;letter-spacing:1px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a2a33;margin:12px 0 26px;padding-bottom:10px;border-bottom:2px solid #e3edf1;line-height:1.5;letter-spacing:1px;\">七座桥，一百件雕塑，和三个岛</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">跑不动的时候，给自己找点事做。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">环湖一圈有七座景观桥，一座一个造型。有人专门数着跑，数到第七座，一圈也就差不多了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">过了桥是三个岛，南岛、北岛、西岛。北岛夏天有水上项目，这个点还没开门，岸边只有几个钓鱼的，桶里空着，人也不急。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">再往西，是中国名家主题雕塑园。一百件雕塑散在草坪上，没有围栏，也不收票。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">我更喜欢早上看它们。光斜着打过来，铜的不反光，石头的影子拉得很长，一直拖到跑道上。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\"><strong style=\"color:#c2653a;\">这个时间，雕塑比人多。</strong></p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#1a6d8c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:4px;letter-spacing:1px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a2a33;margin:12px 0 26px;padding-bottom:10px;border-bottom:2px solid #e3edf1;line-height:1.5;letter-spacing:1px;\">湖边那块工地，要建9个足球场</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">沿北岸往东北走，最近有块地一直围着围挡，里面在动土。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">那是滴水湖运动中心，一期工程。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">总用地6.7万平方米，差不多9个标准足球场。今年9月，规划许可证公开，现场开工放样也做完了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">里面到底有什么，看总平面图最清楚：</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:6px 0 26px;\">\n<tr>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#1a6d8c;font-weight:bold;width:45%;line-height:1.6;\">11人制足球训练场</td>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#4a5257;line-height:1.6;\">天然草，一片</td>\n</tr>\n<tr>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#1a6d8c;font-weight:bold;line-height:1.6;\">7人制足球训练场</td>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#4a5257;line-height:1.6;\">硬质，两片</td>\n</tr>\n<tr>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#1a6d8c;font-weight:bold;line-height:1.6;\">5人制足球比赛场</td>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#4a5257;line-height:1.6;\">硬质，一片</td>\n</tr>\n<tr>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#1a6d8c;font-weight:bold;line-height:1.6;\">篮球场 / 网球场 / 匹克球场</td>\n<td style=\"padding:11px 12px;border-bottom:1px solid #e3edf1;font-size:14px;color:#4a5257;line-height:1.6;\">硬质场地</td>\n</tr>\n<tr>\n<td style=\"padding:11px 12px;font-size:14px;color:#1a6d8c;font-weight:bold;line-height:1.6;\">运动驿站 / 能量站</td>\n<td style=\"padding:11px 12px;font-size:14px;color:#4a5257;line-height:1.6;\">两栋配套小建筑</td>\n</tr>\n</table>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">全是室外场地。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">公示期间有人提过，为什么不建个室内馆，下雨也能打。官方的回复很直接：这块地的规划性质是公共绿地，按绿化部门的要求，建筑物的占地面积不能超过用地总面积的2%。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1a2a33;text-align:center;margin:30px 0 32px;letter-spacing:1px;line-height:1.7;\">2%，装不下一个体育馆。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">所以它注定是那种晴天来、有风来、晒着太阳来的地方。跟滴水湖本身一个脾气。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">位置在环湖北三路、乔柏路、春涟河、香柏路中间。住得近的人，下楼走十分钟就到。</p>\n\n<p style=\"margin:26px 0 0;text-align:center;\"><img src=\"assets/dishui-lake-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#98a2a8;text-align:center;margin:10px 0 32px;line-height:1.7;\">滴水湖与临港天际线　图源：临港新片区管委会</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#1a6d8c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:4px;letter-spacing:1px;\">04</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a2a33;margin:12px 0 26px;padding-bottom:10px;border-bottom:2px solid #e3edf1;line-height:1.5;letter-spacing:1px;\">明年七月，可以坐市域线来</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">现在来临港，主要靠16号线，从龙阳路一路往东南，坐到头。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">早班车上人不多，通常能抢到座位。窗外从高楼变成芦苇，再变成湖。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">更大的变化在路上。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">南汇支线今年8月实现全线结构贯通。全线34.86公里，6座车站，从浦东T3航站楼引出，一路到滴水湖北站。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">按市里8月发布会上的说法，明年7月建成通车。到时候从浦东机场过来，不用再绕一大圈。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">还有一条路在铺。滴水湖青创湾的10公里滨河慢行系统正在贯通，官方给的目标是打造临港“最美骑行道”。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">能骑车的地方，一年比一年长。</p>\n\n<p style=\"background:#f2f8fa;border-left:4px solid #1a6d8c;padding:18px 20px;margin:34px 0 30px;font-size:14px;line-height:1.95;color:#3c4449;letter-spacing:0.3px;\"><strong style=\"font-size:16px;color:#1a6d8c;letter-spacing:1px;\">给明早想来的你</strong><br><br><strong>怎么到</strong>　16号线滴水湖站，出站即是环湖广场。想直接开跑，别在站里绕，往湖边走。<br><strong>骑什么</strong>　站边有共享单车和租车点。租车点开门晚，赶早不如自己带车。<br><strong>怎么跑</strong>　逆时针，西岸—北岸—东岸。东岸风大，留到最后再扛。<br><strong>几点来</strong>　夏天五点半就有人，冬天六点半。日出前后那二十分钟，湖面最好看。<br><strong>带什么</strong>　水。湖边自动售货机不多，北岸的洗手间集中在驿站附近。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:34px 0 20px;letter-spacing:0.5px;\">我刚搬来临港那年，也觉得这里太远。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">后来发现，远有远的好处。早上六点半的湖，没有人跟你抢位置。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2f3437;margin:0 0 20px;letter-spacing:0.5px;\">跑完一圈，坐在台阶上喘气，看太阳从东边水面升起来。就那一小段时间，整个湖像是你自己的。</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#1a2a33;text-align:center;margin:36px 0 30px;letter-spacing:2px;line-height:1.8;\">明天早上，你几点起？</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#5b6368;margin:0 0 20px;letter-spacing:0.5px;\">留言聊聊你在滴水湖跑过最舒服的一次，或者你常去的那家早餐店。下一篇，写你推荐的地方。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">滴水湖笔记</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || '滴水湖笔记';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
