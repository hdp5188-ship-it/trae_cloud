<script id="post-data" type="application/json">
{
  "title": "六点二十，滴水湖先醒了",
  "account": "滴水湖观察",
  "account_sub": "",
  "author": "滴水湖观察",
  "date": "2026年11月3日 08:20",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:12px;color:#b08a5e;letter-spacing:3px;margin:0 0 10px;\">摘&nbsp;要</p>\n<p style=\"font-size:14px;color:#7a7a7a;line-height:1.9;margin:0 0 16px;letter-spacing:0.4px;\">上海最东边的这个湖，天亮得比市区早一点。首班地铁赶不上日出，环湖一圈刚好8公里。一份清晨版滴水湖攻略，外加湖边三件新事。</p>\n<p style=\"border-top:1px solid #ececec;margin:0 0 28px;font-size:0;line-height:0;\">&nbsp;</p>\n\n<p style=\"font-size:23px;font-weight:bold;color:#1a1a1a;line-height:1.65;margin:6px 0 24px;letter-spacing:1px;\">六点二十，滴水湖的天先亮了。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">湖面还压着一层灰蓝，东边那条线已经开始泛红。先是浅浅的橘，再是整片烧起来。太阳露头，也就两三分钟的事。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">第一次去是个十一月的早上。市区出门时天还黑着，到湖边，跑道上已经有人在跑。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">风很大。临港的风一年四季都像在赶路，清晨尤其明显。站在西岸往东看，对岸的楼还没完全醒，水面先把天光接住了。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/dishui-sunrise.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#8a8a8a;margin:10px 0 30px;letter-spacing:0.3px;\">滴水湖日出。邓涵月 摄（央广网发）</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">那天沿着湖走了小半圈，遇到的跑者比想象中多。有人戴耳机，有人边跑边打电话。城市还没正式上班，湖这边已经热闹过一轮了。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#c1662f;letter-spacing:2px;margin:56px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:8px 0 28px;letter-spacing:1px;\">地铁，赶不上日出</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">先说交通，不然容易白跑一趟。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">16号线从龙阳路一路往东，终点滴水湖，全程一小时左右。首班车到滴水湖站是6点47分，往市区方向的首班，6点00分发车。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\"><strong style=\"color:#c1662f;\">太阳不等人。</strong>十一月的上海，六点十几分天就透了。等你从地铁站出来、走到水边，最好的那一段已经过去。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">所以真想看日出，要么自驾，要么前一晚就住在湖边。这两条，比定五个闹钟都管用。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">自驾从市区过来，走S2，或者外环转两港大道，路顺的时候一小时出头。湖边早上车位很空，七八点以后才开始紧张。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">如果只是来逛、不追日出，地铁还是最省心的。出站就是站前广场，抬头能看见湖，走到水边用不了十分钟。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/dishui-metro.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#8a8a8a;margin:10px 0 30px;letter-spacing:0.3px;\">滴水湖地铁站，出站就是湖。临港新片区管委会供图</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">今年3月，滴水湖公交枢纽改造完成。白色顶棚做成白玉兰的弧线，成了湖边一个新门面。早上从这里过，能看到不少背着包往湖边去的人。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#c1662f;letter-spacing:2px;margin:56px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:8px 0 28px;letter-spacing:1px;\">一圈8公里，风比人多</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">滴水湖是人工挖出来的，圆得很规整。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">环湖景观带一圈8公里，滨湖步道、漫步道、跑步道三条路贴着水走。想跑个完整的圈，配速六分半，差不多一小时。</p>\n\n<p style=\"font-size:0;text-align:center;margin:8px 0 30px;\">\n<span style=\"display:inline-block;width:31%;vertical-align:top;background:#f6f2ec;border-radius:6px;padding:18px 4px;margin:0 1%;\"><span style=\"display:block;font-size:28px;font-weight:bold;color:#c1662f;line-height:1.1;\">8</span><span style=\"display:block;font-size:12px;color:#7d7d7d;margin-top:8px;letter-spacing:1px;\">公里&nbsp;环湖一圈</span></span>\n<span style=\"display:inline-block;width:31%;vertical-align:top;background:#f6f2ec;border-radius:6px;padding:18px 4px;margin:0 1%;\"><span style=\"display:block;font-size:28px;font-weight:bold;color:#1a6b6b;line-height:1.1;\">12</span><span style=\"display:block;font-size:12px;color:#7d7d7d;margin-top:8px;letter-spacing:1px;\">公里&nbsp;骑行绕行</span></span>\n<span style=\"display:inline-block;width:31%;vertical-align:top;background:#f6f2ec;border-radius:6px;padding:18px 4px;margin:0 1%;\"><span style=\"display:block;font-size:28px;font-weight:bold;color:#1a1a1a;line-height:1.1;\">6:47</span><span style=\"display:block;font-size:12px;color:#7d7d7d;margin-top:8px;letter-spacing:1px;\">首班车到站</span></span>\n</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">骑车可以走环湖路，跟着路标逆时针绕，连绕带拐大约12公里。图灵广场、七座桥、一号码头、北岛、南岛，一路都是能停下来的点。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">我更喜欢半圈。从西岸一号码头出发，往北骑到北岛折返，四公里出头，不赶时间，刚好够看完日出再吃个早饭。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">有句话得提醒：湖边风大，早上体感比市区低两三度。十一月来，外套别省。</p>\n\n<p style=\"background:#f5f1ea;border-left:4px solid #c1662f;padding:18px 20px;font-size:15px;color:#5a4a3d;line-height:1.85;margin:28px 0;letter-spacing:0.4px;\">七点前的环湖路，基本只属于跑步的人、遛狗的人和扫地车。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#c1662f;letter-spacing:2px;margin:56px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:8px 0 28px;letter-spacing:1px;\">九点半以后，湖边换一批人</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">太阳升起来，湖边的节奏也换了。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">上海天文馆9点30分开馆，周一闭馆。航海博物馆也是9点30分，15点30分停止入馆，周一同样闭馆。这两家都在临港大道一带，从天亮到开门这段时间，正好留给环湖。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">再晚一点，可以去朵云书院·滴水湖店。它在港城广场文化艺术中心5到7楼，10点开门，落地窗正对湖面。低头看书，抬头看湖，这句不是宣传语，是真的。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/dishui-aerial.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#8a8a8a;margin:10px 0 30px;letter-spacing:0.3px;\">滴水湖西岛与中银金融中心。临港新片区管委会供图</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">早饭不用太讲究。地铁站周边和港城广场一带，便利店、咖啡店开门都早。买个饭团坐在湖边吃，比在店里排队舒服。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#c1662f;letter-spacing:2px;margin:56px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:8px 0 28px;letter-spacing:1px;\">这座城，还在长</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">滴水湖不是那种建好就定型的景区。它一直在变。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">今年1月，西岛上的中银金融中心竣工。两栋双子塔楼连成一体，28.25万平方米，是目前临港最高的建筑。早上从西岸望过去，塔楼先接住阳光，湖面才慢慢亮。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">9月，滴水湖运动中心一期开工，位置在环湖北三路一带，以户外运动场地为主。以后早上想踢球、想找块正经场地活动，不必只绕着湖跑。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">这些变化，住在临港的人感受最直接。前几年大家来滴水湖，多是拍张照就走。现在周末的湖边，更多人愿意住一晚、吃两顿、慢慢逛。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1a1a1a;text-align:center;line-height:1.7;margin:36px 0 18px;letter-spacing:1px;\">一个上午，刚好够看完这座城醒来的样子。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 22px;letter-spacing:0.4px;\">如果你也起得早，挑个晴天来一趟。六点二十到西岸，看天亮；七点绕湖走半圈；九点半进天文馆，或者去书店坐一会儿。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3a3a3a;margin:0 0 10px;letter-spacing:0.4px;\">你去过滴水湖看日出吗？几点起的？评论区聊聊。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#a3a3a3;letter-spacing:4px;margin:44px 0 0;\">—&nbsp;完&nbsp;—</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
