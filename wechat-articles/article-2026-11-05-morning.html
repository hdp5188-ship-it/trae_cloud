<script id="post-data" type="application/json">
{
  "title": "上海秋天最舒服的40公里，藏在滴水湖",
  "account": "滴水湖小记",
  "account_sub": "",
  "author": "滴水湖小记",
  "date": "2026年11月5日 08:15",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;color:#8a6a45;letter-spacing:2px;margin:0 0 14px;text-align:left;\">临港 · 滴水湖</p>\n<p style=\"font-size:14px;color:#6b7570;line-height:1.9;background:#f3f6f3;border-left:4px solid #1f5c4d;padding:14px 16px;margin:0 0 30px;text-align:left;\">16号线中午加开直达车，34分钟到湖边。40公里环湖骑行线，串起银杏、芦苇、书店和天文馆。这个秋天，去滴水湖骑一圈。</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\"><img src=\"assets/dishui-lake-cycling.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;color:#9aa39f;text-align:center;margin:0 0 30px;line-height:1.6;\">滴水湖环湖绿道与上海天文馆。图源：上观新闻·乐游上海（2026年11月）</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">十一月的滴水湖，风先于叶子变了。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">湖岸的银杏刚开始黄，芦苇已经白了一片。骑车的人从身边过去，车铃响一下，声音很快被风带走。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">这个月初，上海市文旅局把一条40公里的环湖骑行线推了出来。起点在洲际酒店，绕湖一圈，路线在地图上像一根棒棒糖。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 30px;text-align:left;\">另一条消息，对上班族更友好——<strong style=\"color:#1f5c4d;\">9月28日起，16号线工作日中午加开直达车，12:30从龙阳路出发，34分钟到滴水湖。</strong></p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#1f5c4d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1f5c4d;margin:14px 0 22px;border-bottom:2px solid #1f5c4d;padding-bottom:9px;text-align:left;line-height:1.5;\">12:30这班车，值得专门等</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">以前去临港，最劝退的是路。从市区坐16号线，普通车一站一站停，到滴水湖常常要一个多小时。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">直达车中途不停，全程约34分钟。这次新增的班次，<strong>双向都在12:30发车</strong>，正好卡在午休。</p>\n<p style=\"font-size:15px;color:#3f4a46;line-height:2;background:#f3f6f3;border-left:4px solid #1f5c4d;padding:14px 16px;margin:0 0 18px;text-align:left;\"><strong style=\"color:#1f5c4d;\">16号线直达车时刻</strong><br>龙阳路 → 滴水湖　07:30 / 07:45 / 12:30<br>滴水湖 → 龙阳路　12:30 / 17:20 / 18:00<br><span style=\"font-size:13px;color:#7a8580;\">仅工作日开行，周末及节假日以车站公告为准</span></p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">也就是说，请半天假，或者干脆中午出发，下午一点多就能站在湖边。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 30px;text-align:left;\">回程也不用慌。17:20和18:00各有一班直达车回龙阳路，骑完一圈，刚好赶上。</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#1f5c4d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1f5c4d;margin:14px 0 22px;border-bottom:2px solid #1f5c4d;padding-bottom:9px;text-align:left;line-height:1.5;\">40公里“棒棒糖”，顺时针骑</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">官方给的路线是从洲际酒店出发，顺时针绕湖。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">先走环湖一路，经过一尺花园、壹号码头、朵云书院，再拐上海港大道，接着是环湖二路、春花秋色公园、星空之镜海绵公园、中国航海博物馆，最后从环湖三路回到上海天文馆、临港少年宫，经海事大学回到起点。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">三段路，气质完全不一样。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 12px;text-align:left;\"><strong style=\"color:#c07a3e;\">西岸是人文段。</strong>书店、咖啡、码头都挤在这一侧，停下来次数最多，速度最慢。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 12px;text-align:left;\"><strong style=\"color:#c07a3e;\">南岸是生态段。</strong>视野突然打开，芦苇连成片，风也大一个级别。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\"><strong style=\"color:#c07a3e;\">东岸是知识段。</strong>天文馆、航海博物馆、少年宫挨着排，带孩子来的话，这一段能拖很久。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">有个细节容易被忽略：路线里伸出去的那根“糖棍”——海港大道往上海海事大学的一段。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 30px;text-align:left;\">很多人骑到洲际酒店就收车，正好把这根棍子漏掉。那一段路直、开阔，车少，是整条线最像“出城”的地方。</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\"><img src=\"assets/dishui-lake-autumn.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;color:#9aa39f;text-align:center;margin:0 0 30px;line-height:1.6;\">秋日的滴水湖岸，芦苇已经泛白。图源：乐游上海（2025年11月）</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">40公里不算短。共享单车骑半圈就想放弃，最好提前备一辆变速车，或者到镇上租好再出发。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 30px;text-align:left;\">纯骑两个小时上下，加上停靠拍照，留足半天比较稳妥。十一月天黑得早，下午三点以后就别再往东岸深处走了。</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#1f5c4d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1f5c4d;margin:14px 0 22px;border-bottom:2px solid #1f5c4d;padding-bottom:9px;text-align:left;line-height:1.5;\">湖西这几个落脚点，别只是路过</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\"><strong>一尺花园（西岸店）</strong>在环湖西一路858号，1500平方米，书、绿植、咖啡混在一起，玻璃房像浮在码头上的一朵云。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">骑到这儿，别在一楼排队。上二楼，靠窗的位置能直接看湖。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\"><strong>壹号码头</strong>就在环湖西一路1号。半开放的阶梯一直落到水边，伞状混凝土撑起一片阴影，晴天湖面蓝得有点不像上海。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\"><strong>朵云书院</strong>在环湖西一路91号港城广场文化艺术中心F5。20米的通天书架顺着楼梯往上走，7万册书，落地窗外面就是滴水湖。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">这几处都在湖西，彼此不远。一个下午泡两处，剩下的路就得赶了——<strong style=\"color:#1f5c4d;\">取舍这件事，在滴水湖特别具体。</strong></p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 30px;text-align:left;\">再往北，是滴水湖金融湾。“荣耀之环”今年1月完成建设，一个圆环架在两栋塔楼之间，远远看像一个立起来的取景框。具体开放时间还没公布，路过拍张照不亏。</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\"><img src=\"assets/glory-ring.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;color:#9aa39f;text-align:center;margin:0 0 30px;line-height:1.6;\">滴水湖金融湾“荣耀之环”。图源：临港新片区管委会</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#1f5c4d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1f5c4d;margin:14px 0 22px;border-bottom:2px solid #1f5c4d;padding-bottom:9px;text-align:left;line-height:1.5;\">出发前，记住这几件小事</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 14px;text-align:left;\"><strong>风比市区大。</strong>湖边没有遮挡，十一月体感低两三度，防风外套比毛衣管用。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 14px;text-align:left;\"><strong>补给别硬扛。</strong>西岸的咖啡店密，南岸和东岸相对空，出发前在水边买好水和吃的。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 14px;text-align:left;\"><strong>工作日来。</strong>周末的湖西岸停车和热门店都要排队。12:30的直达车，工作日才有。</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 30px;text-align:left;\"><strong>别追日落。</strong>秋天下沉得快，四点多湖面就开始凉。把好看的留给下一次，才是能反复来的玩法。</p>\n\n<p style=\"font-size:22px;font-weight:bold;color:#1f2b28;line-height:1.7;text-align:center;margin:36px 0 10px;\">城市里最奢侈的，<br>不是湖，是绕湖一圈的时间。</p>\n<p style=\"font-size:15px;color:#6b7570;line-height:1.9;text-align:center;margin:0 0 34px;\">骑不完也没关系。滴水湖不会跑。</p>\n\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">你骑过滴水湖吗？西岸、南岸、东岸，哪一段最舒服？</p>\n<p style=\"font-size:16px;color:#333;line-height:1.9;margin:0 0 18px;text-align:left;\">留言说说。也把这篇转给那个总说“上海没地方去”的朋友。</p>\n<p style=\"font-size:13px;color:#9aa39f;line-height:1.8;margin:26px 0 0;text-align:left;\">资料来源：上海发布、上海市文化和旅游局、解放日报·上观新闻、临港新片区管委会</p>\n"
}

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
