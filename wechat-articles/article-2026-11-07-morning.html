<script id="post-data" type="application/json">
{
  "title": "六点半的滴水湖，比闹钟先醒",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月7日 08:11",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:26px 0 0;\"><img src=\"assets/hero.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:13px;color:#8c8c8c;margin:8px 0 26px;line-height:1.6;\">清晨的滴水湖水面，远处是西岛中银金融中心。临港管委会供图</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">六点二十，滴水湖的湖面还是平的。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">风从东海那边过来，带一点咸味，把环湖一路的旗子吹得啪啪响。十一月了，天亮得晚，湖东边刚泛出一点橘色。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">我从十六号线滴水湖站出来，扫了辆共享单车往东骑。五分钟，遇见今天第一批跑者。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">他们大多不发朋友圈。跑完，拉伸，去便利店买杯热豆浆，然后上班。</p>\n\n<p style=\"font-size:20px;line-height:1.7;color:#1b6f8a;font-weight:bold;margin:34px 0;text-align:center;letter-spacing:1px;\">上海人总说临港太远。<br>可住在这儿的人，早上是这么过的。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">搬来第三年，我最喜欢的不是新开的商场，是这一圈水。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1b6f8a;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b6f8a;margin:14px 0 22px;border-bottom:3px solid #1b6f8a;padding-bottom:9px;\">一圈8.3公里，临港最公平的一条路</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">滴水湖是个正圆。官方数据，湖岸周长约8.3公里，外面套着环湖一路、二路、三路三圈路。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">住在临港的人，多少都在这条路上走过。跑步的、骑车的、推婴儿车的、遛狗的，各走各的道，互不打扰。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">跑道和骑行道刷成两种颜色，一眼分得清。路面平，几乎没有红绿灯，也没有市区那种走走停停的憋屈。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\"><strong style=\"color:#c8552c;font-weight:bold;\">这条路的公平在于：不管你住哪个小区、开什么车，到了湖边，大家都得自己迈腿。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">还有个只有常来的人才知道的事——看日出，别站在西岸。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">太阳从东海方向升起来，湖东岸和往南汇嘴去的方向视野最好。西岸适合看傍晚，金融湾的玻璃楼会把落日反成一片金。</p>\n\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 8px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">环湖一圈</span>　约8.3公里。散步一个半小时到两小时，骑行三十到四十分钟。</p>\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 8px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">看日出</span>　湖东岸、南汇嘴方向。提前半小时到，带件防风外套。</p>\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 8px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">怎么到</span>　轨交16号线滴水湖站；自驾可停庆典广场、一号码头周边停车场。</p>\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 24px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">骑行进阶</span>　“棒棒糖线”全程约40公里，从滴水湖洲际酒店出发，顺时针绕湖再沿海港大道往返。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">七点前，环湖基本是空的。九点以后，亲子车队就上来了。想清静，得起早。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1b6f8a;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b6f8a;margin:14px 0 22px;border-bottom:3px solid #1b6f8a;padding-bottom:9px;\">一号码头，早上七点的临港</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">骑到一号码头，差不多七点。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">码头边一排长椅，有人拉伸，有人坐着发呆。白色的栈桥伸进湖里，几艘游船还系在岸边，没开工。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">再往湖面看，帆船俱乐部的船已经出去几条了。风不大，帆升得慢，远远看去像湖上停着几片白纸。</p>\n\n<p style=\"text-align:center;margin:26px 0 0;\"><img src=\"assets/dock.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:13px;color:#8c8c8c;margin:8px 0 26px;line-height:1.6;\">空中俯瞰滴水湖一号码头一带。临港管委会供图</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">很多人来滴水湖，拍完照就走。其实一号码头往北，有一段亲水步道，人少，栏杆低，能贴着水面走。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">早上逆光，湖面会亮成一片，手机直接拍就很好看。不用滤镜。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">我一般在这儿停十分钟，什么都不干。听水拍岸的声音，等身上那点汗凉下来。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\"><strong style=\"color:#c8552c;font-weight:bold;\">临港的早晨有个特点：楼是新的，水是静的，人是慢的。</strong></p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1b6f8a;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b6f8a;margin:14px 0 22px;border-bottom:3px solid #1b6f8a;padding-bottom:9px;\">两个新变化，正在改写滴水湖的早晨</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">这两年，湖还是那个湖，岸线却一直在变。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">第一个是荣耀之环。北岸金融湾，四栋楼托起一个巨大的圆环，直径153米，高50米，像一只落在楼顶的金色飞碟。</p>\n\n<p style=\"text-align:center;margin:26px 0 0;\"><img src=\"assets/glory-ring.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:13px;color:#8c8c8c;margin:8px 0 26px;line-height:1.6;\">建成后的荣耀之环，直径153米、高50米。临港管委会供图</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">今年年初，它已经完成建设。圆环内部是约5000平方米的环形观景空间，设计上可以360度俯瞰滴水湖，天气好还能望到东海。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">项目带着超89万平方米商业空间、7500多平方米市民文化场地，和2.8万多平方米公共开放区域。九月底那场光影节，它的灯光秀每晚七点准时亮起，湖对岸都看得见。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">登顶观景的具体开放安排，去之前最好查一下“上海临港”的公众号，别扑空。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">第二个变化，更像给早晨提速。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">市域铁路南汇支线，今年八月实现全线结构贯通，计划2027年7月建成通车。线路从浦东T3航站楼、上海东站一路向南，终点就是滴水湖北站。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">按公开的时空目标，临港主要节点到浦东枢纽约15分钟，到虹桥约60分钟。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">对住在这儿的人来说，这意味着以后赶早班机，不用五点半就出门。早上还能在湖边多跑二十分钟。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1b6f8a;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">04</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b6f8a;margin:14px 0 22px;border-bottom:3px solid #1b6f8a;padding-bottom:9px;\">第一次来，记住这几句就够了</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">如果你也想找个周末来试试，我把能想到的都写在这儿。</p>\n\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 8px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">时间</span>　六点半到七点半最好。太阳刚起，人少，光柔。</p>\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 8px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">穿什么</span>　湖边风比市区大两三档，十一月一定带防风外套，帽子压紧。</p>\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 8px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">怎么走</span>　地铁出来租共享单车，先东岸看日出，再沿湖骑到一号码头，最后去北岸金融湾看圆环。</p>\n<p style=\"background:#f4f8f9;padding:12px 16px;margin:0 0 24px;font-size:14px;line-height:1.75;color:#3a3a3a;border-left:3px solid #1b6f8a;\"><span style=\"color:#1b6f8a;font-weight:bold;\">别这样</span>　周末九点以后开车环湖，停车要绕很久；中午来，光硬、没遮挡，体验会打折。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">还有个小遗憾得说在前面：湖边早餐选择不算多，便利店和咖啡店能解决，想吃热乎的，得往港城新天地那边走。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">这不算缺点。一个新城还在长，很多东西没配齐，反而留出了空。</p>\n\n<p style=\"background:#fdf6f2;padding:18px 20px;margin:30px 0 26px;font-size:15px;line-height:1.85;color:#5a3a2c;border-radius:8px;\">我越来越觉得，判断一个地方值不值得住，不看它有多少网红店。看的是：周末早上，你愿不愿意为它早起。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">滴水湖给得起这个理由。</p>\n\n<p style=\"font-size:20px;line-height:1.7;color:#1b6f8a;font-weight:bold;margin:34px 0;text-align:center;letter-spacing:1px;\">你上一次在滴水湖看日出，<br>是什么时候？</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">评论区聊聊。也把这篇转给那个总说“临港太远”的朋友。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.5px;\">挑个晴天，六点半，湖边见。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
