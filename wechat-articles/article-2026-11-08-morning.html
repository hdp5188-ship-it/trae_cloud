{
  "title": "2700平米、100多家外企、会打乒乓的机器人：临港把一整条产业链搬进了进博会",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月8日 08:07",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">早上好。先说一件正在进行的事。</p>\n<p style=\"background:#f2f4f6;border-left:4px solid #0a84ff;padding:14px 16px;margin:0 0 22px;font-size:14px;line-height:1.9;color:#444;\"><strong>11月5日</strong>，第九届中国国际进口博览会在上海开幕。<br>地点：国家会展中心（上海）3H馆东部A1-01展位<br>看点：<strong>2700平方米</strong>的临港展示区，本届进博会最大的单一展厅<br>规模：<strong>100余家</strong>境外企业、<strong>150余件</strong>展品，来自近20个国家和地区<br>会期：11月5日—10日，还剩最后三天</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">对全国读者来说，进博会是个大新闻。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">对临港来说，这次是主场。</p>\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/lingang-hall.png\" style=\"max-width:100%;width:100%;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;line-height:1.6;margin:0 0 26px;\">11月5日，临港展示区正式亮相，这也是本届进博会最大的单一展厅（图源：上海市国资委）</p>\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">不摆展品了，把产业链搬来了</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">往年逛展，展台是\"一个企业一个格子\"，你摆你的，我摆我的。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">今年临港展示区换了思路：企业之间怎么配合、技术之间怎么衔接，直接排成一条看得见的产业链。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">最显眼的是特斯拉。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">它在临港展示区<strong style=\"color:#0a84ff;\">首度开设专属展区</strong>，把上海超级工厂的生产方式整个搬了进来。量产版Cybercab、Model Y高性能版、最新一代金色人形机器人，还有储能系统Megablock核心部件和家用储能Powerwall，一字排开。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">展台还搭了个以无人驾驶多用途车Robovan为造型的精品专区，人形机器人在里面模拟工厂作业、搬运行李，甚至\"外出遛狗\"。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">顺便说个数字：今年7月，特斯拉全球电动车累计产量突破<strong style=\"color:#0a84ff;\">1000万辆</strong>，上海超级工厂贡献了全球近一半的交付量。</p>\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/tesla-zone.png\" style=\"max-width:100%;width:100%;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;line-height:1.6;margin:0 0 26px;\">特斯拉在临港展示区首度开设专属展区（图源：上海市国资委）</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">再看利勃海尔。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">这家航空制造巨头一次性亮出C909前起落架和波音B777-9折叠翼尖——后者是全球首款商用民航折叠翼尖系统。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">今年7月，利勃海尔的工业厂房项目刚在临港大飞机园奠基，建成后就近服务中国商飞C919生产。罗克韦尔自动化则把iTRAK柔性制造产线和数字孪生仿真平台开进展区，\"看不见的产线\"在屏幕上实时转。</p>\n<p style=\"margin:0 0 18px;font-size:16px;font-weight:bold;line-height:1.75;color:#1a1a1a;\">一句话：去年是78家企业摆展品，今年是100余家企业连成链。</p>\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">330平米体验区，机器人会跟你抢球拍</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">如果只逛一个角落，去AI科技创新体验区。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">330多平方米，全场最热闹。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">Hitch Open，全球首个面向机器人乒乓等物理智能竞技的开源平台，这次首次参展进博会。两台AI自主决策机器人在球台两端对打——<strong style=\"color:#0a84ff;\">无遥控、无脚本、无人工干预</strong>，现场挑战新的世界纪录。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">隔壁是全球首展的未来酒店示范场景：人形机器人远征A3 Ultra当管家，入住登记、引路巡检、商品导购，一条龙全包。</p>\n<p style=\"text-align:center;margin:26px 0 6px;\"><img src=\"assets/pingpong-robot.png\" style=\"max-width:100%;width:100%;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999;line-height:1.6;margin:0 0 26px;\">基于Hitch Open平台的AI自主决策机器人乒乓球对打，全自主运动对抗（图源：上海市国资委）</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">体验区之外，滴水湖荣耀会客厅也搬了进来——就是以临港地标\"荣耀之环\"为形象的那个会客厅，300多平方米，展期里排了近20场主题活动，从具身智能聊到中国汽车产业链出海巴西。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">还有零界魔方、临港科创城这些OPC（一人公司）社区，带着近千名青年创业者的项目一起进了场。</p>\n<p style=\"text-align:center;margin:34px 0;font-size:17px;font-weight:bold;line-height:1.7;color:#1a1a1a;\">\"年轻的城、年轻人的城\"，<br>这句口号在3H馆里是实景。</p>\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">6天的展台，365天的生意</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">大牌之外，这次也给中小企业留了位置。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">艾里奥斯，一家2021年成立、扎根临港的生物科技公司，做制药过滤膜材料。创始人贾启军在展区说了一句话，值得记下来：</p>\n<p style=\"border-left:4px solid #d0d7de;background:#fafbfc;padding:12px 16px;margin:0 0 18px;font-size:15px;line-height:1.8;color:#555;\">\"我们在除菌膜和除病毒膜材料上已经达到国际最先进品牌水平，部分参数甚至超过国际最好品牌30%到50%。\"</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">这家公司去年就在临港展示区露过脸，会后扩租了临港产业区钻石园。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">这不是个例。第八届进博会后，临港产业区<strong style=\"color:#0a84ff;\">超半数参展企业</strong>增资扩投，再投资载体面积超过<strong style=\"color:#0a84ff;\">6000平方米</strong>；普罗名特规模最大的海外单体生产基地，今年已经正式投产。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">展品变商品，展商变投资商——\"6天+365天\"这句话，临港是真在照着做。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">今年上半年，临港新片区出口、外贸、走出去业务保持两位数增长，增速领先全市平均水平。</p>\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">还剩三天，想看的两条路</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">进博会不对个人观众售票，多数人进不了3H馆。想看，有两条路：</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.75;color:#333;\"><strong>一</strong>是蹲\"上海临港\"\"临港集团\"的公众号，接下来几天会有现场的持续报道；</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\"><strong>二</strong>是等等看——按往年的节奏，这批展品里有不少，年底前后就会出现在临港的工厂和产业园里。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">你更想看哪个？Cybercab、金色机器人，还是那台会打乒乓的？评论区聊聊。</p>\n<p style=\"margin:34px 0 18px;font-size:15px;line-height:1.75;color:#333;\">11月10日之前，3H馆的灯都亮着。</p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.75;color:#333;\">那滴水，正从滴水湖，流进更宽的江海。</p>\n"
}

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
