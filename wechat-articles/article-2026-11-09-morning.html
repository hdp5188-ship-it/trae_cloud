<script id="post-data" type="application/json">
{
  "title": "滴水湖那栋空了多年的白房子，开了间免费美术馆",
  "account": "临港生活笔记",
  "account_sub": "",
  "author": "临港生活笔记",
  "date": "2026年11月9日 08:09",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:17px;line-height:1.9;color:#1f1f1f;margin:0 0 22px;letter-spacing:0.4px;\">滴水湖北岛，草坡上立着一排黄色字母：LINGANG。</p>\n\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/museum-exterior.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;line-height:1.6;color:#9a9a9a;text-align:center;margin:0 0 32px;\">北岛肆号美术馆外景。图源：澎湃新闻·上海LOOK，摄影 Keroro</p>\n\n<p style=\"font-size:14px;line-height:1.85;color:#5f7375;background:#f4f8f8;padding:14px 16px;margin:0 0 30px;\">滴水湖北岛那栋闲置多年的白房子，今年秋天变成了免费美术馆。四个展览，屋顶能看湖。去之前，这份实用信息先收好。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">字母后面，是一栋白色建筑。屋檐四角翘起，像一张被湖风撑开的帆。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">这栋房子空了很久。过去，它只是临港环湖建筑群里的一个编号，叫北岛肆号。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">今年秋天，它开了门，成了<span style=\"color:#16697a;font-weight:bold;\">北岛肆号美术馆</span>。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#16697a;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#16697a;margin:14px 0 22px;border-bottom:3px solid #16697a;padding-bottom:9px;\">空了很久的房子，先有了颜色</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">北岛肆号原本是滴水湖北岛上的闲置建筑。滴水湖环湖一带，被称作临港的“最美环湖建筑群”。这栋房子是其中之一，却一直没派上用场。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">改造之后，它变成四间纯白展厅。屋顶铺了粉紫色阶梯，从湖边往上看，颜色由深到浅，一路淡到天上去。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">最出片的是屋顶露台。台阶一级一级往上，走到顶，滴水湖和金融湾都在眼前。</p>\n\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/museum-roof.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;line-height:1.6;color:#9a9a9a;text-align:center;margin:0 0 32px;\">屋顶露台，粉紫渐变的台阶一路铺到湖边。图源：澎湃新闻·上海LOOK，摄影 Keroro</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">它不是那种要专门留出半天的大美术馆。解放日报的报道里说得很准确：一座“镇级美术馆”，面积不大。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">但该有的都有。常设展厅、特展厅、数字展厅、美育空间，还有周边商店和咖啡馆。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">关键是，<span style=\"color:#16697a;font-weight:bold;\">免费</span>。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#16697a;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#16697a;margin:14px 0 22px;border-bottom:3px solid #16697a;padding-bottom:9px;\">一间小馆，放了四个展</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">开馆展里，分量最重的是《长亭外——李叔同（弘一大师）生平特展》。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">10月23日是李叔同诞辰146周年，展览就在那天开展。15件藏品，把他从富贵少年、名士风流，一路讲到弘一法师。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">展厅里放的是朴树翻唱的《送别》。不少人走到“悲欣交集”四个字前面，会停一会儿。</p>\n\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/museum-exhibit.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;line-height:1.6;color:#9a9a9a;text-align:center;margin:0 0 32px;\">《长亭外》特展现场，墙上是“春柳社与《茶花女》”的史料。图源：澎湃新闻·上海LOOK，摄影 Keroro</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">隔壁常设展叫“纷与寂”，展的是弘一大师手书遗墨。手稿、信札、题跋，一共35幅，会定期更换。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">另外两个展，一个把玻璃展厅做成森林，泥土塑的孩子躺在云上；一个是数字展厅，人一走，屏幕里的小动物跟着动。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">四个展，全部免费。特展展到2027年1月23日，时间还宽裕。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#16697a;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#16697a;margin:14px 0 22px;border-bottom:3px solid #16697a;padding-bottom:9px;\">去之前，记住这几件事</p>\n\n<p style=\"font-size:14px;line-height:2;color:#3d4a4c;background:#f3f8f8;border-left:3px solid #16697a;padding:18px 20px;margin:0 0 26px;\"><span style=\"font-weight:bold;color:#16697a;\">地址</span>　滴水湖北岛4号（环湖北路一侧）<br><span style=\"font-weight:bold;color:#16697a;\">门票</span>　免费，入口现场预约<br><span style=\"font-weight:bold;color:#16697a;\">时间</span>　周二至周四 10:00—18:00；周五至周日 10:00—21:00；周一闭馆<br><span style=\"font-weight:bold;color:#16697a;\">特展</span>　《长亭外》展至2027年1月23日<br><span style=\"font-weight:bold;color:#16697a;\">交通</span>　地铁16号线滴水湖站，出站沿湖步行或骑车</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">周一别去，闭馆。这是最容易白跑的一趟。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">周末开到晚上九点，傍晚的屋顶比中午舒服。节假日不定期有“樱顶落日LIVE”，碰上算运气。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">馆不大，别把它当成一整天的目的地。北岛的草坡、环湖步道，附近的滴水云厅和上海天文馆，可以串成半天。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">如果只想找个地方发呆，带杯咖啡上屋顶，坐着看湖就行。</p>\n\n<p style=\"margin:38px 0 26px;padding:22px 24px;background:#f7f5f0;font-size:18px;line-height:1.8;color:#1f1f1f;font-weight:bold;\">临港这些年盖了很多楼，天际线越来越高。但一座新城到底好不好住，不看楼有多高。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">看你周末愿不愿意出门，走两步，有没有一个不花钱也能待着的地方。</p>\n\n<p style=\"font-size:17px;line-height:1.9;color:#16697a;margin:0 0 22px;letter-spacing:0.4px;font-weight:bold;\">北岛肆号很小。它的意义，大概就在这里。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">你去过滴水湖北岛吗？</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 22px;letter-spacing:0.4px;text-align:justify;\">如果去过，留言说说你最喜欢湖边哪个位置。还没去，先收藏，等一个晴天，坐16号线到底。</p>\n"
}

  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
