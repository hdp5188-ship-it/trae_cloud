<script id="post-data" type="application/json">
{
  "title": "滴水湖新开的白色美术馆，免费，上午去最好",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月10日 08:10",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">上周六上午十点刚过，16号线坐到滴水湖。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">出站风比市区大一号，湖面被吹出一层细碎的鳞。我没往湖滨广场走，沿着环湖的路往北岛骑。草坡上立着一排比人还高的白色字母，<strong style=\"color:#24404d;\">LINGANG</strong>。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">再往前，就看见那栋房子了。白色屋顶四角微微翘起，像一张被风鼓起来的帆，帆下面压着一块粉紫色的屋顶。</p>\n<p style=\"margin:0 0 10px;\"><img src=\"assets/dishui-art-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;color:#8d8d8d;line-height:1.7;text-align:center;margin:0 0 30px;\">滴水湖北岛肆号美术馆。澎湃新闻·ShanghaiLOOK 摄影 Keroro</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">这是最近刚开馆的北岛肆号美术馆。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">房子不是新建的。它原本是北岛上闲置了很久的肆号建筑，改造之后，成了临港“最美环湖建筑群”里新加的那一个。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">地方不大，但值得挑个上午来。人少，光斜着打进白展厅，湖风从门口过。</p>\n\n<p style=\"text-align:center;font-size:15px;font-weight:bold;color:#b8567a;letter-spacing:4px;margin:54px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#24404d;margin:10px 0 30px;\">先上屋顶，再进展厅</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">多数人到了门口，会直接往里进。我建议先绕到侧面的草坡。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">草坡上是一段马卡龙色的阶梯，粉、紫、白一层层往上铺，走到底就是屋顶露台。</p>\n<p style=\"margin:0 0 10px;\"><img src=\"assets/dishui-art-stairs.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;color:#8d8d8d;line-height:1.7;text-align:center;margin:0 0 30px;\">美术馆屋顶的粉紫渐变阶梯。澎湃新闻·ShanghaiLOOK 摄影 Keroro</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">上午太阳在东边，光不刺眼。站在露台上往下看，S形的白桥把湖畔绿地串起来，远处是金融湾一片新楼的轮廓。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">风很大，帽子要按住。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\"><strong style=\"color:#b8567a;\">先上屋顶，再进展厅</strong>，是我这趟最想告诉你的一件事。反过来走，看完展出来，屋顶的光已经变了。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">四间纯白展厅围在中间。从空中看，屋顶像花瓣散开，这个角度站在地面是看不到的。</p>\n\n<p style=\"text-align:center;font-size:15px;font-weight:bold;color:#b8567a;letter-spacing:4px;margin:54px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#24404d;margin:10px 0 30px;\">一间小镇美术馆，塞了四个展</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">这里是南汇新城镇指导下的镇级美术馆，面积不大，却分了常设展厅、特展厅、数字展厅和美育空间。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">开馆特展叫<strong style=\"color:#24404d;\">《长亭外》</strong>，讲李叔同。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">15件藏品，从天津的富贵少年，到上海的名士，再到虎跑定慧寺落发。展厅里循环放着朴树翻唱的《送别》，走完一圈，像把一个人的一生轻轻翻了一遍。</p>\n<p style=\"margin:0 0 10px;\"><img src=\"assets/dishui-art-exhibition.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;color:#8d8d8d;line-height:1.7;text-align:center;margin:0 0 30px;\">《长亭外——李叔同（弘一大师）生平特展》现场。新华网 史依灵 摄</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">旁边常设展叫《纷与寂》，35幅手书遗墨，手稿、信札、题跋都有，会定期更换。字很小，凑近看，一笔一划都不急。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">策展人浦泉耀说了一句话，我在展厅里站了很久：</p>\n<p style=\"background:#faf5f6;border-left:4px solid #b8567a;padding:20px;margin:0 0 24px;font-size:16px;color:#5c4a50;line-height:1.9;letter-spacing:0.4px;\">真正的告别不是失去什么，而是终于肯向自己靠近。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">直面湖景的那间展厅，现在是《透过阳光》。雕塑家杨科朋用泥土捏了个叫阿布的小孩，让他坐在云上；绿植艺术家陈涛在旁边种了一座小森林。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">还有个数字展厅，雷达会捕捉人的移动，屏幕里的小动物跟着你走。小朋友进去基本就喊不出来了。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">出口有周边商店和咖啡馆。买不买随意，坐一会儿是真的舒服。</p>\n\n<p style=\"text-align:center;font-size:15px;font-weight:bold;color:#b8567a;letter-spacing:4px;margin:54px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#24404d;margin:10px 0 30px;\">去之前，这几件事先记下</p>\n<p style=\"background:#f5f5f1;border-left:3px solid #24404d;padding:14px 18px 6px;margin:0;font-size:15px;color:#3b3b3b;line-height:1.9;\"><strong style=\"color:#24404d;\">地址</strong>　浦东新区环湖北路一路，滴水湖北岛4号</p>\n<p style=\"background:#f5f5f1;border-left:3px solid #24404d;padding:6px 18px;margin:0;font-size:15px;color:#3b3b3b;line-height:1.9;\"><strong style=\"color:#24404d;\">门票</strong>　免费，入口现场预约即可</p>\n<p style=\"background:#f5f5f1;border-left:3px solid #24404d;padding:6px 18px;margin:0;font-size:15px;color:#3b3b3b;line-height:1.9;\"><strong style=\"color:#24404d;\">时间</strong>　周二至周四 10:00—18:00；周五至周日 10:00—21:00</p>\n<p style=\"background:#f5f5f1;border-left:3px solid #24404d;padding:6px 18px;margin:0;font-size:15px;color:#3b3b3b;line-height:1.9;\"><strong style=\"color:#24404d;\">闭馆</strong>　每周一</p>\n<p style=\"background:#f5f5f1;border-left:3px solid #24404d;padding:6px 18px 14px;margin:0 0 26px;font-size:15px;color:#3b3b3b;line-height:1.9;\"><strong style=\"color:#24404d;\">提醒</strong>　《长亭外》特展展到2027年1月23日，常设展的35幅会轮换</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">周五到周日开到晚上九点，这个时间对上班族很友好。下班坐16号线过来，看完展出来，回去的车还赶得上。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">不过要拍屋顶，还是上午好。下午背光，粉紫色会发灰。</p>\n\n<p style=\"text-align:center;font-size:15px;font-weight:bold;color:#b8567a;letter-spacing:4px;margin:54px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#24404d;margin:10px 0 30px;\">看完展，湖还在等你</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">北岛只是环湖的一小段。出馆继续骑，一号码头、滴水云厅都在湖边，上海天文馆也不远。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">湖边的风把时间吹得很慢。带块野餐垫，在草坪上坐半小时，比赶下一个景点划算。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">交通也在变。市域铁路南汇支线今年8月已经全线结构贯通，以后会设滴水湖北站，从市区过来还能再快一点。具体开通时间，等官方消息。</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#24404d;line-height:1.8;margin:40px 0 26px;\">艺术和生活之间，<br>不用换乘。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">上海看展，大家习惯往西岸、外滩跑。临港远，这是实话。但远也有远的好处——从展厅出来，风一吹，湖就在眼前，不用再钻进地铁，也不用排队等一杯咖啡。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">一座镇级美术馆，安安静静开在岛上。它不宏大，但把“看展”这件事，还给了日常。</p>\n<p style=\"font-size:16px;color:#3b3b3b;line-height:1.9;letter-spacing:0.4px;margin:0 0 24px;\">你去过北岛了吗？或者，滴水湖还有哪个角落值得一个上午？评论区聊聊，我下次去。</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
