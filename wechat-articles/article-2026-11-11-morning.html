<script id="post-data" type="application/json">
{
  "title": "临港人的早高峰，还有8个月就熬出头了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月11日 08:10",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">早上六点二十，滴水湖站的站厅里已经有人在啃早饭了。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">包子、豆浆、降噪耳机。往龙阳路方向的头班车，六点刚过就发。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">对住在临港的人来说，这个点出门不算早。真赶时间的，五点半就得起。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 26px;\">这样的早晨，很多人过了五六年。好消息是，它快到头了。</p>\n\n<p style=\"margin:0 0 8px;\"><img src=\"assets/lingang-xidao-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9b9b9b;line-height:1.7;text-align:center;margin:0 0 8px;\">滴水湖西岛，中银金融中心双子塔。新华社记者 方喆 摄（2026年1月）</p>\n\n<p style=\"font-size:15px;color:#6f7d84;line-height:1.9;margin:0 0 26px;background:#f4f7f8;border-left:3px solid #0e6b85;padding:16px 18px;\">市域铁路南汇支线（两港市域铁路）已于今年8月实现全线结构贯通，计划2027年7月建成通车。这是临港新片区继16号线之后，第二条真正意义上“出城”的快速通道。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b85;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b85;margin:14px 0 22px;border-bottom:3px solid #0e6b85;padding-bottom:9px;\">临港人的早晨，是拿分钟算的</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">先从16号线说起。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">滴水湖站的头班车六点整发车。到龙阳路，站站停要六十分钟上下，大站车四十五分钟，直达车三十四分钟——但直达车一天没几班，赶不上就是赶不上。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">到了龙阳路还不算完。换2号线、换11号线、换10号线，出站再走十分钟。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">有位在长宁古北上班的日本人，把这段路走成了日常：六点半出门，16号线转11号线转10号线，八点一刻到诊所。<span style=\"color:#0e6b85;font-weight:bold;\">两个小时，一个来回就是小半天。</span></p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">还有更远的。媒体写过一位住在临港的摄影师，工作在静安市北高新园区，单程两个半小时以上，来回五个小时。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">他自己算了笔账：一年七百多个小时，全花在路上。</p>\n\n<p style=\"font-size:19px;color:#1a1a1a;font-weight:bold;line-height:1.75;text-align:center;margin:32px 0;\">在临港，通勤不是一段路，<br>是一天里最先被切走的那块时间。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">所以这几年的临港，说起交通，几乎每个人都有点情绪。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b85;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b85;margin:14px 0 22px;border-bottom:3px solid #0e6b85;padding-bottom:9px;\">8月15日，最后一榀箱梁落位</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">今年8月15日，南汇支线最后一榀箱梁精准落位。主线段、东支线段，全线结构贯通。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">这活儿不轻松。全线一共要预制、架设664榀箱梁，全在高架上，吊装、高处作业，一榀一榀往上放。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">再往前推两个月，6月17日，全线长轨铺设收官，累计铺轨39.1公里，焊了382个钢轨接头。</p>\n\n<p style=\"margin:0 0 8px;\"><img src=\"assets/nanhui-line-track.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9b9b9b;line-height:1.7;text-align:center;margin:0 0 24px;\">南汇支线高架段铺轨作业。图源：上海发布 / 上海市住房城乡建设管理委</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">现在的进度是：桥通了，轨铺了，接下来是桥面系、东支线铺轨、接触网、电缆敷设，再往后是联调联试。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 22px;\">8月21日的市政府新闻发布会上，临港方面给了一个明确时间：<span style=\"color:#c4552f;font-weight:bold;\">明年7月，市域线南汇支线建成通车。</span></p>\n\n<p style=\"font-size:14px;color:#4a4a4a;line-height:1.95;margin:0 0 6px;background:#f4f7f8;padding:18px 18px 6px;font-weight:bold;\">这条线，几个数</p>\n<p style=\"font-size:14px;color:#4a4a4a;line-height:1.95;margin:0;background:#f4f7f8;padding:0 18px 6px;\">全长　<b style=\"color:#0e6b85;\">34.86</b> 公里（主线27.88公里 + 东支线6.98公里）</p>\n<p style=\"font-size:14px;color:#4a4a4a;line-height:1.95;margin:0;background:#f4f7f8;padding:0 18px 6px;\">车站　<b style=\"color:#0e6b85;\">6</b> 座：浦东3号航站楼、鹏翔路、滨海森林公园、星海湾路、滴水湖北、上海东站</p>\n<p style=\"font-size:14px;color:#4a4a4a;line-height:1.95;margin:0;background:#f4f7f8;padding:0 18px 6px;\">时速　最高 <b style=\"color:#0e6b85;\">160</b> 公里，大站快车 + 站站停混跑</p>\n<p style=\"font-size:14px;color:#4a4a4a;line-height:1.95;margin:0;background:#f4f7f8;padding:0 18px 18px;\">目标　临港主要节点 <b style=\"color:#0e6b85;\">15</b> 分钟到浦东枢纽，<b style=\"color:#0e6b85;\">60</b> 分钟到虹桥</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:24px 0 18px;\">注意最后一行：不是到人民广场十五分钟，是到浦东枢纽十五分钟。这两个地方，差着一条黄浦江。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b85;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b85;margin:14px 0 22px;border-bottom:3px solid #0e6b85;padding-bottom:9px;\">明年7月以后，账要怎么算</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">先说清楚一件事：南汇支线在临港主城区只设一站——滴水湖北站。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">它不在你家楼下，也不在滴水湖地铁站旁边。住环湖一带的人，还得先骑车、坐公交过去。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">所以别指望明年7月一到，所有问题自动消失。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">但对另一部分人，这条线是实打实的。经常飞浦东机场的、在上海东站换高铁的、去张江和市区西部上班的，一趟车就能省掉一次换乘，省掉一个小时。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">配套也在动。16号线要提升运能，争取非高峰时段增开直达车、加密大站车；S2沪芦高速在推进拓宽改造；沪通铁路二期、上海临港枢纽站也在往前推。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">临港管委会的说法很直接：现在临港是“交通末梢”，要把它变成“枢纽”。</p>\n\n<p style=\"margin:0 0 8px;\"><img src=\"assets/lingang-city-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:12px;color:#9b9b9b;line-height:1.7;text-align:center;margin:0 0 24px;\">从滴水湖西岛望向主城区。新华社记者 方喆 摄（2026年1月）</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">这句话不夸张。一个地方能不能留住年轻人，很多时候不看房价，看早上六点半那班车挤不挤、要坐多久。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">八年时间，临港从一片滩涂长成了现在的样子。湖是人工挖的，城是一点点填起来的，路也是一段段修出来的。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">还差最后八个月。</p>\n\n<p style=\"font-size:15px;color:#3a3a3a;line-height:1.95;margin:34px 0 14px;border-top:1px solid #e2e6e8;padding-top:22px;\">你每天早上几点出门？从滴水湖到公司，要花多久？</p>\n\n<p style=\"font-size:15px;color:#3a3a3a;line-height:1.95;margin:0 0 18px;\">评论区聊聊你的通勤路线，看看谁才是真正的“临港特种兵”。</p>\n\n<p style=\"font-size:13px;color:#9b9b9b;line-height:1.85;margin:26px 0 0;\">资料来源：上海市交通委员会、上海市住房城乡建设管理委、上海市政府新闻发布会（2026年8月21日）、上海发布、新华社。</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
