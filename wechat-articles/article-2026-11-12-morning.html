<script id="post-data" type="application/json">
{
  "title": "早上七点，去滴水湖骑一支40公里的“棒棒糖”",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月12日 08:10",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 26px;font-size:16px;line-height:1.9;color:#5f6b73;letter-spacing:0.5px;\">立冬刚过，滴水湖的早上有点冷。风从东海那边过来，带着咸味。但这个季节的光是真好——斜的，软的，从环湖林带里穿过来，把银杏照得透亮。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">六点半到湖边，天刚亮不久。跑步的人三三两两，共享单车停在树底下，湖面平得像一块还没睡醒的玻璃。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">十月底那波最好的秋色刚刚过去，但十一月的清晨，还能捡到一点尾巴。芦苇白了，水杉开始转锈红，人少，风清，是一年里最适合早起骑车的时候。</p>\n\n<p style=\"text-align:center;margin:32px 0 8px;\"><img src=\"assets/dishuihu-tianwenguan.jpg\" style=\"max-width:100%;width:100%;\"></p>\n\n<p style=\"text-align:center;margin:0 0 26px;font-size:12px;color:#9aa5ab;letter-spacing:0.5px;\">滴水湖畔的上海天文馆。图源：乐游上海</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">这里有一条在骑友圈传了很久的线，今年秋天又被“乐游上海”推了一轮。四十公里，导航轨迹是一支棒棒糖。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">不用做太多攻略。<strong style=\"color:#1f6f8b;\">顺时针，沿着湖走，路会自己把你带回去。</strong></p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1f6f8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#1f6f8b;margin:14px 0 22px;border-bottom:3px solid #1f6f8b;padding-bottom:9px;\">这支“棒棒糖”，到底是什么</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">形状很简单。环湖一圈是圆圆的糖身，沿海港大道往返上海海事大学的那一段，是长长的糖棍。两段接起来，正好四十公里。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">推荐起点是滴水湖洲际酒店。从那里出发，顺时针，先走环湖一路。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">为什么强调顺时针？因为湖在右手边。想停就停，想拍就拍，不用横穿马路去追风景。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">这条路不算新，也不收门票。它更像临港人自己的后花园——住附近的人周末来刷一圈，跑马拉松的来拉练，带孩子的骑到一半就拐去公园。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1f6f8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#1f6f8b;margin:14px 0 22px;border-bottom:3px solid #1f6f8b;padding-bottom:9px;\">早上七点，路上有什么</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">环湖一路这一段，树最密。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">银杏黄了一半，水杉还带着锈红，樟树是深绿的底。太阳低，光从树缝里漏下来，路面一段亮、一段暗。骑进去，像穿过一条很长的时间隧道。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">西岸这段建议慢一点。一尺花园、壹号码头都在这边，湖面开阔，早上几乎没人跟你抢机位。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">再往前，转上海港大道，就是那根“糖棍”。路直，车少，风大。骑到上海海事大学门口折返，回到环湖二路。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">环湖二路是我最喜欢的一段。星空之镜海绵公园的芦苇已经全白了，风一过，整片簌簌地响，声音比湖浪还清楚。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">这一段也是整条线里最“不像上海”的地方。没有高楼，只有水、草、桥，和远处慢慢升起来的太阳。</p>\n\n<p style=\"text-align:center;margin:32px 0 8px;\"><img src=\"assets/xingkongzhijing-wetland.jpg\" style=\"max-width:100%;width:100%;\"></p>\n\n<p style=\"text-align:center;margin:0 0 26px;font-size:12px;color:#9aa5ab;letter-spacing:0.5px;\">环湖二路的湿地与步道。图源：乐游上海</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">再往后，中国航海博物馆、南汇新城城市公园、上海天文馆、临港少年宫，一个接一个。人文场馆和湖景交替出现，节奏不会闷。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1f6f8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#1f6f8b;margin:14px 0 22px;border-bottom:3px solid #1f6f8b;padding-bottom:9px;\">骑累了，三个地方可以停</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\"><strong>一尺花园（西岸店）</strong>，环湖西一路858号。一千五百平方米的玻璃房，图书、绿植、咖啡混在一起，像浮在码头上的一朵云。骑到这儿，身子刚热开，坐下来喝一杯，再走不迟。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\"><strong>壹号码头</strong>，环湖西一路1号。半开放的空间，大台阶对着湖。天气好的时候，湖面蓝得有点像海。这里最适合发呆，不适合赶路。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\"><strong>朵云书院·滴水湖店</strong>，环湖西一路91号港城广场文化艺术中心5楼。五千平方米，二十米高的通天书架，七万册书沿着阶梯铺上去。巨大的落地窗外面，就是湖。</p>\n\n<p style=\"border-left:4px solid #1f6f8b;background:#f2f7f9;padding:14px 18px;margin:0 0 22px;font-size:16px;line-height:1.9;color:#2f4a55;\">低头看书，抬头看湖。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">不过要提醒一句：早上到得太早，书院还没开门。隔着玻璃看一眼，也算来过。真想进去，就把这一段留到回程。</p>\n\n<p style=\"text-align:center;margin:32px 0 8px;\"><img src=\"assets/duoyun-shuyuan.jpg\" style=\"max-width:100%;width:100%;\"></p>\n\n<p style=\"text-align:center;margin:0 0 26px;font-size:12px;color:#9aa5ab;letter-spacing:0.5px;\">朵云书院·滴水湖店的落地窗。图源：乐游上海</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1f6f8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#1f6f8b;margin:14px 0 22px;border-bottom:3px solid #1f6f8b;padding-bottom:9px;\">骑不动四十公里，也有办法</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">四十公里对很多人来说，还是太长了。那就把范围缩小到环湖景观带。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">一圈八公里。滨湖步道、漫步道、跑步道，三条路贴着水走。沿湖还有七座桥，每座桥和它所在的港口同名同色，骑过去像穿过一道一道彩虹。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">沿线有共享单车点位，体力不够随时可以还车。地铁16号线坐到滴水湖站，出站就能接上绿道。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">如果只有一个早上，我的建议是：只骑西岸到南岸这一小段。四十分钟，够你看一场日出，再回去上班。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1f6f8b;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#1f6f8b;margin:14px 0 22px;border-bottom:3px solid #1f6f8b;padding-bottom:9px;\">几句实在话</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">湖边风大，防风外套不要省。早上温度低，骑起来不冷，停下来就冷。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">东港大道到观海公园那段有缓坡。晨露会让路面发滑，下坡捏着点刹，别冲。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">早上补给点少，自己带瓶水。工作日人最少，周末七点以后，跑步的人就多起来了。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">骑完回到洲际酒店，差不多八点半。太阳升高了，湖面从灰蓝变成亮蓝，城市也开始响起来。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">湖北岸那片工地，是正在建的滴水湖运动中心一期。公示的总用地面积约6.7万平方米，差不多九个足球场。等它建好，这一圈的早上大概会更热闹。</p>\n\n<p style=\"margin:0 0 22px;font-size:17px;line-height:1.9;color:#1f6f8b;font-weight:bold;\">所以，别等到周末中午。挑一个晴天，六点半出门。</p>\n\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.9;color:#333;letter-spacing:0.4px;\">你骑过滴水湖这一圈吗？或者，你心里那条“值得早起”的路线，在哪里？评论区聊聊。</p>\n\n<p style=\"margin:34px 0 0;font-size:12px;color:#9aa5ab;line-height:1.8;letter-spacing:0.4px;\">参考：乐游上海《跟着这条40公里“棒棒糖”骑行线，在滴水湖体验专属秋色》、上观新闻《沿着亲水路线骑行，一览申城湖光秋色》、上海市规划和自然资源局滴水湖运动中心（一期工程）公示。</p>\n"

      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
