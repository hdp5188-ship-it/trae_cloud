<script id="post-data" type="application/json">
{
  "title": "滴水湖不只想当网红",
  "account": "滴水湖观察",
  "account_sub": "",
  "author": "滴水湖观察",
  "date": "2026年11月13日 08:10",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:12px;color:#8a9aa2;letter-spacing:2px;margin:0 0 12px;\">临港观察 · 2026年11月</p>\n\n<p style=\"font-size:28px;font-weight:bold;color:#152a33;line-height:1.38;letter-spacing:0.5px;margin:0 0 10px;\">滴水湖不只想当网红</p>\n\n<p style=\"font-size:15px;color:#7b8b93;line-height:1.7;margin:0 0 30px;\">环湖的天际线亮了，市域铁路全线贯通，湖边还在挖一个运动中心。临港做的这些事，比每周六的烟花更值得看。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">很多人对临港的印象，还停在“上海最东南角的那片湖”。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">周六晚上八点，那里会放六分钟烟花。免费，不用预约，环湖一圈都能看见。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 28px;\">看完就走的人很多。可湖边这几年长出来的东西，比烟花耐看。</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\"><img src=\"assets/dishui-lake-aerial.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa7ad;line-height:1.6;margin:0 0 34px;\">滴水湖航拍｜临港新片区管委会</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#0f5f7a;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">01</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f5f7a;margin:14px 0 22px;padding-bottom:10px;border-bottom:2px solid #dbe9ef;line-height:1.4;\">湖边那圈天际线，先长出来了</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">从环湖西一路往北走，最先撞见的是“荣耀之环”。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">一个金色的圆环架在两栋楼之间，远看像一只停在半空的飞碟。今年1月，它的建设基本完成。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">体量不小。<span style=\"background:#eaf4f8;color:#0f5f7a;padding:1px 4px;\">89万平方米商业空间、7500多平方米市民文化场地、2.8万多平方米公共开放区域</span>——数字听着抽象，落到地上就是：逛街、看展、带孩子跑，都能在湖边解决。</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#0f5f7a;line-height:1.85;margin:26px 0 22px;\">临港以前缺的不是风景，是风景之外的城市功能。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">9月30日到10月7日，第三届上海国际光影节在这里设了分会场。荣耀之环的灯光秀叫《四时风物》，每晚七点到十点，把临港的四季打在环上——春绣球，夏海浪，深秋芦苇，冬雪花。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">往西走，兴港城的裸眼3D大屏、中铁建临港大厦的“临港之眼”、一号码头的白色风车，串成一条夜游动线。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 26px;\">一个地方愿意在晚上花心思，说明它开始有人留下来了。</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\"><img src=\"assets/honor-ring.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa7ad;line-height:1.6;margin:0 0 34px;\">滴水湖金融湾“荣耀之环”｜解放日报记者 孟雨涵 摄</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#0f5f7a;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">02</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f5f7a;margin:14px 0 22px;padding-bottom:10px;border-bottom:2px solid #dbe9ef;line-height:1.4;\">以后来临港，可能不用再开车</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">去滴水湖，上海人的第一反应是16号线。从龙阳路坐到底，一个多小时，车厢里从挤到空。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">这个局面，正在被一条铁路改写。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">市域铁路南汇支线，<span style=\"font-weight:bold;color:#152a33;\">全长34.86公里，设6座车站</span>。主线从浦东T3航站楼引出，经鹏翔路、滨海森林公园、星海湾路，到临港的滴水湖北站。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">今年8月15日，最后一榀箱梁精准落位。主线加上东支线，全线结构贯通。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">东支线从在建的上海东站接入鹏翔路，长6.98公里。接下来是桥面系、东支线铺轨、接触网和电缆敷设。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">建成后，临港和东方枢纽、虹桥枢纽、上海主城区之间，会多一条快速通道。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 26px;\">说白了，以后从虹桥下飞机去滴水湖，不用先横穿整个上海。</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#0f5f7a;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">03</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f5f7a;margin:14px 0 22px;padding-bottom:10px;border-bottom:2px solid #dbe9ef;line-height:1.4;\">湖的另一面，是厂房和实验室</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">站在湖边往南看，是风景。往产业区看，是另一回事。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">6月29日，芯港集成的晶圆制造项目开工。一期总建筑面积约62万平方米，做55纳米到28纳米的平面工艺，计划2027年底前交付。公司注册资本55亿美元。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">同一条产业链上，东盛合芯的三维集成芯片项目也动了，一期总投资100亿元，做的是3DIC先进封装。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">8月21日的市政府新闻发布会讲得很直白：集成电路靠“东方芯港”，民用航空靠大飞机园，智能网联汽车靠上汽、特斯拉这些整车厂。</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#0f5f7a;line-height:1.85;margin:26px 0 22px;\">湖是给人看的，厂是给人上班的。两样都有，才叫新城。</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#0f5f7a;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">04</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f5f7a;margin:14px 0 22px;padding-bottom:10px;border-bottom:2px solid #dbe9ef;line-height:1.4;\">一座城要留住人，靠的是不网红的东西</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">9月，滴水湖运动中心（一期）拿到建设工程规划许可证，9月28日完成开工放样复验。地块就在环湖北三路、乔柏路、香柏路和春涟河之间。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">11月6日，华东师范大学临港新校区的规划许可也公示了。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">10月底，2026年“临港英才”评选启动申报。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">这几条消息单拎出来，都不炸。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">但一座城能不能留住人，看的恰恰是这些：有没有地方打球，孩子有没有学上，干得好的人会不会被看见。</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#0f5f7a;line-height:1.85;margin:26px 0 22px;\">烟花一年放五十多场，热闹是热闹。真正让人搬过来的，是楼下的球场和门口的学校。</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\"><img src=\"assets/dishui-lake-night.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa7ad;line-height:1.6;margin:0 0 34px;\">滴水湖畔华灯初上｜临港新片区管委会</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#0f5f7a;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">05</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f5f7a;margin:14px 0 22px;padding-bottom:10px;border-bottom:2px solid #dbe9ef;line-height:1.4;\">顺手记</p>\n\n<p style=\"font-size:15px;color:#333333;line-height:1.85;margin:0;padding:12px 18px;background:#f4f8fa;border-left:3px solid #0f5f7a;\"><span style=\"font-weight:bold;color:#0f5f7a;\">烟花</span>　2026年每周六及部分节假日 20:00，环湖景观带，免费、无需预约，约6分钟。</p>\n<p style=\"font-size:15px;color:#333333;line-height:1.85;margin:0;padding:12px 18px;background:#f4f8fa;border-left:3px solid #0f5f7a;\"><span style=\"font-weight:bold;color:#0f5f7a;\">地铁</span>　16号线滴水湖站，出站步行约10分钟到湖边。</p>\n<p style=\"font-size:15px;color:#333333;line-height:1.85;margin:0 0 30px;padding:12px 18px;background:#f4f8fa;border-left:3px solid #0f5f7a;\"><span style=\"font-weight:bold;color:#0f5f7a;\">骑行</span>　环湖步道一圈约8公里，傍晚风大，记得带件外套。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">所以下次去滴水湖，别只等到晚上八点。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 18px;\">下午沿湖骑一圈，去看看那个圆环，看看湖对岸的塔吊。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.95;letter-spacing:0.3px;margin:0 0 26px;\">你会发现，这片湖的野心，从来不止是当一个打卡点。</p>\n\n<p style=\"font-size:15px;color:#7b8b93;line-height:1.9;margin:0;padding-top:20px;border-top:1px solid #e3edf1;\">你去过滴水湖吗？最近一次是什么时候，湖边有什么变化？评论区聊聊。</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">滴水湖观察</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || '滴水湖观察';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
