<script id="post-data" type="application/json">
{
  "title": "定了：2027年7月通车。滴水湖到浦东机场，约15分钟",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月15日 08:11",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:0;margin:0 0 0;line-height:0;\"><img src=\"assets/dishui-lake-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\" alt=\"滴水湖西岛中银金融中心双子塔航拍\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa4a9;line-height:1.7;margin:9px 0 34px;\">2026年1月29日，滴水湖畔的临港西岛中银金融中心双子塔（无人机全景照片）。<br>新华社记者 方喆 摄</p>\n\n<p style=\"background:#f7f7f4;padding:16px 18px;font-size:14.5px;color:#5c666a;line-height:1.95;margin:0 0 30px;letter-spacing:0.3px;\">今年国庆，南汇支线完成了第一次热滑。8月的发布会上，官方给了明确时间。临港人念叨了好几年的这条线，现在走到哪一步了。</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#1f2a2e;line-height:1.8;margin:0 0 20px;letter-spacing:1px;\">临港人等这条线，等得快五年了。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">先说结论：不是“快了”，是有日子了。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">2026年8月21日，上海市政府新闻发布会上，临港新片区管委会负责人给了一句话——</p>\n\n<p style=\"background:#f3f7f8;border-left:4px solid #1a6b8c;padding:18px 20px;font-size:16px;color:#1f3d47;line-height:1.9;margin:0 0 24px;letter-spacing:0.5px;\">“明年7月份市域线南汇支线将建成通车，届时临港到浦东机场、上海东站以及中心城区会越来越便捷。”</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 24px;letter-spacing:0.5px;\">“明年7月”，就是<span style=\"font-weight:bold;color:#1a6b8c;\">2027年7月</span>。</p>\n\n<p style=\"background:#fbf9f4;border:1px solid #ece5d6;padding:20px 22px;font-size:14.5px;color:#4a4f51;line-height:2.1;margin:0 0 28px;letter-spacing:0.3px;\">\n<span style=\"font-weight:bold;color:#8a6b3a;\">2022年初</span>　南汇支线开工<br />\n<span style=\"font-weight:bold;color:#8a6b3a;\">2025年11月</span>　主线段结构贯通<br />\n<span style=\"font-weight:bold;color:#8a6b3a;\">2026年8月15日</span>　全线结构贯通<br />\n<span style=\"font-weight:bold;color:#8a6b3a;\">2026年10月</span>　完成首次热滑试验<br />\n<span style=\"font-weight:bold;color:#8a6b3a;\">2027年7月</span>　建成通车（官方发布会口径）\n</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">快五年，从一根桩，到一条线。</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#1a6b8c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a6b8c;margin:14px 0 22px;border-bottom:3px solid #1a6b8c;padding-bottom:9px;line-height:1.5;\">一条线，把“末梢”往前挪</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">同一场发布会上，还有一句更实在的话。</p>\n\n<p style=\"border-left:3px solid #d9cba9;padding:4px 0 4px 16px;font-size:16px;color:#2f3a3e;line-height:1.9;margin:0 0 24px;letter-spacing:0.5px;\">“临港从区位上看现在是交通末梢。”</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">说这话的人没绕弯子。住在滴水湖的人都懂：进城靠16号线，去浦东机场没有轨道直达，开车走S2，时间全看路上堵不堵。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">南汇支线，就是来补这块短板的。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">全线34.86公里，6座车站。主线27.88公里，从浦东3号航站楼站引出，经鹏翔路、滨海森林公园、星海湾路，到滴水湖北站。东支线6.98公里，从上海东站接进鹏翔路。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 26px;letter-spacing:0.5px;\">最高时速160公里。官方的时空目标写得很明确：临港主要节点<span style=\"font-weight:bold;color:#1a6b8c;\">15分钟到浦东枢纽，60分钟到虹桥枢纽</span>。</p>\n\n<p style=\"font-size:0;text-align:center;margin:0 0 26px;line-height:1.5;\">\n<span style=\"display:inline-block;width:31%;background:#f2f7f9;border-radius:6px;padding:16px 0;margin:0 1%;text-align:center;vertical-align:top;\"><span style=\"display:block;font-size:22px;font-weight:bold;color:#1a6b8c;line-height:1.2;\">34.86</span><span style=\"display:block;font-size:12px;color:#7c8b92;margin-top:7px;\">公里 全长</span></span>\n<span style=\"display:inline-block;width:31%;background:#f2f7f9;border-radius:6px;padding:16px 0;margin:0 1%;text-align:center;vertical-align:top;\"><span style=\"display:block;font-size:22px;font-weight:bold;color:#1a6b8c;line-height:1.2;\">6</span><span style=\"display:block;font-size:12px;color:#7c8b92;margin-top:7px;\">座 车站</span></span>\n<span style=\"display:inline-block;width:31%;background:#f2f7f9;border-radius:6px;padding:16px 0;margin:0 1%;text-align:center;vertical-align:top;\"><span style=\"display:block;font-size:22px;font-weight:bold;color:#1a6b8c;line-height:1.2;\">160</span><span style=\"display:block;font-size:12px;color:#7c8b92;margin-top:7px;\">公里 最高时速</span></span>\n</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">滴水湖北站值得单独说一句。它是地下站，装修方案里，顶板开了四处钢结构天窗，取了个名字，叫“临港晨露”。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">以后从湖边走进站厅，抬头能看见天光。这个设计，比很多口号都更像临港。</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#1a6b8c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a6b8c;margin:14px 0 22px;border-bottom:3px solid #1a6b8c;padding-bottom:9px;line-height:1.5;\">今年这一步，走得很关键</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">8月15日，最后一榀箱梁落位。南汇支线的主线和支线，全线结构贯通。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">国庆假期，第一次热滑试验完成。这件事，比它听起来重要得多。</p>\n\n<p style=\"text-align:center;font-size:0;margin:30px 0 0;line-height:0;\"><img src=\"assets/nanhui-line-shield.jpg\" style=\"max-width:100%;width:100%;display:block;\" alt=\"南汇支线申拓号盾构机始发\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa4a9;line-height:1.7;margin:9px 0 34px;\">2025年3月25日，南汇支线“申拓号”盾构机始发仪式现场。<br>新华社发</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">热滑是什么？说白了，是给整条线做一次“通电体检”。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">检测车以60公里时速跑，看弓网接不接得住、轨道平不平、信号稳不稳。弓力、导高、拉出值、硬点、拉弧，一项一项测。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">上海市交通委员会的通报写得很清楚：这标志着线路由建设阶段，转入联调联试、试运行准备阶段。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">后面的顺序是：联调联试、空载试运行、初期运营。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">所以别急着等“首班车”。具体开通日期、票价、首末班时间，目前都还没公布。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1f2a2e;line-height:1.9;margin:0 0 26px;letter-spacing:0.8px;\">但可以确定的是，这条线已经不在图纸上了。</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#1a6b8c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a6b8c;margin:14px 0 22px;border-bottom:3px solid #1a6b8c;padding-bottom:9px;line-height:1.5;\">通车以后，临港人的日子</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">最直接的一笔账，是机场。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">从滴水湖北站上车，星海湾路、滨海森林公园、鹏翔路，第四站就是浦东3号航站楼。在T3接上机场联络线，往西就是虹桥。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">东支线那头连着上海东站。东方枢纽，也不再是地图上别人的事。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">第二笔账，是通勤。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">16号线也在动。官方说法是提升运能，争取非高峰时段再增开直达车，加密大站车班次。S2沪芦高速的拓宽改造，同样在推进。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">第三笔账，是日常。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">滴水湖青创湾要贯通10公里滨河慢行系统，官方给的说法，是打造临港“最美骑行道”。核心区公交站点500米覆盖率，目标是100%。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">一条线改变不了所有事。站点到家那最后一公里，公交接不接得上，才是每天的真实体感。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 26px;letter-spacing:0.5px;\">但方向是对的。临港终于开始从“交通末梢”，往“枢纽”那头挪了。</p>\n\n<p style=\"font-size:18px;font-weight:bold;color:#1a6b8c;line-height:1.9;margin:0 0 26px;letter-spacing:0.8px;\">对天天往返的人来说，省下的不只是几十分钟。是每天出门前，少算一次时间。</p>\n\n<p style=\"text-align:center;font-size:0;margin:30px 0 0;line-height:0;\"><img src=\"assets/dishui-towers.jpg\" style=\"max-width:100%;width:100%;display:block;\" alt=\"滴水湖西岛双子塔\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa4a9;line-height:1.7;margin:9px 0 34px;\">滴水湖西岛，双子塔立在湖面上。<br>新华社记者 方喆 摄</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">明年夏天，第一班车会从滴水湖北站的地下开出。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">它会穿过临港的工地、河道和新栽的行道树，一路开进浦东机场。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 28px;letter-spacing:0.5px;\">到那时，滴水湖到机场，就不再是一个要提前两小时出门的问题了。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">你最想坐这条线去哪儿？</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 22px;letter-spacing:0.5px;\">是赶一趟早班机，是去虹桥接人，还是单纯想看看，从滴水湖边上钻到地下是什么感觉。</p>\n\n<p style=\"font-size:16px;color:#3a3a3a;line-height:1.85;margin:0 0 34px;letter-spacing:0.5px;\">评论区聊聊。</p>\n\n<p style=\"font-size:12.5px;color:#9aa4a9;line-height:1.9;margin:0 0 8px;letter-spacing:0.2px;\">资料来源：上海市交通委员会、上海市政府新闻发布会（2026年8月21日）、上海市规划和自然资源局。</p>\n<p style=\"font-size:12.5px;color:#9aa4a9;line-height:1.9;margin:0 0 8px;letter-spacing:0.2px;\">文中通车时间为官方发布会口径，具体开通安排以运营单位公告为准。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
