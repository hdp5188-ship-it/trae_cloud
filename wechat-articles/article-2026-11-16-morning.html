<script id="post-data" type="application/json">
{
  "title": "热滑成功。临港到虹桥的一小时，进入倒计时",
  "account": "临港生活指北",
  "account_sub": "",
  "author": "临港生活指北",
  "date": "2026年11月16日 08:06",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">上周六晚上八点，滴水湖边又站满了人。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">六分钟的烟花，从湖面上打起来。手机举成一片，风一吹，外套都不太顶用。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">我靠在环湖一路的栏杆边，想的却是另一件事。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">离这儿几公里的地方，一条铁路刚跑完第一趟带电的检测车。</p>\n\n<p style=\"text-align:center;margin:28px 0 8px;\"><img src=\"assets/02-huanhu.jpg\" style=\"max-width:100%;width:100%;\"></p>\n\n<p style=\"text-align:center;font-size:12px;color:#9a9a9a;margin:0 0 26px;letter-spacing:0.5px;\">滴水湖环湖景观带 · 临港新片区管委会</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b7d;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b7d;margin:14px 0 22px;border-bottom:3px solid #0e6b7d;padding-bottom:9px;\">这条线，第一次自己跑起来了</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">10月19日，上海市交通委发了条消息，不算长，但分量很重。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">国庆假期期间，市域铁路南汇支线完成了首次热滑试验。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">热滑这个词，很多人看着陌生。说白了，就是接触网通电以后，让列车自己带电在轨道上跑一趟，把轨道、接触网、信号这些系统拉到真实状态里，看它们配不配合。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">这次跑得比较特别。检测车从机场联络线的浦东1号、2号航站楼站出发，经过3号航站楼站，再转进南汇支线的下盐路站、东大公路站，一路跑的是跨线路线。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">速度不快，60公里每小时。用的是新型全自动热滑检测车，边跑边测弓力、导高值、拉出值、硬点、拉弧。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#c24a2a;font-weight:bold;margin:24px 0;letter-spacing:0.5px;text-align:justify;\">修了这么久，这是第一趟有车在这条轨道上，靠自己跑起来。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">跑完这一趟，工程的性质就变了。不再只是土建工地，而是进入了联调联试和试运行准备。</p>\n\n<p style=\"font-size:15px;line-height:1.75;color:#555;margin:0 0 12px;padding-left:14px;border-left:3px solid #d8e6e9;letter-spacing:0.5px;\">2025年11月　主线结构贯通</p>\n\n<p style=\"font-size:15px;line-height:1.75;color:#555;margin:0 0 12px;padding-left:14px;border-left:3px solid #d8e6e9;letter-spacing:0.5px;\">2026年8月15日　主线和东支线全线结构贯通</p>\n\n<p style=\"font-size:15px;line-height:1.75;color:#555;margin:0 0 12px;padding-left:14px;border-left:3px solid #d8e6e9;letter-spacing:0.5px;\">2026年9月3日　664榀箱梁架设完成，供电工程受电启动</p>\n\n<p style=\"font-size:15px;line-height:1.75;color:#555;margin:0 0 12px;padding-left:14px;border-left:3px solid #d8e6e9;letter-spacing:0.5px;\">2026年国庆　首次热滑完成，转入联调联试</p>\n\n<p style=\"font-size:15px;line-height:1.75;color:#555;margin:0 0 26px;padding-left:14px;border-left:3px solid #0e6b7d;letter-spacing:0.5px;\">2027年7月　计划建成通车</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b7d;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b7d;margin:14px 0 22px;border-bottom:3px solid #0e6b7d;padding-bottom:9px;\">六个站，终点在湖的北面</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">南汇支线还有个名字，叫两港市域铁路。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">全长34.86公里，6座车站，设计最高时速160公里。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">主线27.88公里，从浦东T3航站楼站引出，经鹏翔路、滨海森林公园、星海湾路，到滴水湖北站。东支线6.98公里，从在建的上海东站接进鹏翔路站。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">终点站的名字起得实在，滴水湖北，位置就在湖的北面。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">真正有意思的节点在T3。它和机场联络线共站，轨道、信号、车辆制式都留了跨线运行的条件，两条线共用站台层。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">换句话说，从滴水湖上车，一路往虹桥方向去，中间不用拎着箱子下车换乘。技术上的口子，已经提前留好了。</p>\n\n<p style=\"text-align:center;margin:28px 0 8px;\"><img src=\"assets/01-dishui-lake.jpg\" style=\"max-width:100%;width:100%;\"></p>\n\n<p style=\"text-align:center;font-size:12px;color:#9a9a9a;margin:0 0 26px;letter-spacing:0.5px;\">滴水湖与临港城区 · 临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">8月21日的市政府发布会上，临港新片区管委会专职副主任唐浩把时间说得很明确：明年7月份，市域线南汇支线建成通车。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">同一天他还讲了一句很实在的话。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#4a4a4a;background:#f4f8f9;border-left:4px solid #0e6b7d;padding:16px 18px;margin:0 0 22px;letter-spacing:0.5px;\">临港从区位上看现在是交通末梢。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">末梢这两个字，住在这儿的人大概都懂。去一趟人民广场，地铁坐到底；去虹桥赶飞机，自驾一个半小时起步，遇上早高峰，两个小时都算正常。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">南汇支线要解决的，就是这个。建成后，滴水湖到浦东机场、上海东站、虹桥枢纽，都会进入一小时级别的通行范围。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b7d;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b7d;margin:14px 0 22px;border-bottom:3px solid #0e6b7d;padding-bottom:9px;\">通车之前，滴水湖的周末已经变了</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">铁路还在联调，湖边的日子倒是先热闹起来了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">烟花秀从今年1月1日起常态化，每周六晚8点，六分钟，免费，环湖一圈都能看。中秋、国庆这种节点还会加场。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">9月的环上海自行车赛，奉贤—南汇赛段100.2公里，赛道一直延伸到滴水湖这一带。同期湖畔还有骑行嘉年华，无人机表演和烟花一起上。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">往后的清单更长：滴水湖青创湾10公里滨河慢行系统在推进，要打造成临港的“最美骑行道”；国家级旅游度假区在创建；帆船公开赛、滑雪锦标赛都要接着办。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">滴水湖运动中心一期工程，今年5月底公示过设计方案。滴水湖幸福河湖建设工程的涉河方案，年初也拿了批复。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#c24a2a;font-weight:bold;margin:24px 0;letter-spacing:0.5px;text-align:justify;\">临港这几年最明显的变化，不是楼变高了，是周末不用非得往市区跑了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">当然，日常通勤还是得靠16号线。官方也在补：非高峰时段争取再增开直达车，大站车班次加密。S2沪芦高速的拓宽改造，也在同步推进。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b7d;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b7d;margin:14px 0 22px;border-bottom:3px solid #0e6b7d;padding-bottom:9px;\">这个周六，可以这样走</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/03-xingkong.jpg\" style=\"max-width:100%;width:100%;\"></p>\n\n<p style=\"text-align:center;font-size:12px;color:#9a9a9a;margin:0 0 26px;letter-spacing:0.5px;\">星空之境海绵公园 · 临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">如果你这周想来看看，路线不复杂。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">下午三点前后到，先沿环湖一路走一段。湖面开阔，风一直在，走累了找张长椅坐会儿，比在商场里逛舒服。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">想动一动，就租辆车绕湖。一圈八公里出头，慢骑一个小时，刚好在天黑前回到出发点。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">七点半以后，人开始往湖边聚。不用挤中心位置，环湖一圈视线都不错。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">八点整，六分钟。看完别急着走，散场那会儿地铁站最挤。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">最后一句提醒：湖边风大，十一月了，外套带厚一点。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">三年前，有人在本地论坛问，临港什么时候才能不像“上海的尽头”。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">底下最高赞的回复只有一句：等南汇支线通了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 20px;letter-spacing:0.5px;text-align:justify;\">明年7月，这句话该有个答案了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:32px 0 8px;letter-spacing:0.5px;text-align:justify;\">通车那天，你最想坐着它去哪儿？评论区聊聊。</p>\n\n<p style=\"font-size:13px;line-height:1.7;color:#9a9a9a;margin:28px 0 0;letter-spacing:0.5px;text-align:justify;\">资料来源：上海市交通委员会、上海市政府新闻发布会（2026年8月21日）、临港新片区管委会</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">临港生活指北</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
