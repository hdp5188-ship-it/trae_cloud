<script id="post-data" type="application/json">
{
  "title": "骑完40公里，导航给我画了根棒棒糖",
  "account": "滴水湖生活指北",
  "account_sub": "",
  "author": "滴水湖生活指北",
  "date": "2026年11月19日 08:13",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">十一月的第一个周末，一张导航轨迹在社交平台上刷了屏。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">不是心形，也不是什么小动物，就是一根端端正正的棒棒糖。圆圈是滴水湖，斜插出来的那一截糖棍，是沿海港大道去上海海事大学的那段往返。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">全程40公里，骑完一圈，导航自己给你画了颗糖。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 26px;letter-spacing:.4px;\"><strong style=\"color:#b23a2f;\">上海的“秋日骑行天花板”，就这么被网友按在了临港。</strong></p>\n\n<p style=\"margin:0 0 0;text-align:center;\"><img src=\"assets/dishui-lake-bridge.png\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:10px 0 34px;line-height:1.6;\">滴水湖环湖景观桥。图源：上观新闻</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">这条线，到底怎么走</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">起点建议放在滴水湖洲际酒店，顺时针走。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">环湖一路是风景最好的一段。左手是湖，右手是草坪和桥，路面平，视线开阔，骑起来不太需要动脑子。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">骑到海港大道，拐出去往南，一路到上海海事大学，再原路折回来。这一来一回，就是那根“糖棍”。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">整条线基本没有大坡，真正的变量是风。临港靠海，风一起来，平路也能骑出爬坡的感觉。</p>\n\n<p style=\"background:#f5f8fc;border-left:3px solid #0a84ff;padding:18px 20px;margin:0 0 26px;font-size:14px;line-height:2;color:#4a4a4a;letter-spacing:.3px;\">\n路线：洲际酒店 → 环湖一路 → 一尺花园 → 壹号码头 → 朵云书院 → 海港大道 → 环湖二路 → 春花秋色公园 → 星空之境海绵公园 → 中国航海博物馆 → 南汇新城城市公园 → 环湖三路 → 上海天文馆 → 临港少年宫 → 海港大道 → 上海海事大学 → 折返\n</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">沿途设了共享单车点位。<strong>骑不动就随时收，没人规定40公里必须一次骑完。</strong></p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">值得捏闸停下的几个地方</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\"><strong>一尺花园</strong>在西岸，1500平方米，藏书六千多本。整面玻璃对着湖，晴天下午坐进去，会有一瞬间以为自己不在上海。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">它家的晚霞位，被网友叫作“济州岛分岛”。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\"><strong>壹号码头</strong>是另一种气质。水泥的伞状框架往湖面伸出去，大台阶一级一级落下来，风大，人少，拍照几乎不用等机位。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">天气好的时候，湖蓝得不像湖，像海。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\"><strong>朵云书院</strong>在环湖西一路，5000平方米，三层。20米高的通天书架从底下一直顶上去，7万册书顺着台阶铺开。落地窗外面就是湖，低头看书，抬头看水。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\"><strong>春花秋色公园</strong>适合十一月来。圆滚滚的地肤草正由绿转红，一片一片铺在水岸边，芦苇穗子被风吹得发白。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">再往前，星空之境、上海天文馆、中国航海博物馆排成一线。带孩子的，随便挑一个进去都能耗掉半天。</p>\n\n<p style=\"margin:0 0 0;text-align:center;\"><img src=\"assets/dishui-lake-cycling-love.png\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:10px 0 34px;line-height:1.6;\">滴水湖岸边的骑行道。图源：上观新闻</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">环湖还有七座景观桥，从赤风港到紫飞港，七座七种颜色。骑过去的时候不用特意找，一座接一座自己就来了。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">不骑车的人，晚上八点来</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">滴水湖的烟花，2026年起是常态化的。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">每周六以及部分节假日，晚上20:00，环湖景观带。一场六分钟，免费，不用预约，到点抬头就行。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">想看楼和光影一起入画，往东侧、南侧岸线走。只想看烟花，环湖随便找块草坪坐下，360度没有遮挡。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">地铁16号线到滴水湖站，出站走几分钟就到湖边。自驾的话，环湖景观带部分停车场有10元一天的优惠。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">遇上特殊天气会取消，公告提前发在“Hi临港”公众号上，出门前刷一眼。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\"><strong style=\"color:#b23a2f;\">还有一句要啰嗦：滴水湖大部分亲水岸线没有围栏，看烟花别只顾抬头。</strong></p>\n\n<p style=\"margin:0 0 0;text-align:center;\"><img src=\"assets/dishui-autumn-kochia.png\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;color:#9a9a9a;text-align:center;margin:10px 0 34px;line-height:1.6;\">秋日的滴水湖二环城市公园。图源：上观新闻</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">几句实在话</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">周末拍照的人多，想拍空镜，8点半前出发。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">防风手套和面巾带上。东港大道到观海公园那段有缓坡，秋天早晨有露水，路面滑，下坡收着点。起雾的早上记得开前灯。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">时间上，十一月中下旬是最舒服的窗口。再晚，风就更硬了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">临港的“十五五”规划里写了一句，要以滴水湖旅游度假区为核心，创建国家级旅游度假区。翻译成人话：接下来几年，这片湖边的配套只会越来越密。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">所以现在去，刚刚好。人还没多到要排队，景已经修得很像样。</p>\n\n<p style=\"background:#faf7f2;padding:22px 22px;margin:8px 0 26px;font-size:16px;line-height:1.9;color:#5a4a3a;letter-spacing:.4px;\">我一直觉得，一座城市好不好玩，不看它有多少地标，看它有没有一条让人愿意周末早起、骑上四十公里的路。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">滴水湖这条，算一条。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 22px;letter-spacing:.4px;\">你手机里有没有一张骑出来的、形状很奇怪的轨迹？评论区发出来，看看谁的更离谱。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#b0a99c;letter-spacing:2px;margin:40px 0 0;\">— END —</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || '滴水湖生活指北';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
