<script id="post-data" type="application/json">
{
  "title": "滴水湖北岛，那座粉紫色的美术馆开了",
  "account": "滴水湖生活指北",
  "account_sub": "",
  "author": "滴水湖生活指北",
  "date": "2026年11月20日 07:30",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 0;\"><img src=\"assets/cover-lingang-art-museum.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;margin:9px 0 0;line-height:1.6;\">滴水湖北岛肆号美术馆。摄影：Keroro / 澎湃号·ShanghaiLOOK</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:30px 0 0;\">滴水湖最北边那个岛，很多上海人骑车路过，但没上去过。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:16px 0 0;\">岛上有一栋楼，空了很久，灰扑扑的，像工地忘了收尾。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:16px 0 0;\">今年秋天，它变成了一座美术馆。粉紫色。</p>\n<p style=\"font-size:22px;line-height:1.7;color:#b0527a;font-weight:bold;margin:16px 0 0;\">还免费。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#c9a6b4;margin:54px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2b2b2b;margin:12px 0 26px;line-height:1.5;\">空了很久的4号楼</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">北岛是滴水湖三座岛里最安静的一座。南岛有绿地，西岛是金融湾，北岛很早就被规划成「文化艺术之岛」——喊了几年，一直没什么动静。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">肆号美术馆的前身，就是北岛上长期闲置的肆号建筑。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">改造之后，四间纯白展厅拼成主体，屋顶做成粉紫渐变的阶梯，四角往上翘。从空中俯瞰，像一朵散开的花。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">整个场地2980平方米。不大。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">但对一座镇级美术馆来说，这个体量刚刚好——不用走断腿，一小时能看完，看累了出门就是湖。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#c9a6b4;margin:54px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2b2b2b;margin:12px 0 26px;line-height:1.5;\">四个展，一张票都不用买</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">进门第一件让人意外的事：不要钱。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">入口现场预约就能进，四个展览同时开放。常设展厅、特展厅、数字展厅、美育空间，一样不缺。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong style=\"color:#b0527a;\">免费，现场约，周一闭馆。</strong>这三条记牢，能省一趟冤枉路。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">开馆特展叫《长亭外》，讲李叔同。15件史料，从富贵少年讲到名士风华，再讲到弘一法师。展厅里放的是朴树翻唱的《送别》，循环放。走完一圈，歌差不多也听完了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">隔壁常设展厅是「纷与寂」，展弘一大师的手书遗墨——手稿、信札、题跋，35幅，会定期更换。也就是说，隔几个月再来一趟，看到的东西不一样。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">两个展摆在一起是有讲究的。策展人浦泉耀说，美术馆的建筑气质和弘一大师的精神有呼应，「纷与寂」这个名字就是这么来的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">《长亭外》展到2027年1月23日。想过年前去，时间还够。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">另外两个展轻松得多。一个是《透过阳光》，雕塑家杨科朋用泥土塑出小孩阿布，让他躺在云上；绿植艺术家陈涛在四周做了一座活的森林。天气好时，光从枝叶间漏下来。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">还有一个数字展厅，人走进去，雷达捕捉轨迹，屏幕里的小动物跟着你动。带小孩的话，这一个厅能耗掉半小时。</p>\n\n<p style=\"text-align:center;margin:26px 0 0;\"><img src=\"assets/exhibition-changtingwai.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;margin:9px 0 0;line-height:1.6;\">《长亭外——李叔同（弘一大师）生平特展》展厅。摄影：Keroro / 澎湃号·ShanghaiLOOK</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#c9a6b4;margin:54px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2b2b2b;margin:12px 0 26px;line-height:1.5;\">屋顶才是重头戏</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">如果看完展就走，等于白来一半。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">从建筑外侧的草坡上去，有一串马卡龙色的台阶，一路通到屋顶露台。粉紫渐变由深到浅，走到顶上，颜色快和天空接上了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">露台能看湖。滴水湖是个正圆，直径6.66公里。站在北岛往南望，对岸就是金融湾，那四栋楼上面架着一个直径153米的圆环——荣耀之环。夜里亮起《四时风物》灯光秀，一圈金色浮在楼顶。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">傍晚最好。太阳落下去，湖面的颜色一层层变。露台上碰到节假日，还会办「樱顶落日LIVE音乐会」，不定期，撞上算运气。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\"><strong style=\"color:#b0527a;\">别从正门绕，草坡上去最近。</strong>这是本地人才知道的那条路。</p>\n\n<p style=\"text-align:center;margin:26px 0 0;\"><img src=\"assets/roof-steps.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;margin:9px 0 0;line-height:1.6;\">屋顶的马卡龙色阶梯，往上走能看到整片滴水湖。摄影：Keroro / 澎湃号·ShanghaiLOOK</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#c9a6b4;margin:54px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2b2b2b;margin:12px 0 26px;line-height:1.5;\">去之前，记住这几条</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3a3a3a;background:#fbf1f4;padding:22px 20px;border-radius:10px;margin:0 0 10px;\"><strong style=\"color:#b0527a;\">地址</strong>　浦东新区环湖北一路，滴水湖北岛4号</p>\n<p style=\"font-size:15px;line-height:2;color:#3a3a3a;background:#fbf1f4;padding:22px 20px;border-radius:10px;margin:0 0 10px;\"><strong style=\"color:#b0527a;\">门票</strong>　免费，入口现场预约</p>\n<p style=\"font-size:15px;line-height:2;color:#3a3a3a;background:#fbf1f4;padding:22px 20px;border-radius:10px;margin:0 0 10px;\"><strong style=\"color:#b0527a;\">时间</strong>　周二至周四 10:00—18:00　周五至周日 10:00—21:00　周一闭馆</p>\n<p style=\"font-size:15px;line-height:2;color:#3a3a3a;background:#fbf1f4;padding:22px 20px;border-radius:10px;margin:0 0 10px;\"><strong style=\"color:#b0527a;\">交通</strong>　地铁16号线滴水湖站，出站沿环湖北一路往北，骑车可达</p>\n<p style=\"font-size:15px;line-height:2;color:#3a3a3a;background:#fbf1f4;padding:22px 20px;border-radius:10px;margin:0 0 26px;\"><strong style=\"color:#b0527a;\">安排</strong>　看展一小时，屋顶拍照半小时，加往返，留半天</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">临港这两年一直在往湖边加东西。金融湾的荣耀之环，滴水湖运动中心6.7万平方米的工地，幸福河湖工程，都还在往前赶。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:0 0 18px;\">上一次去滴水湖，你可能只是换乘16号线。下一次，可以留出半天。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333;margin:34px 0 0;\">你上次去滴水湖是什么时候？评论区聊聊。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#6b6b6b;margin:16px 0 0;\">如果这篇有用，转给那个总说上海没地方去的朋友。</p>\n"
}

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
