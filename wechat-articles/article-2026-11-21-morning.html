<script id="post-data" type="application/json">
{
  "title": "南汇支线热滑完成，临港人等这条线等太久了",
  "account": "临港生活观察",
  "account_sub": "",
  "author": "临港生活观察",
  "date": "2026年11月21日 08:07",
  "location": "上海",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 6px;text-align:center;\"><img src=\"assets/cover-dishuihu-hub.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa3ad;line-height:1.6;margin:0 0 30px;\">滴水湖公交枢纽，白玉兰造型的屋顶对着湖面。新华社记者 方喆 摄</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">早上七点半，16号线滴水湖站。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">车门一开，人往里挤，背双肩包的得侧着身子才进得去。有人靠着门边补觉，有人低头刷手机，屏幕上多半是通勤打卡的倒计时。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">这是很多临港人的早晨。先坐到龙阳路，再换2号线，去浦东机场还得在广兰路再倒一次。一趟下来，一个多小时。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">11月的滴水湖，风已经有点凉了。湖面上偶尔有鸟贴着水飞过去，环湖的树还是绿的。看上去什么都没变。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 28px;\">但高架上，有一条线已经在动了。</p>\n\n<p style=\"background:#f4f7fa;border-left:4px solid #12639e;padding:16px 18px;font-size:15px;line-height:1.85;color:#333;margin:0 0 24px;\">10月19日，上海市交通委发布消息：国庆假期期间，市域铁路南汇支线完成首次热滑试验。线路正式由建设阶段，转入联调联试和试运行准备阶段。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">热滑这个词，听着有点专业。说白了，就是让检测车带着电，在新建的轨道上实跑一遍，看轨道、接触网、信号这些系统配不配合。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">这次跑得不慢，时速60公里。用的还是全自动热滑检测车，一路测弓网压力、导高、拉弧这些指标。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">和一般的单线测试不一样。检测车从机场联络线浦东1号、2号航站楼站出发，经过3号航站楼站，再拐进南汇支线的下盐路站、东大公路站，跨着线跑了一整圈。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#12639e;\">能跨线跑，说明两套系统接得上。</strong>这句话，比任何效果图都实在。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;background:#12639e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#12639e;margin:14px 0 24px;border-bottom:3px solid #12639e;padding-bottom:9px;\">一条Y形的线，六个站</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">南汇支线还有个名字，叫两港市域铁路。全长34.86公里，设6座车站。</p>\n\n<p style=\"font-size:0;text-align:center;margin:6px 0 26px;\">\n<span style=\"display:inline-block;width:100px;margin:0 4px;background:#f4f7fa;padding:16px 0;text-align:center;border-radius:8px;\"><span style=\"display:block;font-size:23px;font-weight:bold;color:#12639e;line-height:1.2;\">34.86</span><span style=\"display:block;font-size:12px;color:#7a8794;margin-top:6px;\">公里 全长</span></span><span style=\"display:inline-block;width:100px;margin:0 4px;background:#f4f7fa;padding:16px 0;text-align:center;border-radius:8px;\"><span style=\"display:block;font-size:23px;font-weight:bold;color:#12639e;line-height:1.2;\">6</span><span style=\"display:block;font-size:12px;color:#7a8794;margin-top:6px;\">座 车站</span></span><span style=\"display:inline-block;width:100px;margin:0 4px;background:#f4f7fa;padding:16px 0;text-align:center;border-radius:8px;\"><span style=\"display:block;font-size:23px;font-weight:bold;color:#12639e;line-height:1.2;\">160</span><span style=\"display:block;font-size:12px;color:#7a8794;margin-top:6px;\">公里 最高时速</span></span>\n</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">形状是个Y。主线从浦东T3航站楼站引出，一路向南，到临港新片区的中央活动区；支线从上海东站出发，在下盐路站并进主线。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">6个站分别是：T3航站楼站、上海东站、下盐路站、东大公路站、临港综合区站、临港开放区站。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">前面两个是接轨站，后面四个是新设的。平均站间距6.85公里，最大的一段有15.78公里——这也正常，市域铁路本来就不是地铁，站少、跑得快。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">列车最高运行时速160公里。拿这个跟16号线比一下，就知道临港人为什么盼它。</p>\n\n<p style=\"text-align:center;margin:36px 0 0;\"><img src=\"assets/nanhui-line-viaduct.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa3ad;line-height:1.6;margin:8px 0 34px;\">2026年8月31日，建设中的南汇支线高架。解放日报记者 孟雨涵 摄</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;background:#12639e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#12639e;margin:14px 0 24px;border-bottom:3px solid #12639e;padding-bottom:9px;\">临港人等的是什么</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">现在从临港去浦东机场，最顺的走法是16号线到龙阳路，换2号线，再到广兰路换一次。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">拎着箱子换两次地铁，是什么体验，赶过早班机的人都懂。电梯前排队，闸机口找卡，站台上还要再等一程。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">南汇支线通车后，从临港开放区站上车，可以直接到T3航站楼，也能到上海东站。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">上海东站不是个普通车站。它是东方枢纽的核心，紧挨着浦东机场。以后从临港出发，往北坐高铁，往东上飞机，都在这一片解决。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">还有一层，很多人没注意到。这条线接的是市域铁路网，不是孤零零一条线。机场联络线、南枫线，往后都能连起来。</p>\n\n<p style=\"font-size:20px;line-height:1.75;color:#12639e;font-weight:bold;margin:32px 0 32px;\">一条线通了，是一回事。<br>一张网织起来，是另一回事。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;background:#12639e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#12639e;margin:14px 0 24px;border-bottom:3px solid #12639e;padding-bottom:9px;\">时间表，和那些还没定的</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">把几个节点摆在一起，进度就清楚了。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333;margin:0 0 10px;\"><strong style=\"color:#12639e;\">8月15日</strong>&nbsp;&nbsp;全线结构贯通，最后一榀箱梁落位。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333;margin:0 0 10px;\"><strong style=\"color:#12639e;\">9月3日</strong>&nbsp;&nbsp;全线箱梁架设完成；下盐路牵引变电所至临港开放区区段受电启动。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333;margin:0 0 10px;\"><strong style=\"color:#12639e;\">国庆假期</strong>&nbsp;&nbsp;首次热滑试验完成，转入联调联试。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333;margin:0 0 24px;\"><strong style=\"color:#12639e;\">2027年7月</strong>&nbsp;&nbsp;计划建成通车。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">最后这个时间，出自8月21日的市政府新闻发布会。临港新片区管委会专职副主任唐浩在会上说得很明确：明年7月份，市域线南汇支线将建成通车。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">但计划就是计划。热滑之后，还有联调联试、试运行、安全评估，一环扣一环。哪一环卡住，时间都要往后挪。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#b3392f;\">计划通车和真正通车之间，隔着一整套验收。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">所以现在能确定的，是这条线已经跑起来了，剩下的交给时间。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;background:#12639e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#12639e;margin:14px 0 24px;border-bottom:3px solid #12639e;padding-bottom:9px;\">不只是这一条线</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">那场发布会上，还有几句和日常出行有关的话，容易被忽略。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;\">16号线要提升运能，争取在非高峰时段再增开直达车，加密大站车的班次。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;\">S2沪芦高速要拓宽改造。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;\">核心区建成区的公交站点，500米覆盖率要做到100%。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 24px;\">还有一条听着很舒服的：滴水湖青创湾10公里滨河慢行系统，要打造成“最美骑行道”。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">对住在滴水湖的人来说，最后这一公里，可能比一条市域铁路更常用。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">下班从地铁站出来，扫一辆车，沿湖骑回家。风大一点，但路上没什么车，前面是水面，头顶是刚亮起来的路灯。</p>\n\n<p style=\"text-align:center;margin:36px 0 0;\"><img src=\"assets/dishuihu-lakeside.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9aa3ad;line-height:1.6;margin:8px 0 34px;\">滴水湖公交枢纽旁的亲水平台，湖对岸是临港的天际线。新华社记者 方喆 摄</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">傍晚的滴水湖，环湖步道上有人遛狗，有人跑步，有人坐在台阶上发呆。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">16号线滴水湖站的末班车还没到，站台上人已经不多了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 28px;\">再过几个月，这里的出行方式会多一个选项。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;\">你现在从临港进城，一般怎么走？路上要花多久？评论区聊聊，说不定能给刚搬来的新邻居指条路。</p>\n\n<p style=\"font-size:13px;line-height:1.8;color:#9aa3ad;margin:36px 0 0;border-top:1px solid #e8ebee;padding-top:16px;\">资料来源：上海市交通委员会、上海市政府新闻发布会（2026年8月21日）、上海发布、解放日报·上观新闻。本文写于2026年11月21日，后续进展以官方发布为准。</p>\n"
}

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
