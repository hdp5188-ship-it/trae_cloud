<script id="post-data" type="application/json">
{
  "title": "滴水湖又上新了：免费美术馆，粉紫阶梯一路铺到屋顶",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月22日 08:10",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"background:#f8f3f5;padding:14px 16px;border-radius:6px;font-size:14px;color:#6b5560;line-height:1.8;margin:0 0 30px;\">临港滴水湖北岛，一栋闲置多年的建筑改成了美术馆，正式开馆：四间纯白展厅、粉紫渐变的屋顶阶梯，四个展全部免费。李叔同生平特展展到2027年1月23日，周五、周六开到晚上九点。地址和预约方式，都帮你整理好了。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">滴水湖又添新邻居了。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">这回不是摩天轮，也不是酒店——是一座美术馆。<strong>北岛肆号美术馆</strong>，10月下旬正式开馆，就立在滴水湖北岛的湖边。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">它原先只是北岛上一栋闲置多年的肆号建筑，空了好些年。改造完，成了2980平方米的艺术空间，临水而立，白色大檐四角翘起，像一面扬起来的帆。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">屋顶最有看头。四间纯白展厅错落着，中间的阶梯刷成粉紫渐变，从深到浅，一路过渡到天空底下去。从空中俯瞰，像一片散开的花瓣。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/beidao-roof.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999999;margin:0 0 28px;\">北岛肆号美术馆的粉紫色大檐，四角翘起像扬起的帆｜图源：澎湃新闻·湃客号 ShanghaiLOOK</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">开馆的时间点也有点巧。10月23日，李叔同（弘一法师）诞辰146周年纪念日，他的手书遗墨展就在这座新馆里开展。新华网的报道里写，展览分常设展和《长亭外》特展两部分，一共50幅藏品。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">一座\"镇级美术馆\"，说大不大。但对南汇新城镇来说，它补上的是身边没有艺术馆的空缺——看展这件事，从\"进趟市区\"变成了\"环湖骑车顺一脚\"。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#2b2b2b;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b3446c;margin:8px 0 26px;\">那栋白房子，扬起了帆</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">沿湖骑行进北岛，先撞见的是一片大草坡。坡上立着巨大的LINGANG立体字，蓝天湖景做背景，怎么拍都不出错。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">顺着草坡上马卡龙色的台阶往上走，就到了屋顶观景露台。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">站上去，看湖的角度就不一样了。滴水湖畔的草木颜色都在脚边，那座S型的白色步桥像条丝带，把湖畔绿地一节一节串起来。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/beidao-stairs.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999999;margin:0 0 28px;\">屋顶粉紫渐变阶梯，站上去正好借景看湖｜图源：澎湃新闻·湃客号 ShanghaiLOOK</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">屋顶阶梯高低错落，找机位很容易，随手一拍就是氛围感大片。逛累了，草坪上吹吹湖风，松弛感是现成的。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">还有个事，很多人不知道：节假日，这个露台会不定期办<span style=\"background:#f3e3ec;color:#b3446c;padding:1px 5px;border-radius:3px;\">\"樱顶落日live\"音乐会</span>。落日、湖风、现场音乐，一场全齐。加上周五到周日闭馆时间延到晚上九点——想赶晚霞场的，来得及。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#2b2b2b;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b3446c;margin:8px 0 26px;\">四个展，都是免费的</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">美术馆虽小，展览一点不含糊：常设展厅、特展厅、数字展厅、美育空间，四个展区现在都有展。</p>\n\n<p style=\"text-align:center;font-size:17px;font-weight:bold;color:#b3446c;margin:32px 0;\">免费，是真的免费——四个展，一个都不收钱。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">开馆特展《长亭外》，讲的是李叔同的一生。展览名字取自他写的《送别》，15件史料，把人从富贵年少、名士风华，一路带到弘一法师。展厅里放着朴树翻唱的那版《送别》，背景音乐和一个人的一生叠在一起，走到出口，正好是他留下的最后四个字：悲欣交集。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">这一站看到<strong>2027年1月23日</strong>，不急，但值得趁早。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/xinhua-zhanting.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999999;margin:0 0 28px;\">《长亭外》特展一隅｜新华网 史依灵 摄</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">常设展厅叫\"纷与寂\"，挂的是弘一大师的手书遗墨——手稿、信札、题跋，35幅，会定期更换，常看常新。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">直面湖景的那间展厅在展\"透过阳光\"。雕塑家用泥土塑了个小孩，让他静止在云朵上；绿植艺术家搭了一座活的森林。这间屋子平时也是公教活动的美育空间，带娃去正合适。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">最里头还有一间数字展厅，会动。全景视频绕着整个屋子走，人一动，雷达就捕捉到轨迹，屏幕里的小动物跟着你跑。小孩进去，大概率赖着不肯走。</p>\n\n<p style=\"background:#faf6f8;border-left:3px solid #d9a5bc;padding:12px 16px;font-size:14px;color:#5a4a52;line-height:1.9;margin:28px 0;\">策展人浦泉耀说，这座美术馆的建筑设计，和弘一大师的精神气质是呼应的——所以常设展才定名\"纷与寂\"。<br>房子修得再花哨，真正让人停下来的，还是安静的笔墨，和窗外那片湖。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#2b2b2b;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b3446c;margin:8px 0 26px;\">想去的话，把这几条收好</p>\n\n<p style=\"background:#fafafa;border-left:4px solid #b3446c;padding:14px 18px;font-size:14px;line-height:2.1;color:#4a4a4a;margin:0 0 26px;\"><strong>地址</strong>：滴水湖北岛4号（浦东新区环湖北一路）<br><strong>门票</strong>：免费，场馆入口现场预约即可<br><strong>开放时间</strong>：周二至周四 10:00–18:00；周五至周日 10:00–21:00<br><strong>提醒</strong>：每周一闭馆，别白跑<br><strong>交通</strong>：地铁16号线滴水湖站下，环湖骑行过去很方便；自驾导航\"滴水湖北岛\"</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">说句实话，这家馆面积不大，别抱着逛省级大展的期待去。专程从市区打个来回，只为这一个馆，有点亏。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">但要是把它排进动线——上午天文馆，下午北岛看展，傍晚环湖骑车等一场落日，这一天就立住了。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">这几年滴水湖一直在添新东西。天文馆、耀雪、海昌，一座比一座热闹。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">可临港最舒服的，从来不只是这些打卡点。是湖风，是草坪，是傍晚环湖路上那点松弛劲儿。美术馆盖在湖边，算是把这层意思盖明白了。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#3f3f3f;margin:0 0 20px;\">你上回去滴水湖，是什么时候？评论区聊聊。打算周末去北岛看展的，也蹲一个同行搭子。</p>\n"
}

  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
