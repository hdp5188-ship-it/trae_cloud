<script id="post-data" type="application/json">
{
  "title": "骑完40公里“棒棒糖”，刚好赶上滴水湖晚上8点的烟花",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月23日 08:03",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;line-height:1.9;color:#6b6b6b;text-align:left;margin:0 0 8px;\">上海入冬前最后一段舒服的日子，别都耗在市区排队。</p>\n<p style=\"font-size:15px;line-height:1.9;color:#6b6b6b;text-align:left;margin:0 0 8px;\">往东南开一小时，滴水湖边有条被骑友叫作“棒棒糖”的40公里环线。</p>\n<p style=\"font-size:15px;line-height:1.9;color:#6b6b6b;text-align:left;margin:0 0 28px;padding-bottom:24px;border-bottom:1px solid #ececec;\">骑完，天差不多黑了。每周六晚8点，湖上还有20分钟的光影烟花。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">周六早上八点半，如果你在滴水湖洲际酒店门口停一下，会看见一排公路车。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">有人蹲在路边给轮胎打气，有人把面巾往上拉了拉。风从湖面上过来，带一点水腥味，吹得旗子啪啪响。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">这是“棒棒糖”线的标准起点。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/dishui-lake-boat.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999999;line-height:1.6;margin:10px 0 34px;\">滴水湖上的游船与远处的临港天际线。图片来源：临港新片区管委会</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#0f6b7d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">01</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f6b7d;line-height:1.5;margin:14px 0 24px;padding-bottom:9px;border-bottom:3px solid #0f6b7d;\">一条像棒棒糖的环湖线</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">名字是骑友取的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">环湖主圈是圆圆的糖身，沿海港大道往返上海海事大学的那一段，是长长的糖棍。全程<span style=\"background:#fff6d9;color:#8a5300;padding:1px 4px;\">40公里</span>。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">从洲际酒店出发，顺时针骑。环湖一路风景最好，左边是湖，右边是树，路面平，车也少。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">骑完一整圈，导航轨迹拉出来，真的是一支棒棒糖。</p>\n\n<p style=\"border-left:4px solid #c25a2e;background:#fbf7f3;padding:16px 20px;margin:26px 0;font-size:15px;line-height:1.9;color:#5a4a42;text-align:left;\">前阵子“小猪路线”火过一轮。这条“棒棒糖”，是上海秋天藏得比较深的那条，知道的人还没那么多。</p>\n\n<p style=\"background:#f6f4ef;border-left:4px solid #0f6b7d;padding:18px 20px;margin:28px 0 32px;font-size:14px;line-height:1.95;color:#444444;text-align:left;\"><strong>路线</strong>｜洲际酒店 → 环湖一路 → 一尺花园 → 壹号码头 → 朵云书院 → 海港大道 → 环湖二路 → 春花秋色公园 → 星空之境海绵公园 → 中国航海博物馆 → 南汇新城城市公园 → 环湖三路 → 上海天文馆 → 临港少年宫 → 海港大道 → 上海海事大学 → 洲际酒店<br><strong>全长</strong>｜约40公里<br><strong>方向</strong>｜顺时针<br><strong>路况</strong>｜环湖绿道通畅，沿途设共享单车点位</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#0f6b7d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">02</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f6b7d;line-height:1.5;margin:14px 0 24px;padding-bottom:9px;border-bottom:3px solid #0f6b7d;\">值得停下来的几站</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0f6b7d;line-height:1.8;margin:34px 0 30px;\">这条线最舒服的地方，是它不催你。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">骑累了就停。湖边长椅很多，随便找一段坐下，看水就行。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\"><strong>一尺花园</strong>在西岸，1500平方米，像一朵浮在码头上的白云。里面是书店、绿植、艺术和咖啡，收了六千多本书。二楼临窗的位置正对湖面，坐下去很难再站起来。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">再往前是<strong>壹号码头</strong>。半开放的结构，线条一直伸到湖面，大片阶梯可以随便坐。天气好的时候，水蓝得不太像湖，倒像海。有人管这里叫“临港版 lalaland”。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/yihao-pier.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999999;line-height:1.6;margin:10px 0 34px;\">傍晚的滴水湖一号码头。图片来源：临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\"><strong>朵云书院</strong>也在湖边。5000平方米，三层，20米高的通天书架从地面往上长，7万册书顺着阶梯铺开。落地窗外就是湖，书架往上长，湖在窗外铺开，坐着坐着就忘了时间。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">继续骑，会经过<strong>春花秋色公园</strong>。深秋的地肤草从绿转红，一丛一丛铺在水边；芦苇白了头，风一过，整片倒向一边。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">再往前，画风突然变科幻。<strong>星空之境海绵公园</strong>里全是异形建筑，星际迷宫、观天之丘，随手一拍都像电影布景。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">时间够的话，中国航海博物馆和上海天文馆都值得单独留半天。天文馆是全球规模最大的天文主题博物馆，圆洞天窗、倒转穹顶和球幕影院是三个必看。</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#0f6b7d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">03</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f6b7d;line-height:1.5;margin:14px 0 24px;padding-bottom:9px;border-bottom:3px solid #0f6b7d;\">天黑了，别急着回</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">骑到傍晚，很多人习惯直接往地铁站赶。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">先别走。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">每周六晚上8点，滴水湖有一场固定的光影烟花秀，名字叫“临港时刻·时光之戒”。<strong>14分钟无人机，6分钟烟花，一共20分钟。</strong>无人机在湖面上方排成各种图案，烟花压轴。演出跟着十二月令的花走，一个月一种花，一个月一句花语。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">滴水湖旅游度假区一共17.82平方公里，目标是千万级客流。这几年环湖的配套一直在补，书店、码头、驿站，一站一站连了起来。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/light-show.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#999999;line-height:1.6;margin:10px 0 34px;\">滴水湖光影秀。图片来源：临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">观赏位置不用抢。<span style=\"font-weight:bold;color:#c25a2e;\">环湖一圈都能看见</span>，找湖面开阔的一段，烟花和倒影能一起进画面。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">唯一的变量是天气。大风、大雨会调整时间，出门前看一眼“上海临港”或者“Hi临港”的公众号，比问谁都准。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">散场时人会多，地铁16号线返程记得留点余量，别卡着末班车。</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#0f6b7d;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">04</span></p>\n<p style=\"font-size:21px;font-weight:bold;color:#0f6b7d;line-height:1.5;margin:14px 0 24px;padding-bottom:9px;border-bottom:3px solid #0f6b7d;\">出发前，几件小事</p>\n\n<p style=\"background:#f6f4ef;border-left:4px solid #0f6b7d;padding:18px 20px;margin:26px 0 30px;font-size:14px;line-height:2;color:#444444;text-align:left;\">· 湖边风大，防风手套和面巾别省。<br>· 周末拍照的人多，想清净，8:30前出发。<br>· 东港大道到观海公园有一段缓坡，早上有露水，路面滑，控制车速。<br>· 起雾的早晨，记得开自行车前灯。<br>· 体力一般，沿途共享单车点位可以随时收工，不必硬撑40公里。<br>· 公共交通坐地铁16号线到滴水湖站；自驾直接导航滴水湖洲际酒店。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">在市区骑车，一路都在等红灯，节奏是被路口切碎的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">到了滴水湖，节奏反过来。没人催你，是你自己舍不得走。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#333333;text-align:left;margin:0 0 22px;\">湖还是那个湖，只是秋天的下午，光线刚好。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0f6b7d;line-height:1.8;margin:38px 0 22px;\">这个周六，你选骑车，还是看烟花？</p>\n<p style=\"text-align:center;font-size:16px;line-height:1.9;color:#333333;margin:0 0 30px;\">或者，两个都要。</p>\n\n<p style=\"text-align:center;font-size:14px;line-height:1.9;color:#8a8a8a;margin:0 0 10px;\">评论区聊聊：这条线你最想停在哪一站？</p>\n<p style=\"text-align:center;font-size:12px;line-height:1.8;color:#aaaaaa;margin:26px 0 0;\">部分信息参考：临港新片区管委会官网、上海发布、新民晚报·侬好上海</p>\n"
}

      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
