<script id="post-data" type="application/json">
{
  "title": "热滑完成、首列车进厂，南汇支线离通车还差三步",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月28日 10:09",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:13px;letter-spacing:2px;color:#0e6b74;margin:0 0 10px;text-align:center;\">上海临港 · 滴水湖</p>\n<p style=\"font-size:15px;line-height:1.8;color:#8a8a8a;margin:0 0 34px;text-align:center;\">热滑完成、首列车进厂，明年7月的通车目标又近了一步。</p>\n\n<p style=\"background:#f3f6f5;border-left:4px solid #0e6b74;padding:18px 20px;margin:0 0 26px;font-size:15px;line-height:1.9;color:#3a3a3a;\"><strong>10月19日，上海市交通委通报：</strong>国庆假期期间，市域铁路南汇支线热滑试验顺利完成，线路正式由建设阶段转入<strong>联调联试、试运行准备阶段</strong>。<br><br>8月21日市政府新闻发布会上，临港新片区管委会专职副主任唐浩给出的时间表是：<strong>明年7月，南汇支线建成通车。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">国庆前，铁路迷的视频先传开了：首列交付列车深夜开进下盐路车辆基地。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">国庆后，官方消息接上：热滑试验完成。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">10月20日傍晚，更有网友在临港拍到了列车试跑的身姿——车窗亮着灯，从新站旁的高架上驶过。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">一条修了五年的市域铁路，正在按自己的节奏收尾。</p>\n\n<p style=\"margin:0;\"><img src=\"assets/nanhui-line-testrun.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9a9a9a;margin:9px 0 30px;text-align:center;\">2026年10月20日17:35，南汇支线列车试跑通过临港段高架。图源：网友「图鉴攻城狮」摄</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">一年半，六个节点</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">南汇支线全长34.86公里，6座车站，设计时速160公里。主线从浦东T3航站楼站引出，接上海东站的东支线在下盐路并入，终点滴水湖北站，是地下站。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">把它一年半的关键节点排开，进度一目了然：</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 26px;font-size:15px;color:#333333;\">\n<tbody>\n<tr>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;width:32%;color:#0e6b74;font-weight:bold;vertical-align:top;\">2025.11</td>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;line-height:1.7;\">主线结构先行贯通</td>\n</tr>\n<tr>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;color:#0e6b74;font-weight:bold;vertical-align:top;\">2026.06.17</td>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;line-height:1.7;\">全线长轨铺设收官：铺轨39.1公里，焊接接头382个</td>\n</tr>\n<tr>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;color:#0e6b74;font-weight:bold;vertical-align:top;\">2026.08.15</td>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;line-height:1.7;\">最后一榀箱梁落位，主线、支线全线结构贯通，664榀箱梁全部架完</td>\n</tr>\n<tr>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;color:#0e6b74;font-weight:bold;vertical-align:top;\">2026.09.03</td>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;line-height:1.7;\">沿线变电所完成受电启动，进入机电安装与设备调试</td>\n</tr>\n<tr>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;color:#0e6b74;font-weight:bold;vertical-align:top;\">2026.09.26</td>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;line-height:1.7;\">首列列车运抵下盐路车辆基地</td>\n</tr>\n<tr>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;color:#0e6b74;font-weight:bold;vertical-align:top;\">2026.10.01-08</td>\n<td style=\"border-bottom:1px solid #e8e8e8;padding:12px 4px;line-height:1.7;\">国庆期间首次热滑试验完成</td>\n</tr>\n</tbody>\n</table>\n\n<p style=\"font-size:15px;line-height:1.8;color:#8a8a8a;margin:0 0 22px;\">时间线来源：上海市交通委历次通报、上观新闻。9月26日列车到基地一条来自动车组数据库与公开的运输记录，<strong>官方尚未发布正式消息</strong>，这里如实标注。</p>\n\n<p style=\"margin:0;\"><img src=\"assets/nanhui-line-viaduct.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9a9a9a;margin:9px 0 30px;text-align:center;\">建设中的南汇支线高架段。图源：上海申铁</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">热滑是个什么活</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">通俗讲，就是让车在带电的接触网下真正跑起来，看电弓和电线处不处得来。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">这次试验时速60公里，用的是新型全自动热滑检测车，实时测弓力、导高值、拉出值、硬点、拉弧这些指标。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">别小看这一跑。<strong>跑通了，说明轨道、接触网、信号三个系统第一次动态匹配上了</strong>；跑不通，哪个环节有问题就地排查。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">这次的难点是跨线。检测车从机场联络线浦东1号、2号航站楼站出发，途经3号航站楼站，再转入南汇支线的下盐路站、东大公路站区段，全网段跨线热滑，不是单线自己测自己。</p>\n\n<p style=\"margin:0;\"><img src=\"assets/nanhui-line-girder.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9a9a9a;margin:9px 0 30px;text-align:center;\">南汇支线箱梁架设现场，664榀箱梁已全部架完。图源：上海申铁</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">往前数，冷滑阶段先做过限界检查、轮轨测试、弓网接触测试，查出的问题清单化整改，才轮到热滑上场。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">市交通委的通报里写得很直白：下一步盯的就是<strong style=\"color:#0e6b74;\">联调联试、列车试运行</strong>这两个关键节点。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">翻成人话：轨道通了、电通了、车到了，接下来要把所有系统放在一起反复练，练到位才载客。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">通车以后，日子怎么变</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">规划里的时空目标：<strong style=\"color:#0e6b74;\">临港主要节点15分钟到浦东枢纽、60分钟到虹桥枢纽</strong>。南汇支线与机场联络线在T3航站楼站贯通运营，理论上车不停人不换，一路到虹桥。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">终点站是滴水湖北站——地下站，顶板开了四处钢结构天窗，寓意“临港晨露”。它是南汇支线的站，<strong>和16号线滴水湖站不是同一座</strong>，开通后怎么接驳，等公交方案出来，别先按“出站换乘”打算。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">眼下的变化已经落地：9月28日起，16号线工作日午间增开2班直达车，12:30双向发车，龙阳路到滴水湖全程约34分钟，工作日直达车增至6班。</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 24px;font-size:15px;color:#333333;\">\n<tbody>\n<tr>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;color:#0e6b74;font-weight:bold;width:44%;\">龙阳路 → 滴水湖</td>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;\">7:30、7:45、12:30</td>\n</tr>\n<tr>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;color:#0e6b74;font-weight:bold;\">滴水湖 → 龙阳路</td>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;\">12:30、17:20、18:00</td>\n</tr>\n</tbody>\n</table>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">04</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">把话说准：还没定的事</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>一，热滑不等于马上通车。</strong>后面还有联调联试、试运行，每一步都要时间。目前<strong>没有</strong>官方公布的试运行日期。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>二，“明年7月”是发布会口径。</strong>出自8月21日市政府新闻发布会，具体哪天开，等官宣。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>三，15分钟是规划目标。</strong>对应大站快车，站站停会慢，赶飞机按保守时间留余量。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>四，首列车到基地来自民间记录。</strong>动车组数据库显示这批车为4编组、共8列，与机场联络线、南枫线可跨线运营——这是爱好者整理的口径，等官方通稿对表。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">从2021年底开工到今天，南汇支线修了快五年。结构、轨道、供电、车辆、热滑，一块块拼图归位。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">剩下的两块，联调联试和试运行，就是载客前的最后两块。</p>\n\n<p style=\"font-size:17px;line-height:1.9;color:#0e6b74;font-weight:bold;margin:0 0 22px;\">通车后第一趟，你想坐去哪儿？</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 26px;\">评论区聊聊。这条线有新进展，我们还会继续跟。</p>\n\n<p style=\"font-size:13px;line-height:1.7;color:#9a9a9a;margin:0;border-top:1px solid #eaeaea;padding-top:16px;\">本文信息截至2026年10月28日。来源：上海市交通委、上海发布、上观新闻、新华社。</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
