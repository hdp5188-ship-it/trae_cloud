<script id="post-data" type="application/json">
{
  "title": "15分钟到浦东机场，滴水湖等到了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月28日 08:11",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:13px;letter-spacing:2px;color:#0e6b74;margin:0 0 10px;text-align:center;\">上海临港 · 滴水湖</p>\n<p style=\"font-size:15px;line-height:1.8;color:#8a8a8a;margin:0 0 34px;text-align:center;\">明年7月，南汇支线通车。这个月，16号线先在中午加了两班直达车。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">早上七点半，16号线滴水湖站，往龙阳路方向的直达车开出。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">中途不停。34分钟，到终点。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">这班车，以前是没有的。9月28日调图之后，工作日的午间又多出两班直达车，双向都是<strong style=\"color:#0e6b74;\">12:30</strong>发车。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">一座新城的交通，常常不是从剪彩那天开始变的，是从时刻表上多出来的几行字开始的。</p>\n\n<p style=\"background:#f3f6f5;border-left:4px solid #0e6b74;padding:18px 20px;margin:0 0 26px;font-size:15px;line-height:1.9;color:#3a3a3a;\">2026年9月28日起，16号线工作日午间增开2班直达车，龙阳路站、滴水湖站12:30双向发车，全程约34分钟。<br><br>2026年8月21日，临港新片区管委会专职副主任唐浩在市政府新闻发布会上说：<strong>明年7月，市域线南汇支线建成通车。</strong></p>\n\n<p style=\"margin:0;\"><img src=\"assets/dishui-lake-aerial.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9a9a9a;margin:9px 0 30px;text-align:center;\">滴水湖西岛，中银金融中心双子塔。2026年1月29日摄。图源：新华社记者 方喆 摄</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">午间那两班车，已经开了</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">先说已经落地的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">9月28日起，16号线在工作日午间增开2班直达列车。龙阳路站、滴水湖站，双向发车时间都是12:30。全程约34分钟，中途各站不停。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">调整之后，16号线工作日每天有<strong>6班</strong>直达车。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;font-weight:bold;\">直达车时刻表</p>\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 24px;font-size:15px;color:#333333;\">\n<tbody>\n<tr>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;color:#0e6b74;font-weight:bold;width:44%;\">龙阳路 → 滴水湖</td>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;\">7:30、7:45、12:30</td>\n</tr>\n<tr>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;color:#0e6b74;font-weight:bold;\">滴水湖 → 龙阳路</td>\n<td style=\"border-bottom:1px solid #e5e5e5;padding:11px 4px;\">12:30、17:20、18:00</td>\n</tr>\n</tbody>\n</table>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">要提醒一句：这次只动了直达车。大站车的时刻没变，普通车也没变。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">赶时间就认准“直达”两个字，别在站台上凭感觉等。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">为什么补在中午？官方的说法是，服务新片区与市区之间的午间商务出行。早上和傍晚的直达车早就有了，中午这一段一直空着。现在补上了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">对住在湖边的人来说，中午进城办个事、看个病、见个客户，不用再掐着大站车的停站算时间。</p>\n\n<p style=\"margin:0;\"><img src=\"assets/line16-dishuihu-station.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9a9a9a;margin:9px 0 30px;text-align:center;\">16号线滴水湖站2号口。图源：上海地铁</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">真正的重头戏，在明年7月</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">更大的变化不在16号线，在南汇支线。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">8月21日的市政府新闻发布会上，临港新片区管委会专职副主任唐浩把时间说得很直接。</p>\n\n<p style=\"border-left:4px solid #d8c9a3;background:#faf8f3;padding:16px 18px;margin:0 0 24px;font-size:15px;line-height:1.9;color:#555555;\">“临港从区位上看现在是交通末梢……明年7月份市域线南汇支线将建成通车，届时临港到浦东机场、上海东站以及中心城区会越来越便捷。”<br><span style=\"font-size:13px;color:#9a9a9a;\">——临港新片区管委会专职副主任唐浩，2026年8月21日</span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">这条线全长34.86公里，全线6座车站，新建4座。主线从浦东T3航站楼站引出，经鹏翔路、滨海森林公园、星海湾路，到滴水湖北站。东支线接上海东站。设计时速160公里。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">按规划目标，临港主要节点<strong style=\"color:#0e6b74;\">15分钟到浦东枢纽、60分钟到虹桥枢纽</strong>。它和机场联络线贯通运营，去虹桥不用中途换车。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">终点滴水湖北站是地下站。设计里留了个细节：顶板开了四处钢结构天窗，寓意“临港晨露”。</p>\n\n<p style=\"margin:0;\"><img src=\"assets/nanhui-line-viaduct.jpg\" style=\"max-width:100%;width:100%;display:block;\"></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9a9a9a;margin:9px 0 30px;text-align:center;\">建设中的南汇支线高架段。图源：上海申铁</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">进度也对得上。8月15日，全线最后一榀箱梁落位，主线、支线结构贯通，664榀箱梁全部架完。9月初，沿线变电所开始受电。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">接下来是铺轨、机电安装、联调联试。剩下的活不显眼，但一步都省不了。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">三个容易想当然的地方</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>第一，别把两个站名看混。</strong></p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">南汇支线停的是“滴水湖北站”，16号线是“滴水湖站”。名字只差一个字，位置不是一处。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">开通后怎么接驳，要等公交方案出来。现在别按“出站就换乘”去想。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>第二，“明年7月”是官方口径，具体日期等官宣。</strong></p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">从结构贯通到载客，中间还有联调联试、试运行、验收。一条线真正开门那天，往往比结构贯通晚不少。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>第三，15分钟是目标，不是每趟车都能跑到。</strong></p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">大站快车才可能压到这个数，站站停会慢一些。买机票的时候，还是按平时的节奏留时间。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">另外两件事也在推进：S2沪芦高速拓宽改造，沪通铁路二期。临港要补的不是一条线，是一张网。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0e6b74;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 15px;border-radius:8px;\">04</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0e6b74;margin:14px 0 24px;border-bottom:3px solid #0e6b74;padding-bottom:9px;\">这笔账，普通人怎么算</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>赶飞机。</strong>以后从滴水湖北站上车，到浦东机场，按规划目标是15分钟。现在打车走S2，路上少说也要四十分钟。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>通勤。</strong>16号线直达34分钟到龙阳路，这是当下就能用的。南汇支线通了以后，去上海东站、虹桥多一个选择。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\"><strong>过周末。</strong>反过来也成立：市区的人来滴水湖会更方便。湖边一圈8公里，跑步道、骑行道都在，风大，人少。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">要记住的就三件事。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 12px;\">一，工作日12:30，龙阳路和滴水湖各发一班直达，34分钟。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 12px;\">二，南汇支线停滴水湖北站，不是16号线滴水湖站。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 24px;\">三，开通时间以官宣为准，别按某一天去定行程。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">临港被叫了很多年“交通末梢”。这个词不是别人说的，是管委会自己在发布会上讲的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">改起来不快。一条市域铁路，从开工到通车，要跨过好几个年头。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;\">但变化会集中在某一刻出现：站牌亮起来，列车进站，15分钟后，你已经站在浦东机场。</p>\n\n<p style=\"font-size:17px;line-height:1.9;color:#0e6b74;font-weight:bold;margin:0 0 22px;\">那一天，你最想从滴水湖北站去哪儿？</p>\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 26px;\">评论区聊聊。要是最近就要用上，记得把上面那张时刻表存下来。</p>\n\n<p style=\"font-size:13px;line-height:1.7;color:#9a9a9a;margin:0;border-top:1px solid #eaeaea;padding-top:16px;\">本文信息截至2026年10月28日。来源：上海发布、上海市交通委员会、上观新闻、新华社。</p>\n"
}

    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
