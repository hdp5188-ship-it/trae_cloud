<script id="post-data" type="application/json">
{
  "title": "清晨五点半，滴水湖已经有人跑完八公里了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月18日 08:19",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;line-height:1.9;color:#5b6b69;margin:0 0 26px;padding:2px 0 2px 14px;border-left:3px solid #c07a4a;letter-spacing:0.3px;\">从图灵广场出发，绕湖八公里，赶到南汇嘴看日出。临港人的早晨，比市区早醒两个小时。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">十一月的滴水湖，早上五点半，天还是黑的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">风从湖面上横着吹过来，带一点咸味。图灵广场上站满了人，羽绒服、头灯、号码布，白气一口一口往上冒。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">发令枪一响，三千个人往湖里跑。</p>\n<p style=\"font-size:17px;line-height:1.85;color:#14595c;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">这是滴水湖迎新跑，上海所有新年赛事里开始得最早的一个。为的是赶上湖面上那第一缕光。</p>\n<p style=\"margin:0 0 10px;\"><img src=\"assets/dishui-run-2026.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;line-height:1.7;color:#9a9a9a;text-align:center;margin:0 0 26px;\">2026年1月1日，第十届滴水湖迎新跑。图源：文汇报</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">那天有个跑完的朋友发朋友圈，说五点半出门的时候还想骂自己，跑到南汇嘴看见太阳从海平面跳出来，又觉得值了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 10px;letter-spacing:0.4px;\">临港的早晨，大概就是这个样子。人不多，但很早就动起来了。</p>\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#14595c;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#14595c;margin:14px 0 22px;border-bottom:3px solid #14595c;padding-bottom:9px;\">一圈八公里，刚好够想清楚一件事</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">滴水湖是个圆。沿着湖有一圈绿道，走下来八公里上下，跑步的人叫它“小圈”。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">迎新跑走的就是这条路：图灵广场出发，顺时针绕湖，终点在南汇嘴观海公园。八公里，配速六分钟，五十分钟不到就跑完了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">骑车的人玩得更大。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">从滴水湖洲际酒店出发，把环湖一路、二路、三路串起来往外绕，全程四十公里，路线画在地图上像一个巨大的棒棒糖。今年已经是第三届，本地骑友管它叫“周末作业”。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 10px;letter-spacing:0.4px;\">沿途会经过朵云书院滴水湖店、一尺花园、壹号码头、春花秋色公园、星空之境、中国航海博物馆、上海天文馆。骑累了随时能停下来，看书、喝咖啡、逛展。</p>\n<p style=\"margin:0 0 10px;\"><img src=\"assets/lake-forest.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;line-height:1.7;color:#9a9a9a;text-align:center;margin:0 0 24px;\">滴水湖畔的上海天文馆与环湖跑道。图源：乐游上海</p>\n<p style=\"background:#f4f7f6;padding:18px 20px;margin:0 0 24px;border-left:4px solid #14595c;font-size:14px;line-height:2;color:#4a5c5a;\">跑步小圈：环湖绿道约 8 公里，全程平路<br>骑行大圈：约 40 公里，起点洲际酒店<br>迎新跑路线：图灵广场 → 南汇嘴观海公园<br>最佳时段：清晨 5:30—7:00，人少、风小、光好</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">我前几天早上六点四十到的湖边，跑道上已经有不少人。一个穿校服的中学生在拉伸，两个阿姨走得飞快，手里还拎着刚买的菜。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 10px;letter-spacing:0.4px;\">这种画面在上海市区不太容易看到。不是没人跑步，是很少有一圈路，能让跑的人、走的人、买菜的人互不打扰。</p>\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#14595c;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#14595c;margin:14px 0 22px;border-bottom:3px solid #14595c;padding-bottom:9px;\">湖边正在长出新的东西</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">今年这条跑道的东北侧，多了一片围挡。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">滴水湖运动中心（一期）在那里开工了。位置在环湖北三路、乔柏路一带，南边挨着春涟河。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">总用地面积约 6.7 万平方米，差不多九个标准足球场那么大。今年 5 月底公示方案，9 月拿到规划许可，9 月底完成开工放样复验。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">有人在公示期提意见，问能不能少建点足球场、多加点室内场馆。管委会的回复很实在：这块地是公共绿地，按要求建筑占地不能超过总用地的 2%，没有空间再加室内馆。</p>\n<p style=\"font-size:17px;line-height:1.85;color:#14595c;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">换句话说，湖边这片草地，会一直是草地。球场是“铺”在绿地上面的。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">同一个方向再往西，星空之境海绵公园里，超级运动汇也在施工。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">体量 12.4 万平方米，投资接近 26 亿，计划今年年底竣工、2027 年秋天开业。里面最出圈的是一个 24 米深、360 度全透明的室内深潜馆，全国第一家。</p>\n<p style=\"margin:0 0 10px;\"><img src=\"assets/super-sports-2.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;line-height:1.7;color:#9a9a9a;text-align:center;margin:0 0 24px;\">超级运动汇及星空之境海绵公园效果图。图源：上观新闻</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">项目负责人李锐在发布会上讲了个说法，叫“一体两翼”：综合体是主体，星空之境公园和滴水湖运动中心是两个翅膀，室内室外打通，做成全天候的运动空间。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 10px;letter-spacing:0.4px;\">潜水、攀岩、篮球、足球、网球、骑行、水上运动，都在规划里。还配了运动主题酒店、康复中心、轻食餐饮。</p>\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#14595c;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#14595c;margin:14px 0 22px;border-bottom:3px solid #14595c;padding-bottom:9px;\">水变清了，芦苇也回来了</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">跑步的人最先察觉到的，其实不是工地，是水。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">滴水湖今年进了上海美丽幸福河湖的示范名单。全市一百四十三条区管以上河湖里，评上示范的只有三十九条。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">再往前一步，滴水湖幸福河湖建设工程也在推。南岛和环湖一路之间那片水域要治理，八万六千多平方米；北岛内部还有三万平方米。岸坡做生态化，不是简单砌石头。</p>\n<p style=\"margin:0 0 10px;\"><img src=\"assets/lake-reed.jpg\" style=\"max-width:100%;width:100%;\"></p>\n<p style=\"font-size:12px;line-height:1.7;color:#9a9a9a;text-align:center;margin:0 0 24px;\">星空之境海绵公园的清晨，芦苇已经泛白。图源：乐游上海</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">十一月的环湖二路，芦苇穗子一片白。风一过，整片沙沙响，比耳机里的白噪音好听。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">更远一点，临港滨海那片海也在修。牡蛎礁、盐沼湿地、消浪坝一层层铺过去，今年入选了全国海洋生态保护修复典型案例。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">一座填海填出来的城，花了十几年把水养回来。这事说起来不响，但每天早上在湖边跑的人，都能看见。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">所以如果你问我，临港最值得体验的是什么。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">不是哪个展馆，也不是哪个商场。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 26px;letter-spacing:0.4px;\">是早上六点的滴水湖。天刚亮，湖面是灰蓝色的，跑道上有人在喘气，早点摊刚支起来。</p>\n<p style=\"font-size:19px;line-height:1.8;color:#14595c;font-weight:bold;text-align:center;margin:0 0 26px;letter-spacing:0.5px;\">一座新城到底怎么样，看它早上六点的样子就够了。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 18px;letter-spacing:0.4px;\">你上一次在滴水湖看日出，是什么时候？</p>\n<p style=\"font-size:16px;line-height:1.9;color:#3a3a3a;margin:0 0 26px;letter-spacing:0.4px;\">评论区聊聊。如果你有私藏的晨跑路线，也欢迎甩出来，我下次去试试。</p>\n<p style=\"font-size:13px;line-height:1.9;color:#9a9a9a;margin:0;letter-spacing:0.2px;\">参考资料：上观新闻、文汇报、临港新片区管委会官网、上海市水务局</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
