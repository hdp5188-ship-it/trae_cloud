<script id="post-data" type="application/json">
{
  "title": "免费！滴水湖的周末节目单，从下午排到晚上八点",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月31日 13:01",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 10px;\"><img src=\"assets/01-sunken-concert.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">滴水湖下沉式广场的四季歌会。图源：临港新片区管委会</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">上周有朋友问我，周六去滴水湖，要不要提前做攻略。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">我说不用。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">那边的时间表是排好的。歌会、团操、音乐喷泉、无人机加烟花，一年到头轮着来，你只要在傍晚之前到，剩下的跟着人群走就行。</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#16615f;line-height:1.7;margin:30px 0;letter-spacing:1px;\">在滴水湖过周末，攻略确实是多余的东西。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 01 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">先看课表</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 32px;font-size:14px;color:#3b3b3b;\">\n<tr>\n<td style=\"padding:13px 8px;border-bottom:1px solid #e6e6e6;width:122px;color:#16615f;font-weight:bold;line-height:1.6;\">每周六</td>\n<td style=\"padding:13px 8px;border-bottom:1px solid #e6e6e6;line-height:1.8;\">四季歌会、湖畔团操，白天到傍晚都有</td>\n</tr>\n<tr>\n<td style=\"padding:13px 8px;border-bottom:1px solid #e6e6e6;color:#16615f;font-weight:bold;line-height:1.6;\">每晚</td>\n<td style=\"padding:13px 8px;border-bottom:1px solid #e6e6e6;line-height:1.8;\">庆典广场水幕音乐喷泉</td>\n</tr>\n<tr>\n<td style=\"padding:13px 8px;border-bottom:1px solid #e6e6e6;color:#16615f;font-weight:bold;line-height:1.6;\">周六加节假日 20:00</td>\n<td style=\"padding:13px 8px;border-bottom:1px solid #e6e6e6;line-height:1.8;\">无人机表演加烟花，前后二十分钟</td>\n</tr>\n</table>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">歌会。</strong>四季歌会，春天一场、夏天一场、秋天一场、冬天一场，地点在滴水湖下沉式广场。说是演出，更像露天KTV——舞台免费开放，上班族、学生、退休阿姨都能上去唱。唱得好的，居民自己组队，申请季度专场。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">团操。</strong>从2025年8月开始，每周六，三四百人跟着同一个节拍抬手、下蹲。参与者跨度很大，年轻人、小孩、上了年纪的居民站一块儿，没人觉得别扭。今年又加了匹克球、飞镖趣味赛、环湖骑行、五人制足球。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">这些都不是临时凑的活动，是南汇新城镇社区党群服务中心一年一年排出来的“节目单”。团操这个点子，最初就是居民说“在家锻炼坚持不下来”，才有了湖边几百人一起出汗的场面。</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/02-music-fountain.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">庆典广场的音乐喷泉。图源：上观新闻</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">喷泉。</strong>今年新建成的庆典广场，水幕音乐喷泉日日上演，不用等周六。带孩子的尤其多，水一喷起来，小孩就往里冲。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 02 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">20:00那二十分钟</p>\n\n<p style=\"margin:0 0 10px;\"><img src=\"assets/03-fireworks.jpg\" style=\"max-width:100%;width:100%;display:block;border-radius:4px;\"></p>\n<p style=\"text-align:center;font-size:12px;color:#9b9b9b;line-height:1.6;margin:0 0 34px;\">烟花在滴水湖上空绽放。图源：上观新闻</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">重头戏在晚上八点。“临港时刻·时光之戒”光影烟花秀，每周六和部分节假日，准点开始。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">常规场次里，14分钟无人机，6分钟烟花，加起来二十分钟。画面每期换，周周不一样。免费，不用预约，环湖找个地方站着就行。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">整片湖是幕布，湖心那座“水滴”雕塑是轴心。想看楼宇灯光一起亮，往东侧、南侧岸线站；只想看烟花和水面，西侧草坪更舒服。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">有几个坑，提前说：别卡着19:55到；湖边比市区冷，风一起来，短袖根本顶不住；大部分亲水岸线没有围栏，带小孩的看紧点；下大雨、刮大风会取消，出门前刷一眼“Hi临港”公众号。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">散场才是考验。一个普通周末，环湖区域能涌进六万多人，环湖一路堵成“猪肝红”是常态。能地铁就地铁，开车的话停楼宇场库，环湖景观带部分停车场有10块钱一天的优惠。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">回程末班车22:30，看完烟花不慌，但别在草坪上坐到忘了时间。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 03 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">白天也没闲着</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">不是只有晚上热闹。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">图灵集市的摊子一支，吃喝逛拍一下午就没了。湖畔电影、户外演出、市集轮着排，赶上了算运气。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">北岛肆号美术馆8月下旬开馆，白色房子贴着水，上层有个粉调观景平台，正对整片湖。公益展览和公共教育活动常态化，进去不要什么门槛。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">主城区两座社区图书馆开到晚上九点，下班晚的人也用得上。市民健身中心的定价，不高于周边商业场馆的七折。党群服务中心常年有瑜伽、国画、合唱、走秀，绝大多数免费。</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#16615f;line-height:1.7;margin:30px 0;letter-spacing:1px;\">烟花只是把人叫来，留下来靠的是这些不起眼的日常。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 04 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">为什么这些都不要钱</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">临港很清楚自己的短板。没有市中心那么密的商场、演出和展览，晚上容易空。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">它的解法是造“城市共同时刻”：让不同年龄的人，在同一个湖边，反复遇见。歌会、团操、喷泉、烟花，都是这个思路下的产物。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">效果是看得见的。这几年临港累计引进落户人才超过19万人，越来越多的人从“到临港打卡”变成“在临港多留一会儿”。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">所以别把周六晚上那二十分钟当成一场免费的烟花。它更像一张请柬——请你来看看，这里除了厂房和写字楼，还有没有生活。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#16615f;letter-spacing:3px;margin:52px 0 0;\">— 05 —</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#262626;margin:10px 0 30px;\">第一次去，记住五句</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">八点整开始，提前半小时找位置。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">带外套，湖边风大，晚上更凉。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">天气不好会取消，看“Hi临港”的公告。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">散场别往环湖一路挤，坐16号线最省心，末班22:30。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">全程免费，不用买票，也不用预约。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\"><strong style=\"color:#16615f;\">你最喜欢滴水湖周末的哪一段？</strong>歌会、团操、喷泉，还是八点那一抬头？评论区说说，看看哪一段人气最高。</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#3b3b3b;margin:0 0 22px;letter-spacing:0.5px;text-align:justify;\">这篇写的是常规活动。白天怎么逛、怎么吃，另外单开一篇。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#a3a3a3;letter-spacing:2px;margin:40px 0 0;\">— 完 —</p>\n<p style=\"text-align:center;font-size:14px;color:#8a8a8a;line-height:1.9;margin:14px 0 30px;\">图源：临港新片区管委会、上观新闻<br>资料：上观新闻、上海本地宝、Hi临港、临港新片区管委会</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
