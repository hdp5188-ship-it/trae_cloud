<script id="post-data" type="application/json">
{
  "title": "明早7点，Zeus 再撞 Bin：这次输了，直接16强回家",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月31日 22:35",
  "location": "北京",
  "is_original": true,
  "body_html": "<img src=\"assets/hero.jpg\" alt=\"S16 瑞士轮生死战\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 26px;\">▲ AI 概念图，非现场照片</p>\n\n<p style=\"text-align:center;margin:0 0 10px;font-size:13px;letter-spacing:4px;color:#b08a7a;\">S16 全球总决赛 · 瑞士轮最后一夜</p>\n<p style=\"text-align:center;font-size:25px;font-weight:bold;color:#1a1a1a;margin:0 0 8px;line-height:1.45;\">明早 7 点，Zeus 再撞 Bin<br>这次输了，直接 16 强回家</p>\n<p style=\"text-align:center;font-size:15px;color:#777;margin:0 0 30px;line-height:1.6;\">一场 BO3，两个上单，一条生死线</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">先给结论：<strong style=\"color:#c0392b;\">这不是决赛，是生死战。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">北京时间 11 月 1 日，周日早上，S16 瑞士轮最后三场 BO3 依次开打。HLE 对 BLG 压轴出场，赢的进八强，输的直接 16 强回家。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 24px;\">Zeus 对 Bin，就摆在这一场里。</p>\n\n<p style=\"background:#f8f4f2;border-left:4px solid #c0392b;padding:16px 18px;font-size:15px;color:#333;line-height:1.95;margin:0 0 28px;\"><strong>时间：</strong>11 月 1 日（周日）凌晨 1:00 轮次开打，HLE 对 BLG 为第三场，预计早上 7:00 左右（以官方为准）<br><strong>赛制：</strong>BO3，胜者以 3-2 进入八强，败者止步 16 强<br><strong>背景：</strong>八强已定五席——GEN、DK、T1、iG、TES；2-2 组六队抢最后三张门票<br><strong>首发：</strong>HLE 　Zeus / Kanavi / Zeka / Gumayusi / Delight<br>　　　　　BLG 　Bin / Xun / Knight / Viper / ON</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#c0392b;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#c0392b;margin:14px 0 22px;border-bottom:3px solid #c0392b;padding-bottom:9px;\">三个月前，Bin 从 Zeus 手里丢过一次冠军</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">7 月 12 日，MSI 决赛。HLE 3-2 赢下 BLG，Zeus 拿到 FMVP，也补齐了自己荣誉墙上最后一块拼图。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">那轮系列赛，BLG 一度 2-1 领先，手里握着赛点。第四局 Zeus 掏出乌鸦，第五局锁下蒙多，硬生生把上路的天平掰了回去。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">Bin 赛后说得很直接：两次输给 Zeus，都是 2-3。另一次，是 2024 年 S14 决赛，T1 3-2 BLG。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c0392b;line-height:1.7;margin:26px 0 26px;\">两次世界大赛的决赛，两次 2-3。<br>都只差一局。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 14px;\">\n<tr>\n<th style=\"background:#2b2b2b;color:#fff;padding:10px 8px;text-align:left;border:1px solid #2b2b2b;\">时间</th>\n<th style=\"background:#2b2b2b;color:#fff;padding:10px 8px;text-align:left;border:1px solid #2b2b2b;\">赛事</th>\n<th style=\"background:#2b2b2b;color:#fff;padding:10px 8px;text-align:left;border:1px solid #2b2b2b;\">结果</th>\n<th style=\"background:#2b2b2b;color:#fff;padding:10px 8px;text-align:left;border:1px solid #2b2b2b;\">赢家</th>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;\">2024.11</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;\">S14 决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;\">T1 3-2 BLG</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;color:#c0392b;font-weight:bold;\">Zeus</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;\">2024.5</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;\">MSI 败者组决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;\">BLG 3-2 T1</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;color:#2f6fb3;font-weight:bold;\">Bin</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;\">2026.7.9</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;\">MSI 胜者组决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;\">BLG 3-1 HLE</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;color:#2f6fb3;font-weight:bold;\">Bin</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;\">2026.7.12</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;\">MSI 决赛</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;\">HLE 3-2 BLG</td>\n<td style=\"padding:10px 8px;border:1px solid #e3ddd8;background:#faf8f7;color:#c0392b;font-weight:bold;\">Zeus</td>\n</tr>\n<tr>\n<td style=\"padding:10px 8px;border:1px solid #c0392b;background:#fdf1ef;font-weight:bold;\">2026.11.1</td>\n<td style=\"padding:10px 8px;border:1px solid #c0392b;background:#fdf1ef;font-weight:bold;\">S16 瑞士轮</td>\n<td style=\"padding:10px 8px;border:1px solid #c0392b;background:#fdf1ef;font-weight:bold;\">BO3 生死战</td>\n<td style=\"padding:10px 8px;border:1px solid #c0392b;background:#fdf1ef;font-weight:bold;\">待定</td>\n</tr>\n</table>\n<p style=\"font-size:12px;color:#999;line-height:1.7;margin:0 0 24px;\">▲ 交手记录据公开赛事资料整理；表格只列 BO5 与即将开打的这场。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">有个细节容易被忽略：在 MSI 的 BO5 里，Zeus 此前一直被 Bin 压着。直到今年 7 月那场决赛，他才第一次在 BO5 里赢下 Bin。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">所以明早这场 BO3，不是\"Zeus 顺手再赢一次\"。是 Bin 最想还的一笔账。</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#c0392b;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#c0392b;margin:14px 0 22px;border-bottom:3px solid #c0392b;padding-bottom:9px;\">一边是地狱签运，一边是好运用完</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">HLE 的瑞士轮，几乎是硬啃出来的。首轮赢 TES，接着连输 GEN、iG，第四轮 2-0 拿下 G2，才把自己拉回 2-2。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">五轮对手：TES、GEN、iG、G2、BLG。<strong>四支 LPL/LCK 队伍，加一个 LEC 一号种子。</strong>据虎扑统计，这是标准的\"地狱签运\"。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">BLG 的路也不平。首轮 0-1 输给 MKOI，爆出本届瑞士轮最大的冷门之一；之后赢下 KC，第四轮 1-2 不敌 TES，掉进 2-2。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">还有一条数据，BLG 粉丝看了会沉默：据虎扑统计，S13 首轮赢过 KT 之后，<strong style=\"color:#c0392b;\">BLG 在瑞士轮面对 LPL/LCK 队伍，再没赢过一场。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">抽签也很戏剧。LOS 先和 LYON 抽到一起，规避原则之下，BLG 只剩 HLE 一个对手。瑞士轮前四轮一次 LCK 都没碰到的队伍，最后一轮被直接推到了 HLE 面前。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;line-height:1.7;margin:26px 0 28px;\">运气这东西，攒到最后，<br>可能一次全还回去。</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#c0392b;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#c0392b;margin:14px 0 22px;border-bottom:3px solid #c0392b;padding-bottom:9px;\">上路这一栏，可能直接决定谁回家</p>\n\n<img src=\"assets/top-duel.jpg\" alt=\"上路对决概念图\" style=\"max-width:100%;height:auto;display:block;margin:0 auto 10px;border-radius:8px;\">\n<p style=\"text-align:center;font-size:12px;color:#999;margin:0 0 24px;\">▲ AI 概念图：两种上路解法，不是现场照片</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">MSI 决赛第五局，Bin 先手剑魔，Zeus 后手蒙多。剑魔前 20 分钟占优，蒙多越拖越无解。HLE 就靠这个\"拖\"字，把比赛拖进了自己的节奏。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">Zeus 的原话是：<strong>\"从去年开始，我更在意怎么给整局游戏带来影响，而不只是打好对线。\"</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">解说米勒当时发了条微博：\"史诗级的上路差距，Bin 何时才能理解上单不只是对线。\"这话刺耳，但确实说中了那五局的走向。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">Bin 这边不服。输给 TES 之后，他在采访里说，自己线上没问题，输在团队决策和中期团战。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">两个人对\"上单\"的理解，正好是两个方向：一个想把上路打成突破口，一个想把上路变成整局游戏的支点。BO3 只有三局，谁先把自己的版本打出来，谁就占先手。</p>\n\n<p style=\"background:#f5f5f5;border-left:3px solid #999;padding:14px 18px;font-size:15px;color:#555;line-height:1.9;margin:0 0 18px;\">\"如果明天取胜，那 HLE 应该能成为本届世界赛的主人公。\"<br><span style=\"font-size:13px;color:#999;\">—— Gumayusi，HLE 赛后采访</span></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 28px;\">赔率也站在 HLE 这边：国内预测机构给出的指数是 HLE 1.59、BLG 2.31。但 BO3 的容错，比 BO5 更低——一局手感不对，就没有第四局给你调整。</p>\n\n<p style=\"margin:44px 0 0;\"><span style=\"display:inline-block;background:#c0392b;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#c0392b;margin:14px 0 22px;border-bottom:3px solid #c0392b;padding-bottom:9px;\">明早看什么</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>一、Bin 的复仇。</strong>从 S14 决赛到 MSI 决赛，两次 2-3。这次不是决赛，却更直接——输了连八强都进不去。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>二、Zeus 的上路影响力。</strong>对 G2 那场，他拿奎桑提打出全场最高伤害。上单在他手里，可以是坦克，也可以是第二个 carry。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\"><strong>三、赛区账本。</strong>BLG 出局，LPL 只剩 iG、TES；HLE 出局，LCK 只剩 GEN、DK、T1。三场打完，八强对阵抽签随之揭晓。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">这也是为什么这场值得早起。它不只决定一张八强门票，还会改写整个淘汰赛的版图。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;line-height:1.7;margin:28px 0 22px;\">闹钟定在 6:50。<br>刷牙的时候，BP 就开始了。</p>\n\n<p style=\"background:#1a1a1a;padding:20px 20px 6px;border-radius:8px 8px 0 0;margin:0;font-size:17px;font-weight:bold;color:#fff;line-height:1.7;\">评论区先押一手：</p>\n<p style=\"background:#1a1a1a;padding:0 20px 8px;margin:0;font-size:15px;color:#e8e8e8;line-height:1.9;\">HLE 2-1，还是 BLG 2-1？敢不敢把比分打出来。</p>\n<p style=\"background:#1a1a1a;padding:0 20px 20px;border-radius:0 0 8px 8px;margin:0 0 18px;font-size:15px;color:#e8e8e8;line-height:1.9;\">顺手转给那个说\"明早叫我\"的朋友。他大概率起不来。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.9;margin:0 0 16px;\">点个关注。赛后我会把比分、关键团战和八强抽签结果，一起整理给你。</p>\n\n<p style=\"font-size:12px;color:#999;line-height:1.8;margin:26px 0 0;\">资料来源：英雄联盟赛事官方赛程、虎扑电竞、直播吧、腾讯新闻、Gamemeca。赛程时间与首发名单以官方最终公布为准；赔率仅为赛前参考，不构成任何建议。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
